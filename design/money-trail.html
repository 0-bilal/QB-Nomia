<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسار الفلوس</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff; --commitment:#5fb3ff; --owed-to:#2ee6c8; --owed-by:#ff9a4d;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.56,.64,1); --expo:cubic-bezier(.16,1,.3,1); --calm:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:18px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .press{transition:transform .18s var(--spring)}.press:active{transform:scale(.97)}

  .intro{width:100%;max-width:420px}
  .intro h1{font-size:22px;font-weight:700}
  .intro p{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.7}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px}
  .plbl{font-size:11.5px;color:var(--text-3);font-weight:500;margin-bottom:7px;display:flex;justify-content:space-between}
  .plbl b{color:var(--text-2);font-weight:600}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong);overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:background .3s var(--spring),color .2s}
  .seg button.on{background:var(--accent);color:var(--on-accent)}

  .phone{width:390px;max-width:100%;min-height:820px;background:var(--bg);border-radius:40px;border:1px solid #1d1d22;padding:22px 20px 30px;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:28px;padding:18px 14px 24px}}
  .aurora{position:absolute;inset:-120px -60px auto;height:320px;background:radial-gradient(60% 60% at 70% 30%,rgba(255,255,255,.06),transparent 70%);pointer-events:none}
  .hdr{display:flex;justify-content:space-between;align-items:center;position:relative}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--border)}
  .h1{font-size:28px;font-weight:700;margin:14px 0 4px;position:relative}
  .sub{font-size:11.5px;color:var(--text-3);margin-bottom:16px;position:relative}
  .fade{animation:fade .45s var(--expo) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .rise{animation:fade .5s var(--expo) both;animation-delay:calc(var(--i,0)*60ms)}

  .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .ft{font-size:13.5px;font-weight:600}
  .fs{font-size:11px;color:var(--text-3);margin-top:2px}
  .rs{font-family:var(--font-sans);font-size:11px;color:var(--text-3);font-weight:500;margin-inline-start:3px}
  .av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex-shrink:0}

  .hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(255,255,255,.09);padding:16px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.06),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--bg))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px}
  .grp{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--text-3);margin:18px 6px 8px}

  /* الكبسولة الذكية */
  .capsule{position:relative;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 12px 30px -12px rgba(0,0,0,.8);height:40px;align-items:center}
  .capsule button{height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);transition:background .3s var(--spring),color .2s;white-space:nowrap}
  .capsule button.on{background:var(--accent);color:var(--on-accent)}

  /* شريط الدفعة */
  .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-hi);gap:2px;margin-top:12px}
  .bar i{display:block;height:100%;transform-origin:right;animation:grow .7s var(--calm) both}
  @keyframes grow{from{transform:scaleX(0)}}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:11px;color:var(--text-2)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:7px;height:7px;border-radius:50%}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:600}

  /* الخط الزمني */
  .tl{position:relative;padding-right:22px}
  .tl::before{content:'';position:absolute;right:7px;top:8px;bottom:8px;width:2px;background:var(--border-strong);border-radius:2px}
  .ti{position:relative;padding:9px 0}
  .ti .dot{position:absolute;right:-20px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
  .ti .d{font-size:10.5px;color:var(--text-3)}
  .ti .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
  .ti .t{font-size:13px;font-weight:600}
  .ti .n{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.6}
  .sublist{margin-top:6px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);padding:4px 10px}
  .sublist div{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);padding:5px 0}
  .sublist div+div{border-top:1px solid var(--border)}

  /* الشجرة */
  .tree{position:relative;margin-top:4px}
  .node{display:flex;align-items:center;gap:10px;padding:10px 0}
  .branch{position:relative;padding-right:26px}
  .branch::before{content:'';position:absolute;right:11px;top:0;bottom:22px;width:2px;background:var(--border-strong)}
  .branch .node{position:relative}
  .branch .node::before{content:'';position:absolute;right:-15px;top:50%;width:12px;height:2px;background:var(--border-strong)}
  .pct{height:4px;border-radius:99px;margin-top:6px;background:var(--surface-hi);overflow:hidden}
  .pct i{display:block;height:100%;border-radius:99px;transform-origin:right;animation:grow .7s var(--calm) both}

  .info{display:flex;gap:10px;align-items:flex-start;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--border);padding:11px 13px;font-size:11.5px;color:var(--text-2);line-height:1.7}
  .info svg{flex-shrink:0;margin-top:2px;color:var(--text-3)}

  /* اللوحة الثابتة */
  .amount{text-align:center;margin:14px 0 10px}
  .amount .q{font-size:12.5px;color:var(--text-2);margin-bottom:2px}
  .amount .v{font-size:48px;font-weight:700;line-height:1.1}
  .amount .v span{font-family:var(--font-sans);font-size:17px;opacity:.6;font-weight:500;margin-inline-start:8px}
  .field{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:right}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 10px;padding:0 20px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2);transition:background .3s var(--spring),color .2s,border-color .2s}
  .chip.src{position:relative}
  .chip.src.on{background:var(--owed-by);border-color:var(--owed-by);color:var(--on-accent)}
  .chip.src.hint{border-color:color-mix(in srgb,var(--owed-by) 45%,transparent);color:var(--owed-by);animation:pop .5s var(--spring) both}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pad button{height:50px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-family:var(--font-num);font-size:20px;font-weight:600}
  .pad .save{grid-column:4;grid-row:1/span 3;height:auto;color:var(--on-accent);font-family:var(--font-sans);font-size:14px;font-weight:700;border:0}
  .pad .zero{grid-column:span 2}

  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:5;animation:fadein .18s both}
  @keyframes fadein{from{opacity:0}}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:86%;overflow-y:auto;border-radius:32px 32px 0 0;border:1px solid var(--border-strong);border-bottom:0;background:var(--surface-el);padding:10px 16px 26px;animation:sheetin .42s var(--expo) both}
  @keyframes sheetin{from{transform:translateY(100%)}}
  .handle{width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:right;margin-bottom:8px;transition:border-color .2s}
  .opt.on{border-color:var(--accent-line,rgba(255,255,255,.28))}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0}
  .opt.on .radio{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
  .wbtn{width:100%;padding:14px;border-radius:999px;background:linear-gradient(150deg,#fff,#a9a9b3);color:var(--on-accent);font-size:14px;font-weight:700;margin-top:12px}

  .chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
  .chk+.chk{border-top:1px solid var(--border)}
  .chk .ic{width:28px;height:28px;border-radius:50%}

  .note{width:100%;max-width:420px;font-size:12px;color:var(--text-2);line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px}
  .note .k{color:var(--text-3);font-size:11px;display:block;margin-bottom:2px}
  .note b{color:var(--text);font-weight:600}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="intro">
  <h1>مسار الفلوس</h1>
  <p>كل دخل يصير «دفعة» لها هوية. كل ريال يخرج يُنسب لدفعة بالأقدم أولًا، والتحويل لا يغيّر هويته، والسلفة تبقى معلّقة على دفعتها حتى ترجع لها. الهدف: تفتح أي دخل وتعرف وين راح كل ريال منه، ومتى، وكم باقي.</p>
</div>

<div class="panel">
  <div>
    <div class="plbl">الشاشة <b id="nScr"></b></div>
    <div class="seg" id="segScr">
      <button data-v="0" class="on">الدفعات</button>
      <button data-v="1">قصة دفعة</button>
      <button data-v="2">دفعة مقترضة</button>
      <button data-v="3">سلفة من سلفة</button>
      <button data-v="4">مصدر حركة</button>
      <button data-v="5">المستخدم القديم</button>
    </div>
  </div>
  <div id="optBox">
    <div class="plbl">عرض توزيع الدفعة <b id="nOpt"></b></div>
    <div class="seg" id="segOpt">
      <button data-v="0" class="on"><span class="num">1</span> · مخطط تدفق</button>
      <button data-v="1"><span class="num">2</span> · شجرة</button>
    </div>
  </div>
</div>

<div class="phone"><span class="aurora"></span><div id="root"></div></div>

<div class="note" id="note"></div>

<script>
const svg = (p,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`
const f = n => Math.abs(n).toLocaleString('en-US')
const soft = (c,p=15) => `color-mix(in srgb,${c} ${p}%,transparent)`
const PALETTE = ['#45C8FF','#A1A1AD','#FFBF47','#2EE6C8','#FF9A4D','#FF5F6D','#E4E4EA']
function colorFor(seed){let h=0;for(let i=0;i<seed.length;i++)h=(h<<5)-h+seed.charCodeAt(i);return PALETTE[Math.abs(h|0)%PALETTE.length]}
const av = (n,s=36) => { const c=colorFor(n); return `<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.4}px;background:radial-gradient(120% 120% at 30% 20%,${c}55,${c}14 70%);box-shadow:inset 0 0 0 1.5px ${c}40;color:${c}">${n[0]}</span>` }
const I = {
  back:svg('<path d="m9 6 6 6-6 6"/>',18,2.2),
  in:svg('<path d="M7 17 17 7M9 7h8v8"/>',17,2),
  out:svg('<path d="M17 7 7 17M15 17H7V9"/>',16,2),
  salary:svg('<rect x="3" y="6" width="18" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6.5 9.5h.01M17.5 15.5h.01"/>',18),
  gift:svg('<rect x="3" y="8" width="18" height="5" rx="1.5"/><path d="M5 13v7h14v-7M12 8v12M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/>',18),
  hand:svg('<path d="M7 11V7a2 2 0 0 1 4 0v4M11 10V5a2 2 0 0 1 4 0v6M15 9a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4a1.8 1.8 0 0 1 3-2L7 13"/>',18),
  vault:svg('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M12 9v-1M15 12h1"/>',18),
  history:svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 8v4l3 2"/>',18),
  swap:svg('<path d="M7 7h11l-3-3M17 17H6l3 3"/>',16,2),
  check:svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>',14,2.8),
  alert:svg('<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2h.01"/>',14,2.2),
  info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',16,2),
  chev:svg('<path d="m15 6-6 6 6 6"/>',14,2.4),
  cal:svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',14,2.2),
  notep:svg('<path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/>',14,2.2),
  link:svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',14,2.2),
  cart:svg('<path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>',18),
  x:svg('<path d="M6 6l12 12M18 6 6 18"/>',15,2.2),
  sparkle:svg('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',20,1.9),
}

/* الألوان الدلالية لوجهات الفلوس */
const K = {
  spent:   {c:'var(--expense)', l:'صُرف'},
  people:  {c:'var(--owed-to)', l:'عند الناس'},
  repaid:  {c:'var(--owed-by)', l:'سداد التزام'},
  left:    {c:'var(--accent)',  l:'باقي لك'},
}

/* ===== البيانات ===== */
const BATCHES = [
  {id:'oct', m:'أكتوبر 2026', name:'راتب أكتوبر', src:'راتب', icon:'salary', c:'var(--commitment)', date:'2026/10/01', acc:'الراجحي', total:3000, parts:{spent:640,left:2360}, open:true},
  {id:'kh',  m:'أكتوبر 2026', name:'سلفة من خالد', src:'سلفة عليك', icon:'hand', c:'var(--owed-by)', date:'2026/10/05', acc:'الكاش', total:1000, parts:{repaid:600,people:400}, open:true, borrowed:{who:'خالد',owe:400}},
  {id:'sep', m:'سبتمبر 2026', name:'راتب سبتمبر', src:'راتب', icon:'salary', c:'var(--commitment)', date:'2026/09/01', acc:'الراجحي', total:3000, parts:{spent:2100,left:900}, open:true},
  {id:'bon', m:'سبتمبر 2026', name:'مكافأة أداء', src:'مكافأة', icon:'gift', c:'var(--income)', date:'2026/09/14', acc:'الراجحي', total:500, parts:{spent:500}, open:false},
  {id:'aug', m:'أغسطس 2026', name:'راتب أغسطس', src:'راتب', icon:'salary', c:'var(--commitment)', date:'2026/08/01', acc:'الراجحي', total:3000, parts:{spent:1500,people:200,left:1300}, open:true},
  {id:'old', m:'قبل بداية التتبع', name:'رصيد سابق', src:'كان في حساباتك قبل أول حركة', icon:'history', c:'var(--text-2)', date:'2026/03/02', acc:'كل الحسابات', total:2300, parts:{spent:1850,left:450}, open:true},
]
const S = { scr:0, opt:0, filter:'all', srcOn:true, sheet:false, pick:0 }

const bar = (b) => `<div class="bar">${Object.entries(b.parts).map(([k,v],i)=>`<i style="width:${v/b.total*100}%;background:${K[k].c};animation-delay:${i*90}ms"></i>`).join('')}</div>`
const legend = (b) => `<div class="legend">${Object.entries(b.parts).map(([k,v])=>`<span><i style="background:${K[k].c}"></i>${K[k].l} <b class="num" style="color:var(--text)">${f(v)}</b></span>`).join('')}</div>`
const status = (b) => b.borrowed
  ? `<span class="badge" style="background:${soft('var(--owed-by)')};color:var(--owed-by)">مقترضة</span>`
  : b.open ? `<span class="badge" style="background:rgba(255,255,255,.06);color:var(--text-2)">مفتوحة</span>`
  : `<span class="badge" style="background:${soft('var(--income)')};color:var(--income)">${I.check} مكتملة</span>`

function batchCard(b,i){
  return `<div class="card press rise" style="--i:${i};margin-bottom:8px" data-open="${b.id}">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="ic" style="background:${soft(b.c)};color:${b.c}">${I[b.icon]}</span>
      <div style="flex:1;min-width:0"><div class="ft">${b.name}</div><div class="fs"><span class="num">${b.date}</span> · ${b.acc}</div></div>
      <div style="text-align:left"><div class="num" style="font-size:15px;font-weight:700">${f(b.total)}<span class="rs">ر.س</span></div><div style="margin-top:3px">${status(b)}</div></div>
    </div>
    ${bar(b)}${legend(b)}
    ${b.borrowed?`<div class="fs" style="margin-top:8px;color:var(--owed-by)">باقي عليك لـ${b.borrowed.who} <span class="num">${f(b.borrowed.owe)}</span> ر.س</div>`:''}
  </div>`
}

/* ===== 1. الدفعات ===== */
function listScreen(){
  const filt = BATCHES.filter(b => S.filter==='all' || (S.filter==='open'&&b.open&&!b.borrowed) || (S.filter==='done'&&!b.open) || (S.filter==='borrowed'&&b.borrowed))
  const months = [...new Set(filt.map(b=>b.m))]
  return `<div class="hdr"><span class="gb">${I.back}</span><span></span><span style="width:40px"></span></div>
    <div class="h1">مسار فلوسك</div><div class="sub">كل دخل دفعة، وكل ريال له وجهة</div>
    <div class="hero rise">
      <div style="font-size:12px;color:var(--text-2)">باقي لك من الدفعات المفتوحة</div>

/* ===== 2. قصة دفعة ===== */
function sankey(b, dests){
  const W=350,H=210,sx=338,dx=150,gap=10
  const total=b.total, usable=H-gap*(dests.length-1)
  let sy=0, dy=0, paths='', nodes='', labels=''
  dests.forEach((d,i)=>{
    const h=Math.max(d.v/total*usable,6)
    const s0=sy, s1=sy+d.v/total*H, t0=dy, t1=dy+h, mx=(sx+dx)/2
    paths+=`<path d="M${sx},${s0} C${mx},${s0} ${mx},${t0} ${dx+8},${t0} L${dx+8},${t1} C${mx},${t1} ${mx},${s1} ${sx},${s1} Z" fill="${d.c}" opacity=".22" style="animation:fadein .6s ${200+i*120}ms both"/>`
    nodes+=`<rect x="${dx}" y="${t0}" width="8" height="${h}" rx="3" fill="${d.c}"/>`
    labels+=`<text x="${dx-8}" y="${t0+h/2-2}" text-anchor="end" fill="#f4f4f6" font-size="12" font-weight="600" font-family="Readex Pro">${d.l}</text>
      <text x="${dx-8}" y="${t0+h/2+13}" text-anchor="end" fill="${d.c}" font-size="11.5" font-weight="700" font-family="Inter">${f(d.v)}</text>`
    sy=s1; dy=t1+gap
  })
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="direction:ltr;overflow:visible;margin-top:8px">${paths}<rect x="${sx}" y="0" width="10" height="${H}" rx="4" fill="${b.c}"/>${nodes}${labels}</svg>`
}
function tree(b, dests){

    <div class="branch">${dests.map((d,i)=>`<div class="node rise" style="--i:${i}"><div style="flex:1;min-width:0">
      <div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:600">${d.l}</span><span class="num" style="font-weight:700;color:${d.c}">${f(d.v)}</span></div>
      ${d.n?`<div class="fs">${d.n}</div>`:''}<div class="pct"><i style="width:${d.v/b.total*100}%;background:${d.c};animation-delay:${i*90}ms"></i></div></div></div>`).join('')}</div></div>`
}

        ['رصيد سابق <span class="num">2,300</span> ر.س','اللي كان في حساباتك قبل أول حركة',true],
        ['<span class="num">37</span> سداد ربطناه بسلفته','كل سداد على أقدم سلفة مفتوحة للشخص',true],
      ].map(([t,s])=>`<div class="chk"><span class="ic" style="background:${soft('var(--income)')};color:var(--income)">${I.check}</span><div style="flex:1"><div class="ft" style="font-size:13px">${t}</div>${s?`<div class="fs">${s}</div>`:''}</div></div>`).join('')}
    </div>
    <div class="grp"><span style="font-size:14px;color:var(--text)">تحتاج نظرة</span><span class="num">2</span></div>
    <div class="card rise" style="--i:2;padding:6px 14px">
      <div class="chk"><span class="ic" style="background:${soft('var(--subscription,#ffbf47)')};color:#ffbf47">${I.alert}</span><div style="flex:1"><div class="ft" style="font-size:13px">مصروف <span class="num">120</span> بلا مصدر</div><div class="fs">وقود <span class="num">2026/03/14</span> · الكاش ما كان فيه كفاية وقتها. غالبًا دخل ما انسجّل.</div></div><span style="color:var(--text-3);margin-top:6px">${I.chev}</span></div>
      <div class="chk"><span class="ic" style="background:${soft('#ffbf47')};color:#ffbf47">${I.alert}</span><div style="flex:1"><div class="ft" style="font-size:13px">أحمد رجّع <span class="num">50</span> زيادة</div><div class="fs">أكثر من سلفه وقتها · صارت دفعة «زيادة من أحمد».</div></div><span style="color:var(--text-3);margin-top:6px">${I.chev}</span></div>
    </div>
    <button class="wbtn press" style="margin-top:16px">عرض مسار فلوسك</button>`
}

const SCREENS = [listScreen, storyScreen, borrowedScreen, loanFormScreen, sourceScreen, migrateScreen]
const NOTES = [
  () => '<span class="k">الدفعات</span>كل دخل بطاقة مستقلة مجمّعة بالشهر. الشريط يقسم الدفعة: <b>أحمر صُرف</b>، <b>تركوازي عند الناس</b>، <b>برتقالي سداد التزام</b>، <b>أبيض باقي لك</b>. التحويل لا يظهر كقسم لأن الفلوس المحوّلة ما زالت لك. «رصيد سابق» آخر القائمة. الكبسولة تفلتر: الكل / مفتوحة / مكتملة / مقترضة. <b>جرّب الفلتر واضغط أي بطاقة.</b> المكان المقترح: «المزيد» + زر «وين راح؟» في تفاصيل أي دخل.',
  () => S.opt===0
    ? '<span class="k">خيار 1 — مخطط تدفق</span>الدفعة عمود يمين، وتتفرع منه الوجهات بعرض يساوي المبلغ. واضح بصريًا للنسب، وتحته القصة بالترتيب الزمني: السلفة، التحويل، المصاريف مجمّعة، رجوع 300 من أحمد لنفس الدفعة، وصرفها بعدها.'
    : '<span class="k">خيار 2 — شجرة</span>نفس المعلومة كصفوف متفرعة، كل وجهة بسطر وصف وشريط نسبة. أوضح للتفاصيل النصية (رجع منها 300)، وأقل بصريًا من المخطط.',
  () => '<span class="k">دفعة مقترضة</span>سلفة خالد دفعة من نوع خاص: برتقالية، ليست دخلًا، وعليها التزام. فوق: مسار المبلغ خالد ← أنت ← فهد، وشريطان: كم رجع من فهد، وكم سدّدت لخالد. تُغلق لما يكتمل الاثنان.',
  () => '<span class="k">سلفة من سلفة — الاقتراح الذكي</span>تسجّل سلفة لفهد من الكاش، وفي الكاش دفعة مقترضة مفتوحة، فتظهر كبسولة «من سلفة خالد؟» أول صف الكبسولات. السطر فوقها يوضّح من وين بتطلع الفلوس في الحالتين. <b>اضغط الكبسولة لتشوف الفرق.</b> لو ما فيه دفعة مقترضة في الحساب ما تظهر أصلًا.',
  () => '<span class="k">مصدر حركة</span>في تفاصيل أي مصروف قسم «من أي فلوس؟». هنا مصروف 450 انقسم: 300 من راتب أغسطس (اللي رجعت من أحمد) و150 من سبتمبر. <b>اضغط «تغيير»</b> لتثبيت دفعة معيّنة لهذه الحركة فقط.',
  () => '<span class="k">المستخدم القديم</span>ما يحتاج يسوي شيء. التوزيع يُحسب من السجل ولا يُخزَّن، فأول فتح يعيد ترتيب كل الحركات القديمة بالأقدم أولًا. الأرصدة لا تتغيّر. الحالات اللي ما تنحل تلقائيًا تظهر في «تحتاج نظرة»، والضغط عليها يفتح الحركة.',
]

const root = document.getElementById('root')
function render(){
  root.innerHTML = `<div class="fade">${SCREENS[S.scr]()}</div>`
  document.querySelectorAll('#segScr button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.scr))
  document.querySelectorAll('#segOpt button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.opt))
  document.getElementById('optBox').style.display = S.scr===1?'':'none'
  document.getElementById('nScr').textContent = document.querySelector(`#segScr button[data-v="${S.scr}"]`).textContent
  document.getElementById('nOpt').textContent = 'خيار '+(S.opt+1)
  document.getElementById('note').innerHTML = NOTES[S.scr]()
}
document.getElementById('segScr').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.scr=+b.dataset.v;S.sheet=false;render()}
document.getElementById('segOpt').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.opt=+b.dataset.v;render()}
root.addEventListener('click',e=>{
  const fl=e.target.closest('[data-f]'); if(fl){S.filter=fl.dataset.f;render();return}
  const o=e.target.closest('[data-open]'); if(o){S.scr=o.dataset.open==='kh'?2:1;render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(e.target.closest('[data-src]')){S.srcOn=!S.srcOn;render();return}
  const p=e.target.closest('[data-pick]'); if(p){S.pick=+p.dataset.pick;render();return}
  if(e.target.closest('[data-close]')){S.sheet=false;render();return}
  if(e.target.closest('[data-sheet]')){S.sheet=true;render()}
})
render()
</script>
</body>
