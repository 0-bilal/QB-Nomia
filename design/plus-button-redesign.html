<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زر الإضافة — أشكال مقترحة</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050506;--surface:#121215;--surface-hi:#24242a;--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6;--on-accent:#0a0a0c;--text:#f4f4f6;--text-2:#a1a1ad;--text-3:#62626d;
    --income:#3ee08f;--expense:#ff5f6d;--transfer:#8b7bff;--owed:#2ee6c8;--sans:'Readex Pro',system-ui,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#000;font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:18px 12px 60px;gap:14px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .intro{max-width:400px;font-size:12px;color:#8f8f99;line-height:1.8;text-align:center}
  .opt{width:100%;max-width:400px;border-radius:28px;border:1px solid #1d1d22;background:var(--bg);overflow:hidden;position:relative}
  .head{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
  .head b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#f4f4f6;color:#0a0a0c;font-size:14px}
  .head h3{font-size:14px}.head small{display:block;font-size:11px;color:var(--text-3);font-weight:500;margin-top:1px}
  .stage{position:relative;height:250px;margin-top:6px;background:
     radial-gradient(60% 50% at 70% 10%,rgba(139,123,255,.1),transparent 70%),
     repeating-linear-gradient(180deg,transparent 0 58px,rgba(255,255,255,.03) 58px 60px)}
  .fake{position:absolute;inset:14px 16px auto;display:flex;flex-direction:column;gap:8px}
  .fake i{height:46px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
  .opt.open .scrim{opacity:1;pointer-events:auto}
  .menu{position:absolute;left:50%;bottom:96px;transform:translate(-50%,24px) scale(.4);transform-origin:50% 100%;opacity:0;transition:all .45s var(--spring);display:flex;gap:3px;padding:5px;border-radius:99px;background:rgba(28,28,33,.95);border:1px solid var(--border-strong);pointer-events:none}
  .opt.open .menu{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .menu span{width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;font-size:10.5px;font-weight:600}
  .menu span i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
  .bar{position:absolute;left:14px;right:14px;bottom:18px;height:64px;border-radius:99px;display:flex;align-items:center;padding:0 8px;background:rgba(18,18,22,.82);border:1px solid var(--border-strong);backdrop-filter:blur(24px);box-shadow:0 24px 50px -16px rgba(0,0,0,.95)}
  .ni{flex:1;display:flex;justify-content:center;color:var(--text-3)}
  .ni.on span{display:flex;align-items:center;gap:6px;height:44px;padding:0 13px 0 11px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--accent);font-size:12px;font-weight:600}
  .slot{display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 4px}
  .pb{display:grid;place-items:center;transition:transform .35s var(--spring),background .25s,box-shadow .25s,border-radius .35s var(--spring);touch-action:none}
  .pb .ic{display:flex;transition:transform .35s var(--spring)}
  .opt.open .pb .ic{transform:rotate(45deg)}
  .pb:active{transform:scale(.9)}

  /* 1 — مربع ناعم (Squircle) */
  .s1{width:50px;height:46px;border-radius:16px;color:var(--on-accent);background:linear-gradient(150deg,#fff,#e4e4ea 55%,#bdbdc6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 20px -10px rgba(255,255,255,.45)}
  .opt.open .s1{border-radius:23px}
  /* 2 — زجاجي بحلقة متوهّجة */
  .s2{width:48px;height:48px;border-radius:50%;color:var(--text);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 0 4px rgba(255,255,255,.03),0 0 22px -4px rgba(255,255,255,.25)}
  .opt.open .s2{background:var(--accent);color:var(--on-accent)}
  /* 3 — حلقة بألوان الأنواع */
  .s3w{width:50px;height:50px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--expense),var(--sub,#ffbf47),var(--income),var(--owed),var(--transfer),var(--expense));animation:rot 6s linear infinite}
  .s3{width:100%;height:100%;border-radius:50%;background:#141418;color:var(--text);animation:rot 6s linear infinite reverse}
  @keyframes rot{to{transform:rotate(360deg)}}
  .opt.open .s3w{animation-play-state:paused}
  /* 4 — حبة بنص «إضافة» */
  .s4{height:44px;padding:0 14px 0 12px;border-radius:99px;display:flex;align-items:center;gap:6px;color:var(--on-accent);background:var(--accent);font-size:12.5px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  .s4 em{font-style:normal}
  .opt.open .s4{background:rgba(255,255,255,.12);color:var(--text)}
  /* 5 — نقاط الأنواع */
  .s5{width:50px;height:46px;border-radius:16px;position:relative;color:var(--on-accent);background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  .s5 .d{position:absolute;width:6px;height:6px;border-radius:50%;transition:all .4s var(--spring)}
  .s5 .d1{top:6px;right:6px;background:var(--expense)}.s5 .d2{top:6px;left:6px;background:var(--income)}
  .s5 .d3{bottom:6px;right:6px;background:var(--transfer)}.s5 .d4{bottom:6px;left:6px;background:var(--owed)}
  .opt.open .s5 .d{transform:scale(0)}
  /* 6 — مجوّف داخل الشريط */
  .s6{width:52px;height:52px;border-radius:50%;color:var(--text);background:radial-gradient(circle at 50% 30%,#2a2a31,#121216);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.08)}
  .s6 .ic{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="intro">نفس الوظيفة (ضغطة تفتح كبسولة الأنواع، وسحب منه يختار)، وأشكال مختلفة للزر نفسه داخل الشريط بدون دائرة بارزة. اضغط الزر في كل خيار لترى حالته وهو مفتوح.</div>
<div id="list"></div>
<script>
const S=(p,s=22,w=2.4)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P='<path d="M12 5v14M5 12h14"/>';
const I={home:'<path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19v-8.5Z"/>',wallet:'<rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.5h18"/>',
 people:'<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.3 14.2c2.5.4 4.2 1.9 4.2 4.8"/>',more:'<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="3.25"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="3.25"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>'};
const T=[['مصروف','var(--expense)','<path d="M7 7l10 10M17 9v8H9"/>'],['دخل','var(--income)','<path d="M17 17 7 7M7 15V7h8"/>'],['تحويل','var(--transfer)','<path d="M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12"/>'],['سلفة','var(--owed)',I.people]];
const OPTS=[
 ['1','مربع ناعم','زوايا ناعمة بدل الدائرة، أبيض متدرّج — يتحوّل لحبة عند الفتح.',`<button class="pb s1"><span class="ic">${S(P)}</span></button>`],
 ['2','زجاجي بتوهّج','شفاف بنفس زجاج الشريط مع حلقة خفيفة متوهّجة — يصير أبيض عند الفتح. هادئ ومندمج.',`<button class="pb s2"><span class="ic">${S(P,21,2.2)}</span></button>`],
 ['3','حلقة الأنواع','حلقة بألوان أنواع الحركات (مصروف، دخل، تحويل، سلفة) تدور ببطء — توحي بما سيفتحه.',`<div class="s3w"><button class="pb s3"><span class="ic">${S(P,21,2.2)}</span></button></div>`],
 ['4','حبة «إضافة»','زر نصّي واضح «+ إضافة» — أوضح لأول استخدام، ويأخذ مساحة أكبر قليلًا.',`<button class="pb s4"><span class="ic">${S(P,18,2.6)}</span><em>إضافة</em></button>`],
 ['5','نقاط الأنواع','مربع ناعم بنقطة ملوّنة بكل زاوية (ألوان الأنواع) تختفي عند الفتح.',`<button class="pb s5"><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span><span class="d d4"></span><span class="ic">${S(P)}</span></button>`],
 ['6','غائر داخل الشريط','تجويف داكن داخل الشريط وفي وسطه زر أبيض صغير — عكس البروز: كأنه محفور في الكبسولة.',`<button class="pb s6"><span class="ic">${S(P,16,2.8)}</span></button>`]];
const nav=(ic,on,l)=>`<div class="ni ${on?'on':''}"><span>${S(ic,21,1.9)}${on?l:''}</span></div>`;
document.getElementById('list').innerHTML=OPTS.map(([n,t,d,btn])=>`<div class="opt"><div class="head"><b>${n}</b><div><h3>${t}</h3><small>${d}</small></div></div>
 <div class="stage"><div class="fake"><i></i><i></i><i></i></div><div class="scrim"></div>
  <div class="menu">${T.map(([l,c,ic])=>`<span><i style="background:color-mix(in srgb, ${c} 18%, transparent);color:${c}">${S(ic,16,2.2)}</i>${l}</span>`).join('')}</div>
  <div class="bar">${nav(I.home,1,'الرئيسية')}${nav(I.wallet)}<div class="slot">${btn}</div>${nav(I.people)}${nav(I.more)}</div></div></div>`).join('');
document.querySelectorAll('.opt').forEach(o=>{o.querySelector('.pb').onclick=()=>o.classList.toggle('open');o.querySelector('.scrim').onclick=()=>o.classList.remove('open');});
</script>
</body>
</html>
