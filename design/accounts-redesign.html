<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساباتك — تصميم مقترح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff;
    --c-cash:#e9e9ee; --c-bank:#8b7bff; --c-savings:#ffbf47; --c-wallet:#9aa0ff;
    --c-emergency:#ff3d6e; --c-coins:#19c27a; --c-fuel:#ff8a1a; --c-steam:#66c0f4;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  /* إطار الهاتف للعرض على الكمبيوتر فقط */
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){body{padding:0}.phone{border-radius:0;border:0;min-height:100vh}}
  .screen{padding:18px 16px 110px}

  /* الرأس */
  .header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 4px 18px}
  .header h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .header p{font-size:12px;color:var(--text-3);margin-top:3px}
  .hbtns{display:flex;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-el);border:1px solid var(--border)}
  .icon-btn.accent{background:var(--accent);color:var(--on-accent);border:0}
  .press{transition:transform .15s var(--ease)} .press:active{transform:scale(.96)}

  /* بطاقة الإجمالي */
  .hero{position:relative;border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:20px;overflow:hidden;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07) 0%,transparent 55%),linear-gradient(165deg,var(--surface-el) 0%,var(--void) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -28px rgba(0,0,0,.9)}
  .hero-top{display:flex;justify-content:space-between;align-items:center}
  .label{font-size:12.5px;color:var(--text-2);font-weight:500}
  .delta{font-size:11px;font-weight:600;color:var(--income);background:rgba(62,224,143,.1);padding:4px 9px;border-radius:99px}
  .big{font-size:36px;font-weight:700;margin-top:6px;display:flex;align-items:baseline;gap:6px}
  .big small{font-size:14px;color:var(--text-2);font-weight:600;font-family:var(--font-sans)}
  .alloc{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:18px 0 10px}
  .alloc span{height:100%;transition:flex-grow .5s var(--ease)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--text-2)}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px}
  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:99px;font-size:13px;font-weight:600}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--border-strong)}

  /* شريط التبديل */
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 12px}
  .toolbar h2{font-size:15px;font-weight:600}
  .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px}
  .seg button{padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:5px;transition:all .2s var(--ease)}
  .seg button.on{background:var(--surface-hi);color:var(--text)}

  /* عرض القائمة */
  .group{margin-bottom:16px}
  .group-head{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px;font-size:11.5px;font-weight:600;color:var(--text-3)}
  .group-box{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden}
  .row{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:right}
  .row + .row-wrap, .row-wrap + .row-wrap{border-top:1px solid var(--border)}
  .thumb{width:46px;height:30px;border-radius:7px;flex-shrink:0;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px -4px rgba(0,0,0,.8)}
  .thumb::after{content:'';position:absolute;right:5px;top:6px;width:9px;height:7px;border-radius:2px;background:rgba(255,255,255,.55)}
  .thumb.light::after{background:rgba(0,0,0,.25)}
  .row-main{flex:1;min-width:0}
  .row-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .row-sub{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-end{text-align:left;flex-shrink:0}
  .row-amt{font-size:15px;font-weight:700}
  .row-pct{font-size:10.5px;color:var(--text-3);margin-top:2px}
  .home-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);opacity:.0}
  .home-dot.off{opacity:1}
  .chev{color:var(--text-3);transition:transform .25s var(--ease);flex-shrink:0}
  .row-wrap.open .chev{transform:rotate(180deg)}
  .mini-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
  .mini-bar span{display:block;height:100%;border-radius:99px}

  /* لوحة التفاصيل (تتوسع داخل الصف) */
  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
  .row-wrap.open .detail{grid-template-rows:1fr}
  .detail > div{overflow:hidden}
  .detail-in{padding:2px 14px 14px}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;background:var(--surface-el);border:1px solid var(--border);font-size:10.5px;font-weight:600;color:var(--text-2)}
  .act svg{color:var(--text)}
  .act.hl{background:var(--accent);color:var(--on-accent);border:0}
  .act.hl svg{color:var(--on-accent)}
  .tx{display:flex;align-items:center;gap:10px;padding:8px 2px}
  .tx-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-el);flex-shrink:0;font-size:14px}
  .tx-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx-d{font-size:10.5px;color:var(--text-3);font-weight:500}
  .tx-a{font-size:12.5px;font-weight:700}
  .pos{color:var(--income)} .neg{color:var(--text)}
  .see-all{display:block;width:100%;text-align:center;font-size:11.5px;font-weight:600;color:var(--text-2);padding:8px 0 0}
  .goal{background:var(--surface-el);border-radius:16px;padding:11px 12px;margin-bottom:12px}
  .goal-top{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:7px}
  .goal .mini-bar{height:6px;margin:0}
  .fuel-labels{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--text-3);margin-top:5px}

  /* عرض البطاقات */
  .carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
  .carousel::-webkit-scrollbar{display:none}
  .bank{flex:0 0 86%;scroll-snap-align:center;height:196px;border-radius:26px;padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
    border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 22px 40px -24px rgba(0,0,0,.9);transition:transform .3s var(--ease),opacity .3s}
  .bank.dim{transform:scale(.94);opacity:.55}
  .bank-top{display:flex;justify-content:space-between;align-items:center}
  .bank-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16)}
  .bank-name{font-size:14px;font-weight:600}
  .bank-type{font-size:11px;opacity:.6}
  .bank-amt{font-size:30px;font-weight:700}
  .bank-bal{font-size:11px;opacity:.7;margin-bottom:3px}
  .bank-foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;font-weight:600;opacity:.6}
  .dots{display:flex;justify-content:center;gap:5px;margin:8px 0 14px}
  .dots i{height:5px;width:5px;border-radius:99px;background:rgba(255,255,255,.18);transition:all .25s var(--ease)}
  .dots i.on{width:16px;background:var(--accent)}
  .card-detail{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:14px}
  .card-detail .detail-in{padding:0}
  .cd-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--text-3);margin:4px 2px 6px}

  /* شريط التنقل السفلي (للإيحاء فقط) */
  .nav{position:absolute;bottom:0;left:0;right:0;height:84px;background:linear-gradient(180deg,transparent,rgba(5,5,6,.95) 30%);display:flex;justify-content:space-around;align-items:center;padding-bottom:14px;font-size:10px;color:var(--text-3)}
  .nav div{display:flex;flex-direction:column;align-items:center;gap:4px}
  .nav .on{color:var(--text)}
  .hidden-amt .amt-v{filter:blur(0)}
  .view{animation:fade .35s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <div>
        <h1>حساباتك</h1>
        <p id="subtitle"></p>
      </div>
      <div class="hbtns">
        <button class="icon-btn press" id="eye" aria-label="إخفاء الأرصدة"></button>
        <button class="icon-btn accent press" aria-label="إضافة حساب">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <!-- الإجمالي + توزيع الأرصدة -->
    <section class="hero">
      <div class="hero-top">
        <span class="label">إجمالي الأرصدة</span>
        <span class="delta num">+4.2% هذا الشهر</span>
      </div>
      <div class="big"><span class="num" id="total"></span><small>ر.س</small></div>
      <div class="alloc" id="alloc"></div>
      <div class="legend" id="legend"></div>
      <div class="hero-actions">
        <button class="btn primary press">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12"/></svg>
          تحويل
        </button>
        <button class="btn ghost press">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          شحن رصيد
        </button>
      </div>
    </section>

    <div class="toolbar">
      <h2>الحسابات</h2>
      <div class="seg" role="tablist">
        <button data-view="list" class="on">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>قائمة
        </button>
        <button data-view="cards">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>بطاقات
        </button>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <nav class="nav">
    <div>⌂<span>الرئيسية</span></div>
    <div class="on">▭<span>الحسابات</span></div>
    <div>↹<span>الحركات</span></div>
    <div>◔<span>التقارير</span></div>
    <div>⋯<span>المزيد</span></div>
  </nav>
</div>

<script>
const BG = {
  cash:'radial-gradient(90% 120% at 100% 0%,rgba(255,255,255,.16) 0%,transparent 50%),linear-gradient(160deg,#1c1c21 0%,#0b0b0d 60%,#030304 100%)',
  bank:'radial-gradient(100% 120% at 100% 0%,rgba(255,255,255,.34) 0%,transparent 45%),linear-gradient(150deg,#8d8d97 0%,#5a5a63 40%,#33333a 75%,#1c1c21 100%)',
  savings:'radial-gradient(100% 120% at 100% 0%,rgba(255,255,255,.9) 0%,transparent 45%),linear-gradient(150deg,#ffffff 0%,#e6e6eb 45%,#b7b7c0 100%)',
  wallet:'radial-gradient(100% 120% at 100% 0%,rgba(255,255,255,.22) 0%,transparent 45%),linear-gradient(150deg,#44444c 0%,#2a2a30 45%,#141417 100%)',
  emergency:'radial-gradient(100% 120% at 100% 0%,rgba(255,255,255,.22) 0%,transparent 45%),linear-gradient(150deg,#ff6b8e 0%,#e0174d 45%,#6b0820 100%)',
  coins:'radial-gradient(100% 120% at 100% 0%,rgba(240,214,143,.3) 0%,transparent 45%),linear-gradient(150deg,#1fc77f 0%,#0d7a47 45%,#03301b 100%)',
  fuel:'radial-gradient(100% 120% at 100% 0%,rgba(255,230,180,.32) 0%,transparent 45%),linear-gradient(150deg,#ffad4d 0%,#ff7a1a 40%,#8a3306 100%)',
  steam:'radial-gradient(100% 120% at 100% 0%,rgba(102,192,244,.35) 0%,transparent 50%),linear-gradient(150deg,#2a475e 0%,#1b2838 45%,#0b0e14 100%)',
};
const COLOR = {cash:'var(--c-cash)',bank:'var(--c-bank)',savings:'var(--c-savings)',wallet:'var(--c-wallet)',emergency:'var(--c-emergency)',coins:'var(--c-coins)',fuel:'var(--c-fuel)',steam:'var(--c-steam)'};
const LABEL = {cash:'نقدي',bank:'بنكي',savings:'ادخار',wallet:'محفظة رقمية',emergency:'طوارئ',coins:'عملات معدنية',fuel:'بطاقة وقود',steam:'بطاقة Steam'};
const GROUPS = [
  {title:'الاستخدام اليومي', types:['cash','bank','wallet']},
  {title:'الادخار والطوارئ', types:['savings','emergency','coins']},
  {title:'بطاقات مسبقة الدفع', types:['fuel','steam']},
];

const accounts = [
  {id:'a1',name:'الكاش',type:'cash',balance:850,showOnHome:true,
   tx:[['🍔','مطعم البيك','اليوم',-42],['☕','قهوة','أمس',-18],['💵','سحب من البنك','٣ أكتوبر',500]]},
  {id:'a2',name:'الراجحي',type:'bank',balance:12480.5,showOnHome:true,
   tx:[['💼','الراتب','١ أكتوبر',9500],['🛒','بنده','أمس',-312.4],['📱','STC','٢ أكتوبر',-230]]},
  {id:'a3',name:'STC Pay',type:'wallet',balance:320,showOnHome:false,
   tx:[['🛍️','نون','٥ أكتوبر',-149]]},
  {id:'a4',name:'ادخار السيارة',type:'savings',balance:18000,goal:30000,goalLabel:'سيارة جديدة',showOnHome:true,
   tx:[['↩︎','تحويل من الراجحي','١ أكتوبر',2000]]},
  {id:'a5',name:'صندوق الطوارئ',type:'emergency',balance:6000,goal:10000,goalLabel:'٣ أشهر مصاريف',showOnHome:false,tx:[]},
  {id:'a6',name:'الحصّالة',type:'coins',balance:145,showOnHome:false,tx:[['🪙','إيداع عملات','٢٨ سبتمبر',35]]},
  {id:'a7',name:'بطاقة الوقود',type:'fuel',balance:96,lastTopUp:200,showOnHome:true,
   tx:[['⛽','محطة الدريس','أمس',-64],['⛽','شحن البطاقة','٢٩ سبتمبر',200]]},
  {id:'a8',name:'Steam',type:'steam',balance:74.25,lastTopUp:100,showOnHome:false,
   tx:[['🎮','Elden Ring DLC','٤ أكتوبر',-25.75]]},
];

let hidden=false, view='list', openId=null, activeCard=0;
const total = accounts.reduce((s,a)=>s+a.balance,0);
const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const money = n => hidden ? '•••••' : fmt(n);
const signed = n => hidden ? '•••' : (n>0?'+':'−')+fmt(Math.abs(n));
const pctOf = v => { const p=v/total*100; return p>0&&p<1?'<1':Math.round(p); };
const pct = a => pctOf(a.balance);

const ICON = {
  eyeOn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7c1.8 0 3.3-.5 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>',
  plus:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  swap:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12"/></svg>',
  edit:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M13.5 8 16 10.5"/></svg>',
  home:on=>`<svg width="17" height="17" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5"/></svg>`,
};

function renderHero(){
  document.getElementById('subtitle').textContent = `${accounts.length} حسابات · ${accounts.filter(a=>a.showOnHome).length} ظاهرة في الرئيسية`;
  document.getElementById('eye').innerHTML = hidden ? ICON.eyeOff : ICON.eyeOn;
  document.getElementById('total').textContent = money(total);
  const sorted=[...accounts].sort((a,b)=>b.balance-a.balance);
  document.getElementById('alloc').innerHTML = sorted.map(a=>`<span title="${a.name}" style="flex-grow:${Math.max(a.balance,total*.012)};background:${COLOR[a.type]}"></span>`).join('');
  document.getElementById('legend').innerHTML = GROUPS.map(g=>{
    const sum=accounts.filter(a=>g.types.includes(a.type)).reduce((s,a)=>s+a.balance,0);
    return `<span><i style="background:${COLOR[g.types[0]]}"></i>${g.title} <b class="num" style="color:var(--text)">${hidden?'••':pctOf(sum)+'%'}</b></span>`;
  }).join('');
}

function detailHTML(a){
  const isPrepaid=a.type==='fuel'||a.type==='steam'||a.type==='wallet';
  let extra='';
  if(a.goal){
    const p=Math.min(100,a.balance/a.goal*100);
    extra=`<div class="goal"><div class="goal-top"><span>هدف: ${a.goalLabel}</span><span class="num">${hidden?'•••':Math.round(p)+'%'} من ${money(a.goal)}</span></div>
      <div class="mini-bar"><span style="width:${p}%;background:${COLOR[a.type]}"></span></div></div>`;
  }
  if(a.type==='fuel'){
    const p=Math.min(100,a.balance/a.lastTopUp*100);
    const c=p<25?'var(--expense)':p<50?'var(--c-savings)':'var(--income)';
    extra=`<div class="goal"><div class="goal-top"><span>مستوى التعبئة</span><span class="num">${hidden?'•••':Math.round(p)+'%'}</span></div>
      <div class="mini-bar"><span style="width:${p}%;background:${c}"></span></div>
      <div class="fuel-labels"><span>E</span><span>آخر شحن: <span class="num">${money(a.lastTopUp)}</span></span><span>F</span></div></div>`;
  }
  const txs = a.tx.length ? a.tx.map(([ic,t,d,amt])=>`
      <div class="tx"><div class="tx-ic">${ic}</div><div class="tx-t">${t}<div class="tx-d">${d}</div></div>
      <div class="tx-a num ${amt>0?'pos':'neg'}" dir="ltr">${signed(amt)}</div></div>`).join('')
    : `<div class="tx-d" style="text-align:center;padding:10px 0">لا توجد حركات على هذا الحساب بعد</div>`;
  return `<div class="detail-in">
    ${extra}
    <div class="actions">
      <button class="act ${isPrepaid?'hl':''} press">${ICON.plus}${isPrepaid?'شحن':'إيداع'}</button>
      <button class="act press">${ICON.swap}تحويل</button>
      <button class="act press" data-home="${a.id}">${ICON.home(a.showOnHome)}${a.showOnHome?'بالرئيسية':'مخفي'}</button>
      <button class="act press">${ICON.edit}تعديل</button>
    </div>
    <div class="cd-head"><span>آخر الحركات</span></div>
    ${txs}
    ${a.tx.length?'<button class="see-all">عرض كل الحركات ←</button>':''}
  </div>`;
}

function renderList(){
  return `<div class="view">${GROUPS.map(g=>{
    const list=accounts.filter(a=>g.types.includes(a.type));
    if(!list.length) return '';
    const sum=list.reduce((s,a)=>s+a.balance,0);
    return `<div class="group">
      <div class="group-head"><span>${g.title}</span><span class="num">${money(sum)} ر.س</span></div>
      <div class="group-box">${list.map(a=>`
        <div class="row-wrap ${openId===a.id?'open':''}">
          <button class="row" data-open="${a.id}">
            <div class="thumb ${a.type==='savings'?'light':''}" style="background:${BG[a.type]}"></div>
            <div class="row-main">
              <div class="row-name">${a.name}${a.showOnHome?'':'<span class="home-dot off" title="مخفي من الرئيسية"></span>'}</div>
              <div class="row-sub">${a.goal?'هدف: '+a.goalLabel:LABEL[a.type]}</div>
              ${a.goal?`<div class="mini-bar"><span style="width:${Math.min(100,a.balance/a.goal*100)}%;background:${COLOR[a.type]}"></span></div>`:''}
            </div>
            <div class="row-end"><div class="row-amt num">${money(a.balance)}</div><div class="row-pct num">${hidden?'••':pct(a)+'%'} من الإجمالي</div></div>
            ${ICON.chev}
          </button>
          <div class="detail"><div>${detailHTML(a)}</div></div>
        </div>`).join('')}
      </div></div>`;
  }).join('')}</div>`;
}

function renderCards(){
  const a=accounts[activeCard];
  return `<div class="view">
    <div class="carousel" id="carousel">${accounts.map((c,i)=>{
      const dark=c.type==='savings';
      return `<div class="bank ${i===activeCard?'':'dim'}" data-i="${i}" style="background:${BG[c.type]};color:${dark?'#0a0a0c':'#fff'}">
        <div class="bank-top"><div style="display:flex;gap:10px;align-items:center">
          <div class="bank-ic" style="${dark?'background:rgba(0,0,0,.08)':''}">${ICON.home(false).replace('M4 11 12 4l8 7','M3 10h18M5 10v8M19 10v8M3 20h18M12 3l9 5H3z')}</div>
          <div><div class="bank-name">${c.name}</div><div class="bank-type">${LABEL[c.type]}</div></div></div>
          <span class="num" style="font-size:12px;opacity:.6">${hidden?'••':pct(c)+'%'}</span></div>
        <div><div class="bank-bal">${['fuel','steam'].includes(c.type)?'الرصيد المتبقي':'الرصيد المتاح'}</div><div class="bank-amt num">${money(c.balance)}</div></div>
        <div class="bank-foot"><span class="num" dir="ltr" style="letter-spacing:2px">•••• ${String(1000+i*1379).slice(-4)}</span><span class="num" dir="ltr">QB·Nomia</span></div>
      </div>`;}).join('')}
    </div>
    <div class="dots">${accounts.map((_,i)=>`<i class="${i===activeCard?'on':''}"></i>`).join('')}</div>
    <div class="card-detail">${detailHTML(a)}</div>
  </div>`;
}

function render(){
  renderHero();
  const c=document.getElementById('content');
  c.innerHTML = view==='list'?renderList():renderCards();
  if(view==='cards'){
    const car=document.getElementById('carousel');
    const card=car.children[activeCard];
    car.scrollLeft = card.offsetLeft - (car.clientWidth-card.clientWidth)/2;
    let t; car.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{
      const mid=car.getBoundingClientRect().left+car.clientWidth/2;
      let best=0,bd=1e9;[...car.children].forEach((el,i)=>{const r=el.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;best=i}});
      if(best!==activeCard){activeCard=best;render();}
    },120)});
  }
}

document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');
  if(o){const id=o.dataset.open;const was=openId===id;openId=was?null:id;
    document.querySelectorAll('.row-wrap').forEach(w=>w.classList.toggle('open',!was&&w.querySelector('[data-open]').dataset.open===id));return;}
  const h=e.target.closest('[data-home]');
  if(h){const a=accounts.find(x=>x.id===h.dataset.home);a.showOnHome=!a.showOnHome;render();return;}
  const v=e.target.closest('[data-view]');
  if(v){view=v.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b===v));render();return;}
  const b=e.target.closest('.bank');
  if(b){activeCard=+b.dataset.i;render();return;}
  if(e.target.closest('#eye')){hidden=!hidden;render();}
});
render();
</script>
</body>
</html>
