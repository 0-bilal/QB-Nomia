<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإشعارات داخل التطبيق — اقتراحات</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c; --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --warn:#ffbf47;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0 40px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .ctl{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:12px;padding:0 12px;max-width:600px}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .pill{padding:7px 12px;border-radius:99px;background:#16161a;border:1px solid #26262c;font-size:12px;font-weight:600;color:var(--text-2)}
  .pill.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .pill.ev{background:#1b1b22;border-color:#33333c;color:var(--text)}
  .pill b{font-family:var(--font-num);margin-inline-end:3px}
  .lbl{font-size:11px;color:#6b6b75}
  .desc{background:#111114;border:1px solid #222228;border-radius:16px;padding:10px 14px;font-size:12px;color:var(--text-2);line-height:1.75;max-width:440px}
  .desc b{color:var(--text)}

  .phone{width:390px;max-width:100%;height:760px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:0;border:0;height:calc(100vh - 230px)}}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 16px 120px}
  .scroll::-webkit-scrollbar{display:none}
  .aurora{position:absolute;top:-120px;left:-60px;right:-60px;height:340px;background:radial-gradient(50% 60% at 70% 40%,rgba(139,123,255,.14),transparent 70%);pointer-events:none}

  /* الرأس العائم (كما في التطبيق الآن) */
  .hrow{position:absolute;top:0;left:0;right:0;height:92px;padding:44px 14px 0;display:flex;align-items:center;gap:8px;z-index:20}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(24,24,28,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);position:relative;transition:color .2s}
  .gb .bdg{position:absolute;top:-2px;left:-2px;min-width:16px;height:16px;border-radius:99px;background:var(--expense);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
  .gb .dot{position:absolute;bottom:1px;left:1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);display:none}
  .sp{flex:1}
  .capsule{position:absolute;top:44px;left:50%;height:40px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:99px;background:rgba(28,28,33,.86);backdrop-filter:blur(20px);border:1px solid var(--border-strong);font-size:13.5px;font-weight:700;white-space:nowrap;z-index:21;transition:all .45s var(--spring);box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
  .capsule .ic{display:none;width:18px;height:18px;border-radius:50%;place-items:center;flex-shrink:0}
  .capsule.status .ic{display:grid}
  .capsule.status{left:14px;right:14px;transform:none;justify-content:center}
  .phone.island .hrow .gb{opacity:0;transform:scale(.85);pointer-events:none}
  .hrow .gb{transition:opacity .25s,transform .35s var(--spring)}
  .capsule .action{display:none;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
  .capsule.withaction .action{display:inline-block}

  .greet{padding:100px 4px 14px}
  .greet b{font-size:22px;font-weight:700;display:block}
  .greet small{font-size:11.5px;color:var(--text-3)}
  .hero{border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:18px;background:linear-gradient(165deg,var(--surface-el),var(--void))}
  .hero .v{font-size:38px;font-weight:700;margin-top:4px}
  .blk{height:96px;border-radius:24px;background:var(--surface);border:1px solid var(--border);margin-top:10px;padding:16px}
  .blk .t{width:40%;height:10px;border-radius:6px;background:rgba(255,255,255,.08)}
  .blk .t2{width:70%;height:8px;border-radius:6px;background:rgba(255,255,255,.05);margin-top:12px}
  .nav{position:absolute;bottom:14px;left:14px;right:14px;height:64px;border-radius:26px;background:rgba(22,22,26,.9);backdrop-filter:blur(18px);border:1px solid var(--border-strong);display:flex;justify-content:space-around;align-items:center;z-index:25;font-size:10px;color:var(--text-3)}
  .nav .on{color:var(--text);font-weight:600}

  /* طبقات الإشعار */
  .layer{position:absolute;inset:0;pointer-events:none;z-index:30}
  .layer *{pointer-events:auto}
  .t-pill{position:absolute;left:50%;transform:translate(-50%,-12px);opacity:0;transition:all .35s var(--ease);display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.8)}
  .t-pill.on{transform:translate(-50%,0);opacity:1}
  .toast{position:absolute;left:14px;right:14px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:20px;background:rgba(30,30,36,.94);backdrop-filter:blur(20px);border:1px solid var(--border-strong);box-shadow:0 20px 44px -12px rgba(0,0,0,.9);font-size:12.5px;font-weight:600;transform:translateY(20px);opacity:0;transition:all .38s var(--spring)}
  .toast.on{transform:none;opacity:1}
  .toast .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
  .toast .m{flex:1;min-width:0}
  .toast .m small{display:block;font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:1px}
  .toast .act{padding:7px 13px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;flex-shrink:0}
  .toast .x{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);flex-shrink:0}
  .tline{position:absolute;top:0;left:0;right:0;height:2.5px;overflow:hidden;opacity:0;transition:opacity .2s;z-index:40}
  .tline.on{opacity:1}
  .tline span{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:ind 1.1s ease-in-out infinite}
  @keyframes ind{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin .8s linear infinite}
  .banner{position:absolute;left:12px;right:12px;top:96px;border-radius:18px;padding:11px 13px;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:600;background:rgba(30,30,36,.95);backdrop-filter:blur(20px);border:1px solid var(--border-strong);box-shadow:0 18px 40px -14px rgba(0,0,0,.9);transform:translateY(-14px);opacity:0;transition:all .38s var(--spring)}
  .banner.on{transform:none;opacity:1}
  .banner .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
  .banner .m{flex:1}
  .banner .m small{display:block;color:var(--text-3);font-weight:500;font-size:10.5px}
  .banner .grab{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:9px;background:rgba(255,255,255,.18)}
  .offline-strip{position:absolute;top:0;left:0;right:0;z-index:35;height:0;overflow:hidden;transition:height .3s var(--ease);background:#2a2216;color:var(--warn);font-size:10.5px;font-weight:600;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:3px}
  .offline-strip.on{height:30px}
</style>
</head>
<body>
<div class="ctl">
  <div class="row" id="modes"></div>
  <div class="lbl">جرّب الأحداث:</div>
  <div class="row" id="events"></div>
  <div class="desc" id="desc"></div>
</div>

<div class="phone" id="phone">
  <div class="aurora"></div>
  <div class="scroll" id="scroll">
    <div class="greet"><b>نهارك سعيد</b><small class="num">2026/10/08 · v2.9.1</small></div>
    <div class="hero"><div style="font-size:12.5px;color:var(--text-2)">إجمالي رصيدك</div><div class="v num">37,965</div></div>
    <div class="blk"><div class="t"></div><div class="t2"></div></div><div class="blk"><div class="t"></div><div class="t2"></div></div><div class="blk"><div class="t"></div><div class="t2"></div></div><div class="blk"><div class="t"></div><div class="t2"></div></div><div class="blk"><div class="t"></div><div class="t2"></div></div>
  </div>
  <div class="hrow">
    <span class="sp"></span>
    <button class="gb" id="syncBtn"><svg id="syncIc" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg><span class="dot" id="syncDot"></span></button>
    <button class="gb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bdg num" id="bellBdg">2</span></button>
    <button class="gb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="capsule" id="capsule"><span class="ic" id="capIc"></span><span id="capText">الرئيسية</span><button class="action" id="capAct">تراجع</button></div>
  <div class="tline" id="tline"><span></span></div>
  <div class="offline-strip" id="offStrip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18M9 16.3a5.5 5.5 0 0 1 6 0M5.5 12.5a11 11 0 0 1 4-2"/></svg>بدون إنترنت — بياناتك محفوظة على جهازك</div>
  <div class="layer" id="layer"></div>
  <nav class="nav"><span class="on">الرئيسية</span><span>الحسابات</span><span>السلف</span><span>المزيد</span></nav>
</div>

<script>
const S=(p,s=15,w=2.2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={check:'<path d="M5 12.5 10 17l9-10"/>',warn:'<path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',off:'<path d="M3 3l18 18M9 16.3a5.5 5.5 0 0 1 6 0M5.5 12.5a11 11 0 0 1 4-2"/>',cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.8A4 4 0 0 0 6.5 19"/>',spin:'<path d="M21 12a9 9 0 1 1-9-9"/>'};
const EVENTS={
  bgSync:{l:'حفظ احتياطي تلقائي',kind:'sync'},
  syncOk:{l:'مزامنة يدوية ناجحة',kind:'success',msg:'تم الحفظ الاحتياطي'},
  syncFail:{l:'فشل المزامنة',kind:'error',msg:'تعذّر الحفظ الاحتياطي',sub:'سيُعاد تلقائيًا'},
  undo:{l:'حذف حركة (تراجع)',kind:'undo',msg:'تم حذف الحركة'},
  offline:{l:'انقطاع الإنترنت',kind:'offline'},
  saved:{l:'حفظ إعداد',kind:'success',msg:'تم حفظ إعدادات الربط'},
};
const MODES={
  now:{n:'الحالي (المشكلة)',d:'كل الإشعارات تظهر <b>كحبة في منتصف الأعلى</b> فوق كبسولة العنوان والأزرار، فتتداخل معها. «تراجع» فقط يظهر بالأسفل.'},
  A:{n:'الكبسولة الذكية',d:'<b>كبسولة العنوان نفسها تتحول لإشعار</b> (مثل Dynamic Island): تتمدد على عرض الصف وتختفي الأزرار لحظيًا، ثم ترجع لاسم الصفحة وترجع الأزرار. عنصر واحد فقط بالأعلى، فمستحيل يتداخل. «تراجع» يظهر كزر داخل الكبسولة. الحفظ التلقائي يظهر كخط رفيع أعلى الشاشة فقط.'},
  B:{n:'كل شيء بالأسفل',d:'<b>الأعلى نظيف تمامًا</b>. كل الإشعارات بطاقة واحدة موحّدة فوق شريط التنقل (نفس مكان «تراجع» الحالي)، بأيقونة ولون حسب النوع، وتختفي تلقائيًا أو بالسحب. الحفظ التلقائي لا يُظهر إشعارًا (فقط خط رفيع).'},
  C:{n:'صامت + زر المزامنة',d:'<b>أقل إزعاج</b>: المزامنة لا تُظهر أي رسالة؛ حالتها على <b>زر المزامنة</b> نفسه (يدور، نقطة خضراء، نقطة حمراء). الأخطاء تذهب لمركز التنبيهات (رقم على الجرس) + بطاقة سفلية فقط لما يحتاج منك فعل. انقطاع الإنترنت شريط رفيع أعلى الشاشة.'},
  D:{n:'بطاقة تحت الرأس',d:'الإشعار <b>بطاقة عريضة تنزل تحت صف الأزرار</b> (مثل إشعارات الهاتف)، لا تغطي الأزرار ولا الكبسولة، وتُسحب للأعلى لإغلاقها. واضحة جدًا لكن تغطي جزءًا من المحتوى مؤقتًا.'},
};
let mode='now',timers=[];
const $=id=>document.getElementById(id);
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const color={success:'var(--income)',error:'var(--expense)',undo:'var(--text)',sync:'var(--text-2)',offline:'var(--warn)'};
function reset(){timers.forEach(clearTimeout);timers=[];$('phone').classList.remove('island');$('layer').innerHTML='';const c=$('capsule');c.className='capsule';$('capText').textContent='الرئيسية';$('tline').classList.remove('on');$('offStrip').classList.remove('on');setSyncBtn('idle');$('bellBdg').textContent='2';}
function setSyncBtn(st){const ic=$('syncIc'),dot=$('syncDot');ic.classList.toggle('spin',st==='sync');dot.style.display=st==='ok'||st==='err'?'block':'none';dot.style.background=st==='ok'?'var(--income)':'var(--expense)';}

function pill(ev,top=48){const L=$('layer');const st=ev.kind==='error'?'background:rgba(255,191,71,.14);color:var(--warn);border:1px solid rgba(255,191,71,.3)':ev.kind==='success'?'background:var(--accent);color:var(--on-accent)':'background:var(--surface-el);color:var(--text-2);border:1px solid var(--border)';
  const icon=ev.kind==='sync'?`<span class="spin" style="display:flex">${S(IC.spin,12)}</span>`:ev.kind==='offline'?S(IC.off,13):S(ev.kind==='error'?IC.warn:IC.check,13);
  const text=ev.kind==='sync'?'جارٍ حفظ نسخة احتياطية...':ev.kind==='offline'?'غير متصل — التطبيق يعمل بدون إنترنت وبياناتك محفوظة على جهازك':ev.msg+(ev.sub?' — '+ev.sub:'');
  L.insertAdjacentHTML('beforeend',`<div class="t-pill" style="top:${top}px;${st}">${icon}${text}</div>`);const el=L.lastElementChild;requestAnimationFrame(()=>el.classList.add('on'));later(()=>el.classList.remove('on'),ev.kind==='offline'?5000:2600);}
function bottomToast(ev,{bottom=90}={}){const L=$('layer');L.querySelectorAll('.toast').forEach(t=>t.remove());
  const c=color[ev.kind];const ic=ev.kind==='undo'?IC.trash:ev.kind==='error'?IC.warn:ev.kind==='offline'?IC.off:IC.check;
  L.insertAdjacentHTML('beforeend',`<div class="toast" style="bottom:${bottom}px"><span class="ic" style="background:color-mix(in srgb,${c} 15%,transparent);color:${c}">${S(ic,15)}</span><div class="m">${ev.msg||'لا يوجد اتصال'}${ev.sub?`<small>${ev.sub}</small>`:''}</div>${ev.kind==='undo'?'<button class="act">تراجع</button>':ev.kind==='error'?'<button class="act" style="background:var(--surface-hi);color:var(--text)">إعادة</button>':''}<button class="x">${S('<path d="M6 6l12 12M18 6 6 18"/>',12,2.4)}</button></div>`);
  const el=L.lastElementChild;el.querySelector('.x').onclick=()=>el.classList.remove('on');requestAnimationFrame(()=>el.classList.add('on'));later(()=>el.classList.remove('on'),ev.kind==='undo'?5000:3000);}
function islandStatus(ev){const c=$('capsule'),ic=$('capIc'),tx=$('capText');const col=color[ev.kind];
  ic.style.background=`color-mix(in srgb,${col} 18%,transparent)`;ic.style.color=col;
  ic.innerHTML=ev.kind==='sync'?`<span class="spin" style="display:flex">${S(IC.spin,11)}</span>`:S(ev.kind==='undo'?IC.trash:ev.kind==='error'?IC.warn:ev.kind==='offline'?IC.off:IC.check,11,2.6);
  tx.textContent=ev.kind==='offline'?'بدون إنترنت':ev.msg;c.className='capsule status'+(ev.kind==='undo'?' withaction':'');$('phone').classList.add('island');
  later(()=>{c.className='capsule';tx.textContent='الرئيسية';$('phone').classList.remove('island')},ev.kind==='undo'?5000:ev.kind==='offline'?3500:2600);}
function banner(ev){const L=$('layer');L.querySelectorAll('.banner').forEach(t=>t.remove());const c=color[ev.kind];const ic=ev.kind==='undo'?IC.trash:ev.kind==='error'?IC.warn:ev.kind==='offline'?IC.off:ev.kind==='sync'?IC.cloud:IC.check;
  L.insertAdjacentHTML('beforeend',`<div class="banner"><span class="ic" style="background:color-mix(in srgb,${c} 15%,transparent);color:${c}">${S(ic,15)}</span><div class="m">${ev.kind==='offline'?'بدون إنترنت':ev.kind==='sync'?'جارٍ حفظ نسخة احتياطية':ev.msg}<small>${ev.kind==='offline'?'بياناتك محفوظة على جهازك':ev.sub||'الآن'}</small></div>${ev.kind==='undo'?'<button class="act" style="padding:7px 13px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700">تراجع</button>':''}<span class="grab"></span></div>`);
  const el=L.lastElementChild;requestAnimationFrame(()=>el.classList.add('on'));later(()=>el.classList.remove('on'),ev.kind==='undo'?5000:2800);}

function fire(k){const ev=EVENTS[k];
  if(mode==='now'){ if(ev.kind==='undo') bottomToast(ev,{bottom:112}); else if(ev.kind==='sync'){$('tline').classList.add('on');pill(ev);later(()=>$('tline').classList.remove('on'),2400);} else pill(ev); return;}
  if(mode==='A'){ if(ev.kind==='sync'){$('tline').classList.add('on');later(()=>$('tline').classList.remove('on'),2400);return;} islandStatus(ev); return;}
  if(mode==='B'){ if(ev.kind==='sync'){$('tline').classList.add('on');later(()=>$('tline').classList.remove('on'),2400);return;} bottomToast(ev); return;}
  if(mode==='C'){ if(ev.kind==='sync'){setSyncBtn('sync');later(()=>setSyncBtn('ok'),1800);later(()=>setSyncBtn('idle'),4000);return;}
    if(ev.kind==='offline'){$('offStrip').classList.add('on');later(()=>$('offStrip').classList.remove('on'),4000);return;}
    if(ev.kind==='error'){setSyncBtn('err');$('bellBdg').textContent='3';bottomToast(ev);return;}
    if(ev.id==='syncOk'){setSyncBtn('sync');later(()=>setSyncBtn('ok'),900);later(()=>setSyncBtn('idle'),3000);return;}
    bottomToast(ev);return;}
  if(mode==='D'){ banner(ev); return;}
}
Object.keys(EVENTS).forEach(k=>EVENTS[k].id=k);
function render(){
  $('modes').innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="pill ${k===mode?'on':''}" data-m="${k}">${k==='now'?'':'<b>'+({A:'أ',B:'ب',C:'ج',D:'د'})[k]+'</b>'}${m.n}</button>`).join('');
  $('events').innerHTML=Object.entries(EVENTS).map(([k,e])=>`<button class="pill ev" data-e="${k}">${e.l}</button>`).join('');
  $('desc').innerHTML=MODES[mode].d;
  // الحالي/أ: الكبسولة ظاهرة (افتراض أن المستخدم مرّر للأسفل)
  $('capsule').style.display='flex';
}
document.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){mode=m.dataset.m;reset();render();return;}const ev=e.target.closest('[data-e]');if(ev)fire(ev.dataset.e);});
render();
</script>
</body>
</html>
