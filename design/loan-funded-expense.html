<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصروف بسلفة من شخص</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff; --owed-to:#2ee6c8; --owed-by:#ff9a4d; --fuel:#ff8a1a;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.56,.64,1); --expo:cubic-bezier(.16,1,.3,1); --calm:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:18px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .press{transition:transform .18s var(--spring)}.press:active{transform:scale(.97)}

  .intro{width:100%;max-width:420px}
  .intro h1{font-size:22px;font-weight:700}
  .intro p{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.7}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px}
  .plbl{font-size:11.5px;color:var(--text-3);font-weight:500;margin-bottom:7px;display:flex;justify-content:space-between}
  .plbl b{color:var(--text-2);font-weight:600}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong);overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:background .3s var(--spring),color .2s}
  .seg button.on{background:var(--accent);color:var(--on-accent)}

  .phone{width:390px;max-width:100%;min-height:800px;background:var(--bg);border-radius:40px;border:1px solid #1d1d22;padding:22px 20px 30px;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:28px;padding:18px 14px 24px}}
  .hdr{display:flex;justify-content:space-between;align-items:center}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--border)}
  .h1{font-size:26px;font-weight:700;margin:14px 0 16px}
  .fade{animation:fade .45s var(--expo) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .types{position:relative;display:flex;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:4px;margin-bottom:18px}
  .types span{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px)/3);right:4px;border-radius:999px;background:var(--expense)}
  .types button{position:relative;flex:1;padding:10px 0;font-size:13.5px;font-weight:600;color:var(--text-2)}
  .types button.on{color:var(--on-accent)}
  .field{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);text-align:right}
  .fl{font-size:11px;color:var(--text-3);margin-bottom:6px;padding:0 4px}
  .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .ft{font-size:14px;font-weight:600}
  .fs{font-size:11px;color:var(--text-3);margin-top:1px}
  .av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;flex-shrink:0;transition:box-shadow .25s}
  .people{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
  .people::-webkit-scrollbar{display:none}
  .pp{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:62px}
  .pp small{font-size:11px;color:var(--text-2);white-space:nowrap}
  .pp small b{display:block;font-size:9.5px;font-weight:600;text-align:center;margin-top:1px}
  .amount{text-align:center;margin:18px 0 16px}
  .amount .q{font-size:12.5px;color:var(--text-2);margin-bottom:2px}
  .amount .v{font-size:52px;font-weight:700;line-height:1.1}
  .amount .v span{font-family:var(--font-sans);font-size:18px;opacity:.6;font-weight:500;margin-inline-start:8px}
  .info{display:flex;gap:10px;align-items:flex-start;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--border);padding:11px 13px;font-size:11.5px;color:var(--text-2);line-height:1.7}
  .info svg{flex-shrink:0;margin-top:2px;color:var(--text-3)}
  .save{width:100%;margin-top:16px;padding:15px;border-radius:999px;font-size:14px;font-weight:700;color:var(--on-accent)}
  .kind{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--border);margin:12px 0 4px}
  .kind .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;transition:right .42s var(--spring),background .3s}
  .kind button{position:relative;flex:1;height:36px;font-size:12.5px;font-weight:600;color:var(--text-3);transition:color .2s}
  .kind button.on{color:var(--on-accent)}
  .flow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:11px;color:var(--text-2)}
  .flow span{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .flow i{font-style:normal;color:var(--text-3)}

  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:5;animation:fadein .18s both}
  @keyframes fadein{from{opacity:0}}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:86%;overflow-y:auto;border-radius:32px 32px 0 0;border:1px solid var(--border-strong);border-bottom:0;background:var(--surface-el);padding:10px 16px 26px;animation:sheetin .42s var(--expo) both}
  @keyframes sheetin{from{transform:translateY(100%)}}
  .handle{width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .shh{font-size:11.5px;font-weight:600;color:var(--text-3);margin:16px 4px 8px;display:flex;justify-content:space-between}

  .grp{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--text-3);margin:16px 6px 8px}
  .tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
  .tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px 2px 3px;font-size:10.5px;font-weight:600}
  .tag i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700}
  .hero{position:relative;overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:4px 14px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:0}

  .note{width:100%;max-width:420px;font-size:12px;color:var(--text-2);line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px}
  .note .k{color:var(--text-3);font-size:11px;display:block;margin-bottom:2px}
  .note b{color:var(--text);font-weight:600}
</style>
</head>
<body>

<div class="intro">
  <h1>مصروف بسلفة من شخص</h1>
  <p>بدل تسجيل سلفة ثم مصروف بنفس المبلغ: تختار الشخص من ورقة الحساب عند إضافة المصروف، فتُسجَّل العمليتان معًا مربوطتين — المصروف على فئته، والمبلغ يصير عليك لهذا الشخص، ولا يتغير رصيد أي حساب.</p>
</div>

<div class="panel">
  <div>
    <div class="plbl">الشاشة <b id="nScr"></b></div>
    <div class="seg" id="segScr">
      <button data-v="0" class="on">إضافة مصروف</button>
      <button data-v="1">الحركات</button>
      <button data-v="2">صفحة الشخص</button>
      <button data-v="3">السلف</button>
      <button data-v="4">الحذف</button>
    </div>
  </div>
  <div id="optBox">
    <div class="plbl">طريقة الاختيار في ورقة الحساب <b id="nOpt"></b></div>
    <div class="seg" id="segOpt">
      <button data-v="0" class="on"><span class="num">1</span> · قسمان منفصلان</button>
      <button data-v="1"><span class="num">2</span> · شخص ثم «مساهمة / سلفة»</button>
    </div>
  </div>
</div>

<div class="phone"><div id="root"></div></div>

<div class="note" id="note"></div>

<script>
const svg = (p,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`
const PALETTE = ['#45C8FF','#A1A1AD','#FFBF47','#2EE6C8','#FF9A4D','#FF5F6D','#E4E4EA']
function colorFor(seed){let h=0;for(let i=0;i<seed.length;i++)h=(h<<5)-h+seed.charCodeAt(i);return PALETTE[Math.abs(h|0)%PALETTE.length]}
const av = (n,s=50,ring=null) => { const c=colorFor(n); return `<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.38}px;background:radial-gradient(120% 120% at 30% 20%,${c}55,${c}14 70%);box-shadow:${ring?`0 0 0 2px var(--surface-el),0 0 0 4px ${ring}`:`inset 0 0 0 1.5px ${c}40`};color:${c}">${n[0]}</span>` }
const I = {
  info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',16,2),
  wallet:svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/>',17,2),
  fuel:svg('<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h5"/>',19),
  food:svg('<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M17 21V3c-2 1-3 4-3 7h3"/>',19),
  chev:svg('<path d="m15 6-6 6 6 6"/>',14,2.4),
  back:svg('<path d="m9 6 6 6-6 6"/>',18,2.2),
  out:svg('<path d="M17 7 7 17M15 17H7V9"/>',16,2),
  cal:svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',17,2),
  trash:svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',22,1.9),
}
const PEOPLE = [['أحمد',true,500],['سعد',false,-200],['خالد',false,0],['فهد',true,0],['نورة',false,0]]   // [الاسم، مساهم؟، الرصيد معه]
const S = { scr:0, opt:0, sheet:false, person:'سعد', kind:'loan', due:false }
const balLabel = b => b>0?`<b style="color:var(--owed-to)">لك ${b}</b>`:b<0?`<b style="color:var(--owed-by)">عليك ${-b}</b>`:'<b style="color:var(--text-3)">متعادل</b>'

/* ===== ورقة الحساب ===== */
function sheet(){
  const accs = `${[['الراجحي','بنكي','8,240','var(--transfer)'],['الكاش','نقدي','620','var(--income)']].map(([n,t,b,c])=>`<button class="field press" style="margin-bottom:8px" data-acc><span class="ic" style="border-radius:50%;background:color-mix(in srgb,${c} 14%,transparent);color:${c}">${I.wallet}</span><div style="flex:1"><div class="ft">${n}</div><div class="fs">${t}</div></div><span class="num" style="font-weight:700;color:${c}">${b} ر.س</span></button>`).join('')}`
  const row = (list,kind) => `<div class="people">${list.map(([n,,b])=>`<button class="pp press" data-pick="${n}" data-kind="${kind}">${av(n,46,S.person===n&&S.kind===kind?colorFor(n):null)}<small>${n}${kind==='loan'?balLabel(b):''}</small></button>`).join('')}</div>`
  let people
  if(S.opt===0) people = `<div class="shh"><span>أو دفعها عنك شخص</span><span style="font-weight:400">مساهمة · للتذكّر</span></div>${row(PEOPLE.filter(p=>p[1]),'contrib')}
      <div class="shh"><span>أو تسلّفتها من شخص</span><span style="font-weight:400">تصير عليك له</span></div>${row(PEOPLE,'loan')}`
  else people = `<div class="shh"><span>أو من شخص</span><span style="font-weight:400">تختار بعدها: مساهمة أو سلفة</span></div>${row(PEOPLE,'loan')}`
  return `<div class="scrim" data-close></div><div class="sheet"><div class="handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:17px;font-weight:600">اختر الحساب</span><span class="gb" style="width:36px;height:36px">${svg('<path d="M6 6l12 12M18 6 6 18"/>',15,2.2)}</span></div>
    ${accs}${people}</div>`
}

/* ===== إضافة مصروف ===== */
function addScreen(){
  const loan = S.kind==='loan'
  const c = colorFor(S.person)
  const kindSwitch = S.opt===1 ? `<div class="kind"><span class="pill" style="right:${loan?'50%':'4px'};background:${loan?'var(--owed-by)':'var(--accent)'}"></span>
      <button class="${loan?'':'on'}" data-kind-set="contrib">دفعها عني (مساهمة)</button><button class="${loan?'on':''}" data-kind-set="loan">سلفة (أرجّعها)</button></div>` : ''
  const amountColor = loan ? 'var(--expense)' : 'var(--text)'
  return `<div class="hdr"><span class="gb">${I.back}</span><span style="font-size:15px;font-weight:600">إضافة حركة</span><span style="width:40px"></span></div>
    <div style="height:16px"></div>
    <div class="types"><span></span><button class="on">مصروف</button><button>دخل</button><button>تحويل</button></div>
    <div class="fl">الحساب</div>
    <button class="field press" data-sheet>${av(S.person,40)}<div style="flex:1"><div class="ft">${loan?`سلفة من ${S.person}`:`دفعها ${S.person}`}</div><div class="fs">${loan?'تصير عليك له · لا تُخصم من أي حساب':'لن تُخصم من أي حساب'}</div></div><span style="color:var(--text-3)">${I.chev}</span></button>
    ${kindSwitch}
    <div class="amount"><div class="q">${loan?`كم صرفت من سلفة ${S.person}؟`:`كم دفع ${S.person} عنك؟`}</div><div class="v num" style="color:${amountColor}" dir="ltr">120<span>ر.س</span></div></div>
    <div class="fl">الفئة</div><button class="field press"><span class="ic" style="background:rgba(255,138,26,.15);color:var(--fuel)">${I.fuel}</span><div style="flex:1"><div class="ft">وقود</div><div class="fs">ميزانية الشهر · متبقي 140 ر.س بعد هذا المصروف</div></div><span style="color:var(--text-3)">${I.chev}</span></button>
    ${loan?`<button class="field press fade" style="margin-top:10px" data-due><span class="ic" style="background:rgba(255,154,77,.14);color:var(--owed-by)">${I.cal}</span><div style="flex:1"><div class="ft" style="font-size:13px">موعد إرجاع السلفة</div><div class="fs">${S.due?'<span class="num">2026/10/31</span> · يذكّرك قبلها':'اختياري — للتذكير'}</div></div><span style="color:var(--text-3)">${I.chev}</span></button>
      <div class="flow fade"><span>${av(S.person,18)} عليك لـ${S.person} <b class="num" style="color:var(--owed-by)">+120</b></span><i>←</i><span>${I.fuel.replace('width="19" height="19"','width="13" height="13"')} مصروف وقود <b class="num" style="color:var(--expense)">120</b></span></div>
      <div class="info fade" style="margin-top:10px">${I.info}<div>تُسجَّل <b style="color:var(--text)">عمليتان مربوطتان</b>: سلفة استلمتها من ${S.person}، ومصروف بنفس المبلغ على فئة «وقود». المصروف يدخل في مصاريفك وميزانيتك، والمبلغ يصير عليك لـ${S.person} — ولا يتغير رصيد أي حساب.</div></div>`
    :`<div class="info fade" style="margin-top:12px">${I.info}<div>مساهمة للتذكّر فقط: لا تُخصم، ولا تدخل في مصاريفك، وليست دَينًا.</div></div>`}
    <button class="save press" style="background:${loan?'var(--expense)':'var(--accent)'}">${loan?`حفظ · سلفة من ${S.person}`:`حفظ · دفعها ${S.person}`}</button>
    ${S.sheet?sheet():''}`
}

const SCREENS = [
  addScreen,
  () => `<div class="h1">كل الحركات</div>
    <div class="grp"><span>اليوم</span><span class="num">−217</span></div>
    <div class="tx"><span class="ic" style="background:rgba(255,138,26,.15);color:var(--fuel)">${I.fuel}</span><div style="flex:1;min-width:0"><div class="ft">وقود</div><div style="margin-top:4px"><span class="tag" style="background:rgba(255,154,77,.12);color:var(--owed-by)"><i style="background:${colorFor('سعد')}33;color:${colorFor('سعد')}">س</i>بسلفة من سعد</span></div></div>
      <div style="text-align:left"><div class="num" dir="ltr" style="font-size:14px;font-weight:700">−120 ر.س</div><div style="font-size:10px;color:var(--owed-by);margin-top:2px">عليك لسعد</div></div></div>
    <div class="tx"><span class="ic" style="background:rgba(69,200,255,.14);color:#45C8FF">${I.food}</span><div style="flex:1"><div class="ft">مطاعم</div><div class="fs">الراجحي</div></div><div class="num" dir="ltr" style="font-size:14px;font-weight:700">−97 ر.س</div></div>
    <div class="info" style="margin-top:12px">${I.info}<div>المصروف يظهر مرة واحدة فقط بشارة «بسلفة من سعد». السلفة المربوطة به لا تظهر سطرًا منفصلًا هنا (تظهر في صفحة سعد)، حتى لا يتكرر المبلغ ولا يبدو كدخل.</div></div>`,

  () => `<div class="hdr"><span class="gb">${I.back}</span><span></span><span style="width:40px"></span></div>
    <div style="display:flex;flex-direction:column;align-items:center;margin-top:6px">${av('سعد',72)}<div style="font-size:20px;font-weight:700;margin-top:10px">سعد</div><div class="fs">دفتر الحساب</div></div>
    <div class="hero" style="margin-top:16px"><div style="font-size:12.5px;color:var(--owed-by)">عليك له</div><div class="num" style="font-size:32px;font-weight:700;color:var(--owed-by);margin-top:2px">320 <span style="font-family:var(--font-sans);font-size:12px;color:var(--text-3)">ر.س</span></div></div>
    <div class="grp" style="margin-top:20px"><span style="font-size:14px;color:var(--text)">سجل الحركات</span></div>
    <div class="card">
      <div class="row"><span class="ic" style="border-radius:50%;background:rgba(46,230,200,.13);color:var(--owed-to)">${I.out}</span><div style="flex:1"><div class="ft" style="font-size:13.5px">استلمت منه · <span style="color:var(--text-2)">وقود</span></div><div class="fs"><span class="num">2026/10/10</span> · صُرفت مباشرة · موعد الإرجاع <span class="num">2026/10/31</span></div></div><span class="num" style="font-weight:700;color:var(--owed-to)">−120</span></div>
      <div class="row"><span class="ic" style="border-radius:50%;background:rgba(46,230,200,.13);color:var(--owed-to)">${I.out}</span><div style="flex:1"><div class="ft" style="font-size:13.5px">استلمت منه</div><div class="fs"><span class="num">2026/09/22</span> · الكاش</div></div><span class="num" style="font-weight:700;color:var(--owed-to)">−200</span></div>
    </div>
    <div class="info" style="margin-top:12px">${I.info}<div>السلفة المربوطة تظهر هنا مثل أي سلفة استلمتها، ومعها اسم الفئة التي صُرفت عليها بدل اسم الحساب. السداد لاحقًا كالمعتاد: «أعطه مبلغ».</div></div>`,

  () => `<div class="h1">السلف والديون</div>
    <div class="hero"><div style="font-size:12.5px;color:var(--text-2)">صافي موقفك</div><div class="num" style="font-size:32px;font-weight:700;color:var(--expense);margin-top:2px" dir="ltr">−320 <span style="font-family:var(--font-sans);font-size:12px;color:var(--text-3)">ر.س</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><div><div class="fs">مستحق لك</div><div class="num" style="font-size:16px;font-weight:700">0</div></div><div><div class="fs">إجمالي عليك</div><div class="num" style="font-size:16px;font-weight:700">320</div></div></div></div>
    <div class="info" style="margin-top:12px">${I.info}<div>بما أنها سلفة حقيقية (عليك ترجيعها)، تدخل في «إجمالي عليك» وفي سبارك السلف، وتظهر في «آخر الحركات» بشاشة السلف.</div></div>`,

  () => `<div class="h1">حذف المصروف</div>
    <div class="tx"><span class="ic" style="background:rgba(255,138,26,.15);color:var(--fuel)">${I.fuel}</span><div style="flex:1"><div class="ft">وقود</div><div class="fs">بسلفة من سعد</div></div><div class="num" dir="ltr" style="font-weight:700">−120 ر.س</div></div>
    <div style="position:relative;margin-top:30px;border-radius:32px;border:1px solid var(--border-strong);background:var(--surface-el);padding:24px;text-align:center">
      <span class="ic" style="margin:0 auto 12px;width:52px;height:52px;border-radius:50%;background:rgba(255,95,109,.14);color:var(--expense)">${I.trash}</span>
      <div style="font-size:17px;font-weight:600">حذف المصروف</div>
      <div style="font-size:12.5px;color:var(--text-2);margin-top:8px;line-height:1.7">هذا المصروف مربوط بسلفة من سعد بـ <span class="num">120</span> ر.س. بيتم حذف الاثنين معًا، ويرجع رصيدك مع سعد كما كان.</div>
      <div style="display:flex;gap:10px;margin-top:18px"><button class="press" style="flex:1;padding:12px;border-radius:999px;background:rgba(255,255,255,.06);font-size:13.5px">إلغاء</button><button class="press" style="flex:1;padding:12px;border-radius:999px;background:var(--expense);color:var(--on-accent);font-size:13.5px;font-weight:600">حذف الاثنين</button></div>
    </div>
    <div class="info" style="margin-top:14px">${I.info}<div>التعديل كذلك مربوط: تغيير المبلغ أو التاريخ في المصروف يغيّر السلفة معه. ويمكن تحويله لمصروف عادي من حساب (تُحذف السلفة)، أو العكس.</div></div>`,
]

const NOTES = [
  () => S.opt===0
    ? '<span class="k">خيار 1 — قسمان منفصلان في ورقة الحساب</span>اضغط حقل الحساب: تحت الحسابات قسم «أو دفعها عنك شخص» (المساهمون فقط، كما هو الآن) وقسم جديد «أو تسلّفتها من شخص» (كل الأشخاص مع رصيدك الحالي معهم). اختيار شخص من القسم الثاني يحوّل المصروف لمصروف بسلفة. <b>جرّب اختيار شخص من كل قسم.</b>'
    : '<span class="k">خيار 2 — قسم أشخاص واحد ثم «مساهمة / سلفة»</span>في الورقة قسم واحد «أو من شخص» بكل الأشخاص. بعد الاختيار يظهر مفتاح في النموذج: «دفعها عني (مساهمة)» أو «سلفة (أرجّعها)». أقصر في الورقة، لكنه خطوة إضافية.',
  () => '<span class="k">الحركات</span>المصروف بشارة «بسلفة من سعد» وتحته «عليك لسعد». يدخل في المصروف والصافي والميزانية لأنه مصروف حقيقي عليك.',
  () => '<span class="k">صفحة الشخص</span>السلفة المربوطة تظهر كـ«استلمت منه» مع الفئة، وتزيد «عليك له».',
  () => '<span class="k">السلف</span>تدخل في صافي موقفك و«إجمالي عليك» تلقائيًا.',
  () => '<span class="k">الحذف والتعديل</span>العمليتان مربوطتان: حذف المصروف يحذف السلفة (مع تراجع)، وتعديل المبلغ يعدّلهما معًا.',
]

const root = document.getElementById('root')
function render(){
  root.innerHTML = `<div class="fade">${SCREENS[S.scr]()}</div>`
  document.querySelectorAll('#segScr button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.scr))
  document.querySelectorAll('#segOpt button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.opt))
  document.getElementById('optBox').style.display = S.scr===0?'':'none'
  document.getElementById('nScr').textContent = document.querySelector(`#segScr button[data-v="${S.scr}"]`).textContent
  document.getElementById('nOpt').textContent = 'خيار '+(S.opt+1)
  document.getElementById('note').innerHTML = NOTES[S.scr]()
}
document.getElementById('segScr').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.scr=+b.dataset.v;S.sheet=false;render()}
document.getElementById('segOpt').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.opt=+b.dataset.v;S.sheet=true;render()}
root.addEventListener('click',e=>{
  const p=e.target.closest('[data-pick]'); if(p){S.person=p.dataset.pick;S.kind=p.dataset.kind;S.sheet=false;render();return}
  const k=e.target.closest('[data-kind-set]'); if(k){S.kind=k.dataset.kindSet;render();return}
  if(e.target.closest('[data-due]')){S.due=!S.due;render();return}
  if(e.target.closest('[data-close]')||e.target.closest('[data-acc]')){S.sheet=false;render();return}
  if(e.target.closest('[data-sheet]')){S.sheet=true;render()}
})
render()
</script>
</body>
</html>
