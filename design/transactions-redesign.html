<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل الحركات — تصميم مقترح</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c; --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff; --owed:#2ee6c8;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0 40px}
  button,input{font:inherit;color:inherit;background:none;border:0}
  button{cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .press{transition:transform .15s var(--ease)}.press:active{transform:scale(.97)}
  .note{font-size:11.5px;color:#6b6b75;margin-bottom:12px;text-align:center;padding:0 16px;max-width:460px;line-height:1.7}

  .phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){body{padding-top:8px}.phone{border-radius:0;border:0;height:calc(100vh - 70px)}}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:64px 16px 120px}
  .scroll::-webkit-scrollbar{display:none}
  .aurora{position:absolute;top:-120px;left:-60px;right:-60px;height:340px;background:radial-gradient(50% 60% at 70% 40%,rgba(139,123,255,.14),transparent 70%);pointer-events:none}
  .hrow{position:absolute;top:0;left:0;right:0;height:64px;padding:12px 16px 0;display:flex;align-items:center;gap:8px;z-index:20}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(24,24,28,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);flex-shrink:0}
  .gb.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .sp{flex:1}
  .capsule{position:absolute;top:12px;left:50%;height:40px;transform:translate(-50%,-6px) scale(.92);opacity:0;transition:all .3s var(--ease);display:flex;align-items:center;padding:0 16px;border-radius:99px;background:rgba(28,28,33,.86);backdrop-filter:blur(20px);border:1px solid var(--border-strong);font-size:13.5px;font-weight:700;z-index:21;white-space:nowrap}
  .capsule.on{opacity:1;transform:translate(-50%,0)}
  h1{font-size:28px;font-weight:700;margin:4px 4px 14px}

  /* شريط الأدوات اللاصق */
  .tools{position:sticky;top:-64px;z-index:10;margin:0 -16px;padding:4px 16px 10px;background:linear-gradient(180deg,var(--bg) 85%,transparent)}
  .tools.stuck{padding-top:68px}
  .srow{display:flex;gap:8px}
  .search{flex:1;display:flex;align-items:center;gap:8px;height:44px;border-radius:99px;background:var(--surface);border:1px solid var(--border);padding:0 14px;color:var(--text-3)}
  .search:focus-within{border-color:rgba(255,255,255,.28)}
  .search input{flex:1;min-width:0;outline:none;font-size:13px;color:var(--text)}
  .search input::placeholder{color:var(--text-3)}
  .sq{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text-2);position:relative;flex-shrink:0}
  .sq .n{position:absolute;top:-3px;left:-3px;min-width:18px;height:18px;border-radius:99px;background:var(--expense);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;gap:5px}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .chip i{width:7px;height:7px;border-radius:50%}
  .chip.active-f{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--border-strong)}

  /* ملخص النتائج */
  .sum{border-radius:22px;border:1px solid rgba(255,255,255,.09);padding:14px;margin:4px 0 14px;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.06),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .sum .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2)}
  .sum .t b{color:var(--text)}
  .sum .t button{font-size:11.5px;font-weight:600;color:var(--text-2);display:flex;gap:4px;align-items:center}
  .sum .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .sum .c{background:rgba(255,255,255,.04);border-radius:14px;padding:9px 8px;text-align:center}
  .sum .c small{font-size:10.5px;color:var(--text-3);display:block}
  .sum .c b{font-size:15px;font-weight:700}
  .bar{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin-top:10px;background:rgba(255,255,255,.05)}

  /* الفئات */
  .cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
  .cats::-webkit-scrollbar{display:none}
  .ct{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:right}
  .ct .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
  .ct b{font-size:11.5px;display:block;font-weight:600}
  .ct small{font-size:11px;color:var(--text-3)}
  .ct.on{border-color:var(--accent);background:var(--surface-hi)}

  /* القائمة */
  .month{display:flex;justify-content:space-between;align-items:center;margin:6px -4px 6px;padding:7px 12px;border-radius:12px;background:rgba(26,26,31,.92);backdrop-filter:blur(14px);border:1px solid var(--border);font-size:12px;font-weight:700}
  .month span{font-weight:600;color:var(--text-3)}
  .day{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--text-3);margin:12px 6px 7px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
  .tr{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;text-align:right;transition:background .15s}
  .tr + .tr{border-top:1px solid var(--border)}
  .tr .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;position:relative}
  .tr .m{flex:1;min-width:0}
  .tr .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .s{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .a{font-size:13.5px;font-weight:700;flex-shrink:0}
  mark{background:rgba(255,191,71,.25);color:var(--text);border-radius:4px;padding:0 2px}
  .tr .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:none;place-items:center;flex-shrink:0}
  .selmode .tr .ck{display:grid}
  .tr.sel{background:rgba(255,255,255,.05)}
  .tr.sel .ck{background:var(--accent);border-color:transparent;color:var(--on-accent)}
  .more{display:block;width:100%;margin:14px 0 6px;padding:12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2)}
  .hint{text-align:center;font-size:11px;color:var(--text-3);margin-top:8px}
  .empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px}
  .empty button{margin-top:12px;padding:9px 16px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12.5px}

  /* شريط التحديد */
  .selbar{position:absolute;left:12px;right:12px;bottom:16px;z-index:30;border-radius:22px;background:rgba(30,30,36,.96);backdrop-filter:blur(20px);border:1px solid var(--border-strong);box-shadow:0 20px 44px -12px rgba(0,0,0,.9);padding:10px;display:flex;align-items:center;gap:8px;transform:translateY(140%);transition:transform .35s var(--ease)}
  .selbar.on{transform:none}
  .selbar .c{flex:1;font-size:12.5px;font-weight:700;padding-inline-start:6px}
  .selbar .c small{display:block;font-size:10.5px;color:var(--text-3);font-weight:500}
  .selbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-2);padding:6px 8px;border-radius:12px}
  .selbar button.del{color:var(--expense)}

  /* ورقة الترتيب */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-el);border-top:1px solid var(--border-strong);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .4s var(--ease);z-index:41;padding:10px 16px 24px}
  .sheet.on{transform:none}
  .handle{width:38px;height:4.5px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .sheet h3{font-size:16px;margin:0 4px 10px}
  .opt{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:16px;font-size:13.5px;font-weight:600;margin-bottom:6px;background:var(--surface);border:1px solid var(--border)}
  .opt.on{border-color:var(--accent)}
</style>
</head>
<body>
<div class="note">جرّب: البحث (اكتب «بنده» أو «42»)، أزرار النوع والفترة، فئة بالأعلى، زر الترتيب، وزر التحديد ✓ لتحديد عدة حركات</div>

        <button class="sq press" id="sortBtn" aria-label="ترتيب"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4"/></svg></button>

    <button class="press"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>تصدير</button>
    <button class="press del"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>حذف</button>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="handle"></div><h3>ترتيب الحركات</h3><div id="sortOpts"></div></div>
</div>

const ICONS={"food": "<path d=\"M6 3v7a2 2 0 0 0 4 0V3\" /> <path d=\"M8 3v18\" /> <path d=\"M8 10v0\" /> <path d=\"M17 3c-1.7 0-3 2-3 5s1.3 5 3 5v9\" />", "groceries": "<path d=\"M3 6h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 9H6.5\" /> <circle cx=\"9.5\" cy=\"21\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" /> <circle cx=\"17\" cy=\"21\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" />", "coffee": "<path d=\"M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z\" /> <path d=\"M17 9h1.5a2.5 2.5 0 0 1 0 5H17\" /> <path d=\"M7 2.5c0 1-1 1-1 2s1 1 1 2\" /> <path d=\"M11 2.5c0 1-1 1-1 2s1 1 1 2\" />", "transport": "<path d=\"M3 13.5 5 8a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5.5\" /> <path d=\"M2.5 13.5h19v4a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1h-11v1a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1v-4Z\" /> <circle cx=\"7\" cy=\"15.5\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" /> <circle cx=\"17\" cy=\"15.5\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" />", "bills": "<path d=\"M6 2.5h12v19l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V2.5Z\" /> <path d=\"M8.5 7.5h7M8.5 11h7M8.5 14.5h4\" />", "shopping": "<path d=\"M6 8h12l-1 12.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20.5L6 8Z\" /> <path d=\"M9 8V6a3 3 0 0 1 6 0v2\" />", "clothing": "<path d=\"M9 3 3 6.5 5.5 10 8 8.5V21h8V8.5l2.5 1.5L21 6.5 15 3a3 3 0 0 1-6 0Z\" />", "health": "<path d=\"M20.5 8.5c0 5-8.5 11.5-8.5 11.5S3.5 13.5 3.5 8.5a4.5 4.5 0 0 1 8.5-2 4.5 4.5 0 0 1 8.5 2Z\" />", "gym": "<path d=\"M4 9v6M2.5 10.5v3M20 9v6M21.5 10.5v3\" /> <path d=\"M7 12h10\" /> <path d=\"M7 8v8M17 8v8\" />", "sports": "<circle cx=\"12\" cy=\"12\" r=\"9\" /> <path d=\"M12 3v18M3 12h18\" /> <path d=\"M5.5 5.5c2 2.5 2 10.5 0 13M18.5 5.5c-2 2.5-2 10.5 0 13\" />", "fun": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.5\" /> <polygon points=\"10,9 15,12 10,15\" fill=\"currentColor\" stroke=\"none\" />", "subscriptions": "<path d=\"M4 12a8 8 0 0 1 13.7-5.7L20 8\" /> <path d=\"M20 4v4h-4\" /> <path d=\"M20 12a8 8 0 0 1-13.7 5.7L4 16\" /> <p 2.5v3a2 2 0 0 0 2 2h8.5a4 4 0 0 0 3.7-2.5\" /> <path d=\"M16 6.5c1-1 2-1 3 0\" /> <circle cx=\"9.5\" cy=\"13\" r=\"1\" fill=\"currentColor\" stroke=\"none\" />"};

 [2,'exp','food',64,'هرفي','الكاش'],[3,'exp','bills',230,'STC','الراجحي'],[3,'loan',null,300,'محمد — أعطيته','الكاش'],
 [4,'exp','shopping',149,'نون','STC Pay'],[5,'exp','coffee',22,'','الراجحي'],[6,'exp','groceries',96,'بنده','الراجحي'],
 [9,'exp','food',120,'مطعم','الراجحي'],[10,'exp','bills',690,'كهرباء','الراجحي'],[12,'exp','transport',80,'وقود','الراجحي'],
 [14,'exp','groceries',240,'الدانوب','الراجحي'],[18,'exp','coffee',35,'','الكاش'],[21,'exp','shopping',420,'إكسترا','الراجحي'],
 [26,'exp','food',88,'','الراجحي'],[31,'inc',null,9500,'الراتب','الراجحي'],[33,'exp','groceries',310,'بنده','الراجحي'],[36,'exp','bills',230,'STC','الراجحي'],
].map(([d,t,c,a,n,acc],i)=>({id:i,date:iso(d),type:t,cat:c,amount:a,note:n,acc}));
const TYPES=[['all','الكل',null],['exp','مصروف','var(--expense)'],['inc','دخل','var(--income)'],['tr','تحويل','var(--transfer)'],['loan','سلف','var(--owed)']];
const PERIODS=[['all','كل الوقت'],['month','هذا الشهر'],['last','الشهر الماضي'],['30','آخر 30 يوم'],['custom','فترة مخصصة']];
const SORTS=[['new','الأحدث أولًا'],['old','الأقدم أولًا'],['high','الأعلى مبلغًا'],['low','الأقل مبلغًا']];
let st={type:'all',period:'all',cat:null,q:'',sort:'new',sel:new Set(),selmode:false,limit:14};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-US');
const title=t=>t.type==='exp'?CATS[t.cat][0]:t.type==='inc'?'دخل':t.type==='tr'?'تحويل بين الحسابات':'سلفة';
const signed=t=>t.type==='inc'?t.amount:t.type==='loan'?-t.amount:-t.amount;
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function filtered(noCat){
  const q=st.q.trim();
  return TX.filter(t=>{
    if(st.type!=='all'&&t.type!==st.type)return false;
    if(!noCat&&st.cat&&t.cat!==st.cat)return false;
    const m=t.date.slice(0,7);
    if(st.period==='month'&&m!=='2026-10')return false;
    if(st.period==='last'&&m!=='2026-09')return false;
    if(st.period==='30'&&t.date<iso(30))return false;
    if(q&&!(title(t).includes(q)||t.note.includes(q)||t.acc.includes(q)||String(t.amount).includes(q)))return false;
    return true;
  }).sort((a,b)=>st.sort==='new'?b.date.localeCompare(a.date):st.sort==='old'?a.date.localeCompare(b.date):st.sort==='high'?b.amount-a.amount:a.amount-b.amount);
}
const hl=s=>{const q=st.q.trim();return q&&s.includes(q)?s.split(q).join(`<mark>${q}</mark>`):s};
function render(){
  $('types').innerHTML=TYPES.map(([k,l,c])=>`<button class="chip ${st.type===k?'on':''}" data-type="${k}">${c?`<i style="background:${c}"></i>`:''}${l}</button>`).join('');
  $('periods').innerHTML=PERIODS.map(([k,l])=>`<button class="chip ${st.period===k?'on':''}" data-period="${k}">${k==='custom'?S('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',13,2):''}${l}</button>`).join('');
  const act=[];if(st.cat)act.push(['cat',CATS[st.cat][0]]);if(st.q.trim())act.push(['q','«'+st.q.trim()+'»']);
  $('active').innerHTML=act.length?`<div class="chips" style="margin:0 -16px 10px">${act.map(([k,l])=>`<button class="chip active-f" data-clear="${k}">${l} ${S('<path d="M6 6l12 12M18 6 6 18"/>',11,2.6)}</button>`).join('')}<button class="chip" data-clear="all" style="color:var(--expense)">مسح الكل</button></div>`:'';
  $('fcount').style.display=act.length?'grid':'none';$('fcount').textContent=act.length;
  const list=filtered();
  const inc=list.filter(t=>t.type==='inc').reduce((s,t)=>s+t.amount,0),exp=list.filter(t=>t.type==='exp').reduce((s,t)=>s+t.amount,0);
  $('sum').innerHTML=`<div class="t"><span><b class="num">${list.length}</b> حركة ${st.period==='all'?'':'· '+PERIODS.find(p=>p[0]===st.period)[1]}</span><button class="press">${S('<path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',13,2)}تصدير النتائج</button></div>
    <div class="g"><div class="c"><small>الدخل</small><b class="num" style="color:var(--income)">${fmt(inc)}</b></div><div class="c"><small>المصروف</small><b class="num" style="color:var(--expense)">${fmt(exp)}</b></div><div class="c"><small>الصافي</small><b class="num" dir="ltr">${inc-exp<0?'−':''}${fmt(Math.abs(inc-exp))}</b></div></div>
    ${inc+exp?`<div class="bar"><span style="flex:${inc};background:var(--income)"></span><span style="flex:${exp};background:var(--expense)"></span></div>`:''}`;
  const base=filtered(true).filter(t=>t.type==='exp');const tot={};base.forEach(t=>tot[t.cat]=(tot[t.cat]||0)+t.amount);
  $('cats').innerHTML=Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button class="ct press ${st.cat===k?'on':''}" data-cat="${k}"><span class="ic" style="background:${soft(CATS[k][1])};color:${CATS[k][1]}">${cic(k,16)}</span><span><b>${CATS[k][0]}</b><small class="num">${fmt(v)}</small></span></button>`).join('');
  if(!list.length){$('list').innerHTML=`<div class="card empty">لا توجد حركات مطابقة<br><button data-clear="all">مسح الفلاتر</button></div>`;return;}
  const shown=list.slice(0,st.limit);let html='',lastM='',lastD='';const byDate=st.sort==='new'||st.sort==='old';
  const monthTotal=m=>list.filter(t=>t.date.startsWith(m)).reduce((s,t)=>s+(t.type==='tr'?0:signed(t)),0);
  const dayTotal=d=>list.filter(t=>t.date===d).reduce((s,t)=>s+(t.type==='tr'?0:signed(t)),0);
  const row=t=>{const isC=t.type==='exp';const col=isC?CATS[t.cat][1]:t.type==='inc'?'var(--income)':t.type==='tr'?'var(--transfer)':'var(--owed)';
    const ic=isC?cic(t.cat):t.type==='inc'?S('<path d="M12 19V5M6 11l6-6 6 6"/>',18):t.type==='tr'?S('<path d="M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12"/>',18):S('<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5"/>',18);
    const sel=st.sel.has(t.id);const v=signed(t);
    return `<button class="tr ${sel?'sel':''}" data-id="${t.id}"><span class="ck">${sel?S('<path d="M5 12.5 10 17l9-10"/>',12,3):''}</span><span class="ic" style="background:${soft(col)};color:${col}">${ic}</span><span class="m"><div class="n">${hl(title(t))}</div><div class="s">${t.note?hl(t.note)+' · ':''}${hl(t.acc)}${byDate?'':' · <span class="num">'+t.date.slice(5).replace('-','/')+'</span>'}</div></span><span class="a num" dir="ltr" style="color:${v>0?'var(--income)':'var(--text)'}">${v>0?'+':'−'}${hl(fmt(t.amount))}</span></button>`;};
  if(byDate){let open=false;
    shown.forEach(t=>{const m=t.date.slice(0,7);
      if(m!==lastM){if(open)html+='</div>';open=false;const mt=monthTotal(m);html+=`<div class="month"><b>${MONTHS[+m.slice(5)-1]} ${m.slice(0,4)}</b><span class="num" dir="ltr">${mt<0?'−':'+'}${fmt(Math.abs(mt))}</span></div>`;lastM=m;lastD='';}
      if(t.date!==lastD){if(open)html+='</div>';const k=Math.round((today-new Date(t.date))/864e5);const dt=dayTotal(t.date);html+=`<div class="day"><span>${k===0?'اليوم':k===1?'أمس':t.date.slice(8)+' '+MONTHS[+t.date.slice(5,7)-1]}</span><span class="num" dir="ltr">${dt<0?'−':'+'}${fmt(Math.abs(dt))}</span></div><div class="card">`;open=true;lastD=t.date;}
      html+=row(t);});if(open)html+='</div>';
  } else html=`<div class="card" style="margin-top:4px">${shown.map(row).join('')}</div>`;
  if(list.length>st.limit)html+=`<button class="more press" data-more>عرض المزيد (${list.length-st.limit})</button>`;
  html+=`<div class="hint">${st.selmode?'اضغط الحركات لتحديدها':'اسحب يسارًا للحذف · يمينًا للتكرار · اضغط مطوّلًا للتحديد'}</div>`;
  $('list').innerHTML=html;
  $('phone').classList.toggle('selmode',st.selmode);$('selBtn').classList.toggle('on',st.selmode);
  const selT=TX.filter(t=>st.sel.has(t.id));$('selc').innerHTML=`${st.sel.size} محددة<small class="num">مجموع ${fmt(selT.reduce((s,t)=>s+t.amount,0))} ر.س</small>`;
  $('selbar').classList.toggle('on',st.selmode&&st.sel.size>0);
}
$('q').oninput=e=>{st.q=e.target.value;st.limit=14;render();};
document.addEventListener('click',e=>{
  const g=(a)=>e.target.closest(`[${a}]`);let el;
  if(el=g('data-type')){st.type=el.dataset.type;st.limit=14;render();return;}
  if(el=g('data-period')){st.period=el.dataset.period==='custom'?st.period:el.dataset.period;render();return;}
  if(el=g('data-cat')){st.cat=st.cat===el.dataset.cat?null:el.dataset.cat;render();return;}
  if(el=g('data-clear')){const k=el.dataset.clear;if(k==='cat'||k==='all')st.cat=null;if(k==='q'||k==='all'){st.q='';$('q').value='';}if(k==='all'){st.type='all';st.period='all';}render();return;}
  if(el=g('data-more')){st.limit+=14;render();return;}
  if(el=g('data-id')){if(st.selmode){const id=+el.dataset.id;st.sel.has(id)?st.sel.delete(id):st.sel.add(id);render();}return;}
  if(e.target.closest('#selBtn')){st.selmode=!st.selmode;st.sel.clear();render();return;}
  if(e.target.closest('#sortBtn')){$('sortOpts').innerHTML=SORTS.map(([k,l])=>`<button class="opt ${st.sort===k?'on':''}" data-sort="${k}">${l}${st.sort===k?S('<path d="M5 12.5 10 17l9-10"/>',15,2.6):''}</button>`).join('');$('sheet').classList.add('on');$('scrim').classList.add('on');return;}
  if(el=g('data-sort')){st.sort=el.dataset.sort;$('sheet').classList.remove('on');$('scrim').classList.remove('on');render();return;}
  if(e.target.id==='scrim'){$('sheet').classList.remove('on');$('scrim').classList.remove('on');}
});
$('scroll').addEventListener('scroll',()=>{$('capsule').classList.toggle('on',$('scroll').scrollTop>40);const tl=document.querySelector('.tools');tl.classList.toggle('stuck',tl.getBoundingClientRect().top-$('phone').getBoundingClientRect().top<=60);});
render();
</script>
</body>
