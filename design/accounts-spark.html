<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحسابات — السبارك</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff; --sub:#ffbf47; --emergency:#ff3d6e; --fuel:#ff8a1a;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.56,.64,1); --expo:cubic-bezier(.16,1,.3,1); --calm:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:18px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .press{transition:transform .18s var(--spring)}.press:active{transform:scale(.97)}

  .intro{width:100%;max-width:420px}
  .intro h1{font-size:22px;font-weight:700}
  .intro p{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.7}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px}
  .plbl{font-size:11.5px;color:var(--text-3);font-weight:500;margin-bottom:7px;display:flex;justify-content:space-between}
  .plbl b{color:var(--text-2);font-weight:600}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong);overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:background .3s var(--spring),color .2s}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .tg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .tg.on{background:var(--accent);color:var(--on-accent);border-color:transparent}

  .phone{width:390px;max-width:100%;background:var(--bg);border-radius:40px;border:1px solid #1d1d22;padding:22px 20px 30px;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:28px;padding:18px 14px 24px}}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--border)}
  .gb.w{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .h1{font-size:28px;font-weight:700;margin-top:14px}
  .h1s{font-size:12px;color:var(--text-3);margin-top:2px}

  .hero{position:relative;overflow:hidden;margin-top:18px;border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:20px;touch-action:pan-y;user-select:none;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .lbl{font-size:12.5px;font-weight:500;color:var(--text-2)}
  .big{font-size:36px;font-weight:700;margin-top:6px;text-shadow:0 2px 14px rgba(5,5,6,.9)}
  .big small{font-size:.45em;opacity:.5}
  .big .cur{font-family:var(--font-sans);font-size:.38em;opacity:.55;font-weight:500;margin-inline-start:6px}
  .chg{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--text-3)}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
  .chart{position:relative}
  .chart svg{position:absolute;inset:0;overflow:visible}
  .when{position:absolute;left:0;bottom:2px;font-size:10.5px;color:var(--text-2);background:rgba(10,10,12,.75);border:1px solid var(--border);border-radius:999px;padding:2px 9px;backdrop-filter:blur(10px)}
  .alloc{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;margin-top:14px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11px;color:var(--text-2)}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:5px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .btns button{padding:12px;border-radius:999px;font-size:13px;font-weight:600}
  .per{display:flex;gap:4px;margin-top:10px}
  .per button{flex:1;height:28px;border-radius:999px;font-size:11px;font-weight:600;color:var(--text-3)}
  .per button.on{background:rgba(255,255,255,.08);color:var(--text)}

  .sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
  .sec h2{font-size:15px;font-weight:600}
  .grp{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--text-3);padding:0 6px 8px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;margin-bottom:16px}
  .row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:right;border-top:1px solid var(--border)}
  .row:first-child{border-top:0}
  .thumb{width:46px;height:30px;border-radius:7px;flex-shrink:0;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px -4px rgba(0,0,0,.8)}
  .thumb::after{content:'';position:absolute;right:5px;top:6px;width:9px;height:7px;border-radius:2px;background:rgba(255,255,255,.55)}
  .rn{font-size:14px;font-weight:600}
  .rs{font-size:11px;color:var(--text-3);margin-top:2px}
  .rb{font-size:15px;font-weight:700}
  .mini{width:58px;height:26px;position:relative;flex-shrink:0}
  .bgspark{position:absolute;inset:0;pointer-events:none;opacity:.55}
  .detail{padding:0 14px 14px}
  .dchart{position:relative;height:96px;margin:4px -4px 0 -14px;touch-action:pan-y}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .acts button{border-radius:16px;background:var(--surface-el);border:1px solid var(--border);padding:10px 2px;font-size:10.5px;font-weight:600;color:var(--text-2)}

  .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .area{animation:fade .9s .6s both}
  @keyframes fade{from{opacity:0}}
  .pulse{animation:pulse 1.8s 1.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
  .popin{animation:pop .5s var(--spring) both;transform-box:fill-box;transform-origin:center}
  @keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
  .rise{animation:rise .5s var(--expo) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}

  .note{width:100%;max-width:420px;font-size:12px;color:var(--text-2);line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px}
  .note .k{color:var(--text-3);font-size:11px;display:block;margin-bottom:2px}
</style>
</head>
<body>

<div class="intro">
  <h1>شاشة الحسابات — السبارك</h1>
  <p>سبارك لرصيد كل الحسابات خلف «إجمالي الأرصدة»، وسبارك صغير لكل حساب في القائمة، وسبارك أكبر داخل تفاصيل الحساب. اسحب إصبعك على أي سبارك كبير لترى الرصيد في أي يوم. اضغط أي حساب لفتح تفاصيله.</p>
</div>

<div class="panel">
  <div>
    <div class="plbl">صفوف الحسابات <b id="nRow"></b></div>
    <div class="seg" id="segRow">
      <button data-v="0" class="on"><span class="num">1</span> · سبارك بجانب الرصيد</button>
      <button data-v="1"><span class="num">2</span> · سبارك خلف الصف</button>
      <button data-v="2"><span class="num">3</span> · بدون</button>
    </div>
  </div>
  <div>
    <div class="plbl">لون خط الحساب <b id="nCol"></b></div>
    <div class="seg" id="segCol">
      <button data-v="0" class="on"><span class="num">1</span> · حسب الاتجاه</button>
      <button data-v="1"><span class="num">2</span> · لون الحساب</button>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="tg press" id="tgHide">إخفاء المبالغ</button>
  </div>
</div>

<div class="phone">
  <div class="top">
    <div style="display:flex;gap:8px"><span class="gb">${0}</span></div>
  </div>
  <div id="root"></div>
</div>

<div class="note" id="note"></div>

<script>
const svg = (p,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']
const TODAY = new Date(2026,9,9)
const dLabel = (i,n) => { if(i===n-1) return 'اليوم'; const d=new Date(TODAY); d.setDate(d.getDate()-(n-1-i)); return `${d.getDate()} ${MONTHS[d.getMonth()]}` }

/* ===== الحسابات: رصيد كل يوم لآخر 365 يومًا (تقريبي وثابت) ===== */
const CARD_BG = {
  bank:'linear-gradient(150deg,#8d8d97 0%,#5a5a63 40%,#33333a 75%,#1c1c21 100%)',
  cash:'linear-gradient(160deg,#1c1c21 0%,#0b0b0d 60%,#030304 100%)',
  wallet:'linear-gradient(150deg,#44444c 0%,#2a2a30 45%,#141417 100%)',
  savings:'linear-gradient(150deg,#ffffff 0%,#e6e6eb 45%,#b7b7c0 100%)',
  emergency:'linear-gradient(150deg,#ff6b8e 0%,#e0174d 45%,#6b0820 100%)',
  fuel:'linear-gradient(150deg,#ffad4d 0%,#ff7a1a 40%,#8a3306 100%)',
}
const TYPE_COLOR = {bank:'var(--transfer)',cash:'var(--income)',wallet:'var(--accent)',savings:'var(--sub)',emergency:'var(--emergency)',fuel:'var(--fuel)'}
const TYPE_LABEL = {bank:'بنكي',cash:'نقدي',wallet:'محفظة رقمية',savings:'ادخار',emergency:'طوارئ',fuel:'بطاقة وقود'}
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
// يبني السلسلة للخلف من الرصيد الحالي: نزول يومي صغير (مصاريف) وقفزات (راتب/إيداع)
function series(now, seed, {daily=0, jumps=[], noise=0}={}){
  const r=rng(seed), out=[]; let v=now
  for(let i=0;i<365;i++){ out.push(Math.max(0,Math.round(v))); v += daily*(0.4+r()*1.2) + (r()-.5)*noise; for(const [d,a,o=d-1] of jumps) if(i%d===o) v -= a }
  return out.reverse()
}
const ACCOUNTS = [
  {id:'b',name:'الراجحي',type:'bank',bal:8240,data:series(8240,3,{daily:95,jumps:[[30,3900,5]],noise:120})},
  {id:'c',name:'الكاش',type:'cash',bal:620,data:series(620,7,{daily:22,jumps:[[14,500,3]],noise:30})},
  {id:'w',name:'STC Pay',type:'wallet',bal:340,data:series(340,11,{daily:6,jumps:[[45,200]],noise:20})},
  {id:'s',name:'الادخار',type:'savings',bal:12000,goal:20000,goalLabel:'سيارة',data:series(12000,5,{daily:0,jumps:[[30,1000,6]],noise:0})},
  {id:'e',name:'الطوارئ',type:'emergency',bal:5000,data:series(5000,9,{daily:0,jumps:[[90,1000]],noise:0})},
  {id:'f',name:'وقود',type:'fuel',bal:180,data:series(180,13,{daily:-12,jumps:[[21,-300,4]],noise:10})},
]
const GROUPS = [['الاستخدام اليومي',['cash','bank','wallet']],['الادخار والطوارئ',['savings','emergency']],['بطاقات مسبقة الدفع',['fuel']]]
const TOTAL = ACCOUNTS[0].data.map((_,i)=>ACCOUNTS.reduce((s,a)=>s+a.data[i],0))
const PERIODS = [[7,'أسبوع'],[30,'شهر'],[90,'3 أشهر'],[365,'سنة']]

const S = { row:0, col:0, hide:false, open:'b', days:30, scrub:null, dScrub:null, dDays:30 }
const fmt = n => Math.round(Math.abs(n)).toLocaleString('en-US')
const slice = (arr,n) => arr.slice(arr.length-n)
const up = arr => arr[arr.length-1] >= arr[0]
const trendCol = arr => up(arr)?'var(--income)':'var(--expense)'
const mask = s => S.hide ? '•••' : s

/* ===== رسم السبارك (الزمن من اليسار للأقدم إلى اليمين لليوم) ===== */
function spark(vals, color, {w,h,pad=6,dots=true,scrub=null,zero=false,fade=false}={}){
  const n=vals.length, min=zero?0:Math.min(...vals), max=Math.max(...vals), range=(max-min)||1
  const X=i=>i/(n-1)*w, Y=v=>h-pad-(v-min)/range*(h-pad*2)
  const id=Math.random().toString(36).slice(2,7)
  const d=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('')
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>
    ${fade?`<linearGradient id="f${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".35" stop-color="#fff"/></linearGradient><mask id="m${id}"><rect width="${w}" height="${h}" fill="url(#f${id})"/></mask>`:''}</defs>
    <g ${fade?`mask="url(#m${id})"`:''}><path class="area" d="${d}L${w},${h}L0,${h}Z" fill="url(#g${id})"/><path class="ln draw" d="${d}" stroke="${color}"/></g>`
  if(dots){
    if(scrub===null) s+=`<circle class="pulse" cx="${X(n-1)}" cy="${Y(vals[n-1])}" r="4" fill="${color}" opacity=".5"/><circle class="popin" style="animation-delay:1.2s" cx="${X(n-1)}" cy="${Y(vals[n-1])}" r="3.5" fill="${color}" stroke="var(--bg)" stroke-width="2"/>`
    else s+=`<line x1="${X(scrub)}" x2="${X(scrub)}" y1="-6" y2="${h+6}" stroke="rgba(255,255,255,.3)"/><circle cx="${X(scrub)}" cy="${Y(vals[scrub])}" r="4.5" fill="#fff" stroke="${color}" stroke-width="2.5"/>`
  }
  return s+'</svg>'
}
function draw(root, animate){
  root.querySelectorAll('.draw').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;if(!animate){p.style.strokeDashoffset=0;return}
    p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1) .2s';p.style.strokeDashoffset=0})
  if(!animate) root.querySelectorAll('.area,.popin').forEach(e=>e.style.animation='none')
}
const chg = (vals) => { const a=vals[0], b=vals[vals.length-1], d=b-a, p=a?d/a*100:0, c=d>=0?'var(--income)':'var(--expense)'
  return `<span class="pill num" dir="ltr" style="color:${c};background:color-mix(in srgb,${c} 13%,transparent)">${svg(d>=0?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M12 5v14M6 13l6 6 6-6"/>',10,2.8)}${mask(fmt(d))}${S.hide?'':' · '+Math.abs(p).toFixed(1)+'%'}</span>` }

/* ===== بطاقة الإجمالي ===== */
function hero(){
  const vals=slice(TOTAL,S.days), i=S.scrub??vals.length-1, v=vals[i], col=trendCol(vals)
  const label = S.scrub===null?'إجمالي الأرصدة':`رصيدك في ${dLabel(i,vals.length)}`
  const pos = ACCOUNTS.filter(a=>a.bal>0).sort((a,b)=>b.bal-a.bal), tot=pos.reduce((s,a)=>s+a.bal,0)
  return `<div class="hero rise" id="hero">
    <div class="lbl">${label}</div>
    <div class="big num">${S.hide?'••••••':fmt(v)}<small>.00</small><span class="cur">ر.س</span></div>
    <div class="chg">${chg(S.scrub===null?vals:vals.slice(0,i+1))}<span>${S.scrub===null?PERIODS.find(p=>p[0]===S.days)[1].replace('شهر','آخر 30 يوم').replace('أسبوع','آخر 7 أيام').replace('3 أشهر','آخر 3 أشهر').replace('سنة','آخر سنة'):'منذ بداية الفترة'}</span></div>
    <div class="chart" id="hChart" style="height:84px;margin:10px -4px 0 -20px">${''}</div>
    <div class="per">${PERIODS.map(([d,l])=>`<button class="press ${S.days===d?'on':''}" data-days="${d}">${l}</button>`).join('')}</div>
    <div class="alloc">${pos.map(a=>`<span style="flex-grow:${Math.max(a.bal,tot*.012)};background:${TYPE_COLOR[a.type]}"></span>`).join('')}</div>
    <div class="legend">${GROUPS.map(([t,ty])=>{const s=ACCOUNTS.filter(a=>ty.includes(a.type)).reduce((x,a)=>x+a.bal,0);return `<span><i style="background:${TYPE_COLOR[ty[0]]}"></i>${t} <b class="num" style="color:var(--text)">${S.hide?'••':Math.round(s/tot*100)+'%'}</b></span>`}).join('')}</div>
    <div class="btns"><button class="press" style="background:var(--accent);color:var(--on-accent)">تحويل</button><button class="press" style="background:rgba(255,255,255,.06);border:1px solid var(--border-strong)">إيداع</button></div>
  </div>`
}

/* ===== الصفوف ===== */
function row(a){
  const vals=slice(a.data,30), col=S.col===0?trendCol(vals):TYPE_COLOR[a.type], open=S.open===a.id
  const d=vals[vals.length-1]-vals[0], dc=d>=0?'var(--income)':'var(--expense)'
  return `<div>
    <button class="row press" data-acc="${a.id}">
      ${S.row===1?`<div class="bgspark" data-bg="${a.id}"></div>`:''}
      <span class="thumb" style="background:${CARD_BG[a.type]}"></span>
      <div style="flex:1;min-width:0;position:relative"><div class="rn">${a.name}</div><div class="rs">${a.goalLabel?'هدف: '+a.goalLabel:TYPE_LABEL[a.type]}</div></div>
      ${S.row===0?`<div class="mini" data-mini="${a.id}"></div>`:''}
      <div style="text-align:left;position:relative;flex-shrink:0"><div class="rb num" dir="ltr">${mask(fmt(a.bal)+'.00')}</div>
        <div class="num" style="font-size:10.5px;margin-top:2px;color:${S.row===2?'var(--text-3)':dc}">${S.row===2?mask(Math.round(a.bal/ACCOUNTS.reduce((s,x)=>s+x.bal,0)*100)+'%')+' من الإجمالي':S.hide?'•••':(d>=0?'+':'−')+fmt(d)+' · 30 يوم'}</div></div>
      <span style="color:var(--text-3);transform:rotate(${open?90:0}deg);transition:transform .3s var(--calm)">${svg('<path d="m15 6-6 6 6 6"/>',14,2.4)}</span>
    </button>
    ${open?detail(a):''}
  </div>`
}
function detail(a){
  const vals=slice(a.data,S.dDays), i=S.dScrub??vals.length-1, col=S.col===0?trendCol(vals):TYPE_COLOR[a.type]
  return `<div class="detail rise" id="detail">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:2px">
      <div><div style="font-size:11px;color:var(--text-3)">${S.dScrub===null?'رصيد الحساب':'الرصيد في '+dLabel(i,vals.length)}</div><div class="num" style="font-size:22px;font-weight:700;margin-top:2px">${mask(fmt(vals[i]))} <span style="font-family:var(--font-sans);font-size:11px;color:var(--text-3);font-weight:500">ر.س</span></div></div>
      ${chg(S.dScrub===null?vals:vals.slice(0,i+1))}
    </div>
    <div class="dchart" id="dChart"></div>
    <div class="per" style="margin-top:6px">${PERIODS.map(([d,l])=>`<button class="press ${S.dDays===d?'on':''}" data-ddays="${d}">${l}</button>`).join('')}</div>
    ${a.goal?`<div style="margin-top:12px;border-radius:16px;background:var(--surface-el);padding:10px 12px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:8px"><span>هدف: ${a.goalLabel}</span><span class="num">${mask(Math.round(a.bal/a.goal*100)+'%')} من ${mask(fmt(a.goal))}</span></div><div style="height:6px;border-radius:99px;background:rgba(255,255,255,.07)"><div style="height:100%;width:${a.bal/a.goal*100}%;border-radius:99px;background:${TYPE_COLOR[a.type]}"></div></div></div>`:''}
    <div class="acts">${['إيداع','تحويل','بالرئيسية','تعديل'].map(l=>`<button class="press">${l}</button>`).join('')}</div>
  </div>`
}

/* ===== العرض ===== */
const root=document.getElementById('root')
function render(animate=true){
  root.innerHTML = `<div class="h1">حساباتك</div><div class="h1s"><span class="num">${ACCOUNTS.length}</span> حسابات · <span class="num">4</span> ظاهرة في الرئيسية</div>${hero()}
    <div class="sec"><h2>الحسابات</h2></div>
    ${GROUPS.map(([t,ty])=>{const list=ACCOUNTS.filter(a=>ty.includes(a.type));return `<div class="grp"><span>${t}</span><span class="num">${mask(fmt(list.reduce((s,a)=>s+a.bal,0))+' ر.س')}</span></div><div class="card">${list.map(row).join('')}</div>`}).join('')}`
  paint(animate)
  bindScrub(document.getElementById('hero'), document.getElementById('hChart'), ()=>slice(TOTAL,S.days).length, i=>{S.scrub=i;rerenderHero()})
  const dc=document.getElementById('dChart'); if(dc) bindScrub(dc, dc, ()=>S.dDays, i=>{S.dScrub=i;rerenderDetail()})
  document.querySelectorAll('#segRow button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.row))
  document.querySelectorAll('#segCol button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.col))
  document.getElementById('tgHide').classList.toggle('on',S.hide)
  document.getElementById('nRow').textContent='خيار '+(S.row+1); document.getElementById('nCol').textContent='خيار '+(S.col+1)
  document.getElementById('note').innerHTML = NOTES[S.row] + NOTE_COL[S.col]
}
function paint(animate){
  const h=document.getElementById('hChart'); if(h){const vals=slice(TOTAL,S.days);h.innerHTML=spark(vals,trendCol(vals),{w:h.clientWidth,h:h.clientHeight,scrub:S.scrub,fade:true});draw(h,animate)}
  document.querySelectorAll('[data-mini]').forEach(el=>{const a=ACCOUNTS.find(x=>x.id===el.dataset.mini),v=slice(a.data,30);el.innerHTML=spark(v,S.col===0?trendCol(v):TYPE_COLOR[a.type],{w:el.clientWidth,h:el.clientHeight,pad:3,dots:false});draw(el,animate)})
  document.querySelectorAll('[data-bg]').forEach(el=>{const a=ACCOUNTS.find(x=>x.id===el.dataset.bg),v=slice(a.data,30);el.innerHTML=spark(v,S.col===0?trendCol(v):TYPE_COLOR[a.type],{w:el.clientWidth,h:el.clientHeight,pad:8,dots:false,fade:true});draw(el,animate)})
  const d=document.getElementById('dChart'); if(d){const a=ACCOUNTS.find(x=>x.id===S.open),v=slice(a.data,S.dDays);d.innerHTML=spark(v,S.col===0?trendCol(v):TYPE_COLOR[a.type],{w:d.clientWidth,h:d.clientHeight,scrub:S.dScrub});draw(d,animate)}
}
function rerenderHero(){ const old=document.getElementById('hero'); const t=document.createElement('div'); t.innerHTML=hero(); const nh=t.firstElementChild; nh.classList.remove('rise'); old.replaceWith(nh); const h=document.getElementById('hChart'); const vals=slice(TOTAL,S.days); h.innerHTML=spark(vals,trendCol(vals),{w:h.clientWidth,h:h.clientHeight,scrub:S.scrub,fade:true}); draw(h,false); bindScrub(nh,h,()=>vals.length,i=>{S.scrub=i;rerenderHero()}) }
function rerenderDetail(){ const old=document.getElementById('detail'); const a=ACCOUNTS.find(x=>x.id===S.open); const t=document.createElement('div'); t.innerHTML=detail(a); const nd=t.firstElementChild; nd.classList.remove('rise'); old.replaceWith(nd); const d=document.getElementById('dChart'); const v=slice(a.data,S.dDays); d.innerHTML=spark(v,S.col===0?trendCol(v):TYPE_COLOR[a.type],{w:d.clientWidth,h:d.clientHeight,scrub:S.dScrub}); draw(d,false); bindScrub(d,d,()=>S.dDays,i=>{S.dScrub=i;rerenderDetail()}) }
/* السحب الأفقي يختار يومًا (يبدأ بعد 6px أفقيًا، والماوس بالمرور) */
function bindScrub(card, axis, count, onPick){
  let start=null, active=false, last=null
  const pick=e=>{const r=axis.getBoundingClientRect(), n=count(), i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1)))); if(i!==last){last=i;onPick(i)}}
  card.onpointerdown=e=>{start=e.clientX;active=false}
  card.onpointermove=e=>{ if(e.pointerType==='mouse'&&start===null) return pick(e); if(start===null) return; if(!active){if(Math.abs(e.clientX-start)<6)return;active=true;card.setPointerCapture(e.pointerId)} pick(e) }
  card.onpointerup=card.onpointercancel=card.onpointerleave=()=>{start=null;active=false;last=null; onPick(null)}
}

const NOTES = [
  '<span class="k">الصفوف — خيار 1</span>سبارك صغير لآخر 30 يومًا بين الاسم والرصيد (مثل قائمة الأسهم)، وتحت الرصيد التغيّر خلال 30 يومًا بدل «من الإجمالي». ',
  '<span class="k">الصفوف — خيار 2</span>سبارك خافت يملأ خلفية الصف ويتلاشى من اليسار، فيبقى الصف نظيفًا والرصيد مقروءًا. ',
  '<span class="k">الصفوف — خيار 3</span>الصفوف كما هي اليوم، والسبارك فقط في بطاقة الإجمالي وفي تفاصيل الحساب. ',
]
const NOTE_COL = [
  '<br><span class="k" style="margin-top:6px">اللون — خيار 1</span>الخط أخضر لو الرصيد طالع خلال الفترة وأحمر لو نازل، مثل منحنى الرصيد في الرئيسية.',
  '<br><span class="k" style="margin-top:6px">اللون — خيار 2</span>الخط بلون نوع الحساب (بنكي بنفسجي، ادخار أصفر...) والتغيّر يبقى بالأخضر/الأحمر في الرقم.',
]

document.getElementById('segRow').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.row=+b.dataset.v;render()}
document.getElementById('segCol').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.col=+b.dataset.v;render()}
document.getElementById('tgHide').onclick=()=>{S.hide=!S.hide;render(false)}
root.addEventListener('click',e=>{
  const p=e.target.closest('[data-days]'); if(p){S.days=+p.dataset.days;S.scrub=null;render();return}
  const q=e.target.closest('[data-ddays]'); if(q){S.dDays=+q.dataset.ddays;S.dScrub=null;render();return}
  const a=e.target.closest('[data-acc]'); if(a){S.open=S.open===a.dataset.acc?null:a.dataset.acc;S.dScrub=null;S.dDays=30;render()}
})
document.querySelector('.phone .top').innerHTML = `<span class="gb">${svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',18)}</span><span class="gb w">${svg('<path d="M12 5v14M5 12h14"/>',18,2.4)}</span>`
render()
</script>
