<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حماية المزامنة</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13); --accent-line:rgba(255,255,255,.28);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --sub:#ffbf47; --transfer:#8b7bff; --owed:#2ee6c8;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --spring:cubic-bezier(.34,1.56,.64,1); --expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:18px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  input{font:inherit;color:inherit}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .press{transition:transform .2s var(--spring)}.press:active{transform:scale(.97)}

  .intro{width:100%;max-width:420px}
  .intro h1{font-size:22px;font-weight:700}
  .intro p{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.8}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px}
  .plbl{font-size:11.5px;color:var(--text-3);font-weight:500}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong)}
  .seg button{flex:1;height:34px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);text-align:center;transition:background .3s var(--spring),color .2s}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .optdesc{font-size:12px;color:var(--text-2);line-height:1.8}
  .optdesc b{color:var(--text)}

  .phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:40px;border:1px solid #1d1d22;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.9);isolation:isolate}
  @media (max-width:440px){.phone{border-radius:28px;height:88vh;min-height:700px}}
  .aurora{position:absolute;inset:-10% -10% auto;height:300px;pointer-events:none;z-index:0;background:radial-gradient(60% 70% at 70% 10%,rgba(255,255,255,.09),transparent 70%)}
  .scr{position:absolute;inset:0;z-index:1;overflow-y:auto;scrollbar-width:none;padding:22px 20px 110px;animation:rise .35s var(--expo) both}
  .scr::-webkit-scrollbar{display:none}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .glass{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(28,28,33,.9);border:1px solid var(--border-strong)}
  .hdr b{font-size:17px;font-weight:600;flex:1}
  .hdr .cnt{font:600 12px var(--font-num);color:var(--text-3)}
  .bar{display:flex;gap:4px;margin:-6px 0 20px}
  .bar i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.12);transition:background .4s}
  .bar i.on{background:var(--accent)}

  .card{border-radius:22px;background:var(--surface);border:1px solid var(--border);padding:16px}
  .status{display:flex;align-items:center;gap:12px}
  .cloud{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
  .status b{font-size:15px;font-weight:600}
  .status small{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
  .ghost{height:58px;border-radius:18px;background:var(--surface);border:1px solid var(--border);margin-top:10px}

  .upg{margin-top:12px;border-radius:22px;padding:15px;background:color-mix(in srgb,var(--owed) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--owed) 30%,transparent)}
  .upg .row{display:flex;gap:12px;align-items:flex-start}
  .upg .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--owed) 16%,transparent);color:var(--owed)}
  .upg b{display:block;font-size:13.5px;font-weight:600}
  .upg p{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.75}
  .upg .go{margin-top:12px;width:100%;height:44px;border-radius:15px;background:var(--accent);color:var(--on-accent);font-size:13.5px;font-weight:700;text-align:center}
  .compare{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cmp{border-radius:16px;padding:10px;background:var(--void);border:1px solid var(--border);font-size:11.5px;line-height:1.7;color:var(--text-2)}
  .cmp .t{font-size:11px;font-weight:700;margin-bottom:4px}
  .cmp .k{display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}

  .kick{font-size:12px;color:var(--text-3);font-weight:600}
  .title{font-size:22px;font-weight:700;margin-top:6px}
  .lead{font-size:13px;color:var(--text-2);line-height:1.85;margin-top:6px}
  .lead em{font-style:normal;color:var(--text);font-weight:600}
  .tok{direction:ltr;text-align:left;margin-top:16px;border-radius:18px;border:1px solid var(--border-strong);background:var(--void);padding:16px;font:500 15px/1.6 var(--mono);letter-spacing:.04em;word-break:break-all}
  .btns{display:flex;gap:8px;margin-top:10px}
  .bp{flex:1;height:46px;border-radius:15px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
  .bg{height:46px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--border-strong);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
  .note{margin-top:12px;border-radius:16px;padding:11px 12px;display:flex;gap:10px;font-size:12px;line-height:1.75;color:var(--text-2)}
  .note.warn{background:color-mix(in srgb,var(--sub) 9%,transparent);border:1px solid color-mix(in srgb,var(--sub) 28%,transparent)}
  .note.warn .ni{color:var(--sub)}
  .note.ok{background:color-mix(in srgb,var(--income) 8%,transparent);border:1px solid color-mix(in srgb,var(--income) 26%,transparent)}
  .note.ok .ni{color:var(--income)}
  .note b{color:var(--text);font-weight:600}
  .chk{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-size:13px}
  .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none}
  .chk.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .code{margin-top:16px;border-radius:18px;border:1px solid var(--border-strong);background:var(--void);overflow:hidden}
  .code .top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 12px;border-bottom:1px solid var(--border)}
  .code .top span{direction:ltr;font:500 11px var(--mono);color:var(--text-2)}
  .code .top button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);font-size:12px;font-weight:600}
  .code pre{direction:ltr;text-align:left;padding:12px;font:500 11px/1.75 var(--mono);color:var(--text-3);white-space:pre-wrap;word-break:break-all}
  .code pre .hl{display:block;margin:2px -12px;padding:2px 12px;background:color-mix(in srgb,var(--owed) 12%,transparent);color:var(--text)}
  .code pre .hl i{font-style:normal;color:var(--owed)}

  .ol{margin-top:14px;counter-reset:n;display:flex;flex-direction:column;gap:8px}
  .ol div{counter-increment:n;display:flex;gap:10px;font-size:12.5px;line-height:1.8;color:var(--text-2)}
  .ol div::before{content:counter(n);flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font:600 11px var(--font-num);color:var(--text);margin-top:2px}
  .kbd{display:inline-block;padding:0 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-size:11.5px;color:var(--text)}
  .ui{display:inline-flex;align-items:center;padding:0 7px;border-radius:7px;background:#1a73e8;color:#fff;font-size:11.5px;font-weight:600}

  .lines{margin-top:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
  .line{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:13px}
  .line + .line{border-top:1px solid var(--border)}
  .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--border-strong);color:var(--text-3)}
  .st.run{border-color:transparent;border-top-color:var(--accent);animation:spin .8s linear infinite}
  .st.ok{background:var(--income);border-color:var(--income);color:var(--on-accent)}
  .line.idle{color:var(--text-3)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .done-ic{width:84px;height:84px;border-radius:50%;margin:40px auto 0;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);animation:pop .5s var(--spring) both}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

  .foot{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px 20px 22px;background:linear-gradient(transparent,var(--bg) 30%)}
  .foot .bp{width:100%;height:52px;border-radius:17px}
  .foot .bp[disabled]{opacity:.35;pointer-events:none}

  .island{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 16px;border-radius:999px;background:rgba(28,28,33,.92);border:1px solid var(--border-strong);box-shadow:0 12px 30px -12px rgba(0,0,0,.8);font-size:12.5px;font-weight:600;white-space:nowrap}
  .field{margin-top:12px}
  .field label{font-size:12px;color:var(--text-3);font-weight:600}
  .field input{direction:ltr;width:100%;margin-top:6px;height:48px;border-radius:15px;border:1px solid var(--border-strong);background:var(--void);padding:0 14px;font:500 14px var(--mono);outline:none}
  .field input:focus{border-color:var(--accent-line)}
  .err{font-size:12px;color:var(--expense);margin-top:8px}
</style>
</head>
<body>
  <div class="intro">
    <h1>حماية المزامنة: فصل مفتاح الدخول عن مفتاح التشفير</h1>
    <p>الحين نفس الرمز يفتح السكربت ويفك تشفير بياناتك، وهو مكتوب داخل كود Apps Script في حسابك. بعد التحديث يعرف السكربت «مفتاح دخول» مشتق من رمزك فقط، ومفتاح التشفير يبقى على أجهزتك. جرّب المسار من «حدّث الحماية».</p>
  </div>

  <div class="panel">
    <div class="plbl">مكان العرض</div>
    <div class="seg" data-seg="entry"><button data-v="1">1. بطاقة في المزامنة فقط</button><button data-v="2">2. + تنبيه مرة وحدة بالرئيسية</button></div>
    <div class="optdesc" data-desc></div>
    <div class="plbl">الشاشة</div>
    <div class="seg" data-seg="view"><button data-v="wizard">هذا الجهاز (التحديث)</button><button data-v="other">جهاز ثاني (بعد التحديث)</button></div>
  </div>

  <div class="phone" data-phone></div>

<script>
const svg = (p,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`
const I = {
  back:'<path d="m9 6 6 6-6 6"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1 0 9.5z"/>',
  shield:'<path d="M12 3 5 6v6c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9V6z"/><path d="m9 12 2 2 4-4"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
}
const DESC = {
  1:'<b>اختياري وهادئ:</b> بطاقة «حدّث حماية المزامنة» تظهر في شاشة المزامنة فقط لين يسويها المستخدم. المزامنة الحالية تبقى تشتغل كما هي.',
  2:'<b>نفس البطاقة</b> + تنبيه في الجزيرة <b>مرة وحدة</b> بعد التحديث للإصدار الجديد («فيه تحديث لحماية المزامنة») يفتح شاشة المزامنة.',
}
const TOKEN = 'Kp7mWx2QnR9vTz4HbJ8sLd3FgY6cAe5N'
const AUTH = '9f3a1c7e…b04d'
const S = { entry:'1', view:'wizard', step:'settings', saved:false, copiedTok:false, copiedCode:false, lines:0, other:'card', input:'' }
const phone = document.querySelector('[data-phone]')
const LAST = 5
const group = t => t.replace(/(.{8})(?=.)/g,'$1 ')

function header(title, step){
  return `<div class="hdr"><button class="glass press" data-nav="${step<=1?'settings':step-1}">${svg(I.back)}</button><b>${title}</b><span class="cnt num">${step}/4</span></div>
  <div class="bar">${[1,2,3,4].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`
}
function settings(){
  return `<div class="aurora"></div><div class="scr" ${S.entry==='2'?'style="padding-top:70px"':''}>
    <div class="hdr"><span class="glass">${svg(I.back)}</span><b>المزامنة والنسخ الاحتياطي</b></div>
    <div class="card status"><span class="cloud">${svg(I.cloud,24)}</span><div><b>مربوط بـ Google Sheets</b><small>آخر مزامنة قبل 3 دقائق</small></div></div>
    <div class="upg">
      <div class="row"><span class="ic">${svg(I.shield,20)}</span><div><b>حدّث حماية المزامنة</b>
      <p>رمزك الحالي مكتوب داخل كود Apps Script، فأي أحد يوصل لحساب Google حقك يقدر يفك تشفير بياناتك. التحديث يخلي السكربت يعرف «مفتاح دخول» فقط، ومفتاح التشفير ما يطلع من أجهزتك.</p></div></div>
      <div class="compare">
        <div class="cmp"><div class="t" style="color:var(--sub)">الحين</div><div class="k"><span class="dot" style="background:var(--sub)"></span>السكربت يقدر يفك بياناتك</div><div class="k"><span class="dot" style="background:var(--sub)"></span>الرمز يمر في الرابط</div></div>
        <div class="cmp"><div class="t" style="color:var(--income)">بعد التحديث</div><div class="k"><span class="dot" style="background:var(--income)"></span>السكربت ما يقدر يفكها</div><div class="k"><span class="dot" style="background:var(--income)"></span>الرمز ما يمر بأي رابط</div></div>
      </div>
      <button class="go press" data-nav="1">حدّث الحماية (حوالي 3 دقائق)</button>
    </div>
    <div class="ghost"></div><div class="ghost"></div>
  </div>
  ${S.entry==='2'?`<div class="island"><span class="dot" style="background:var(--owed)"></span>فيه تحديث لحماية المزامنة</div>`:''}`
}
function step1(){
  return `<div class="scr">${header('تحديث الحماية',1)}
    <div class="kick">الخطوة <span class="num">1</span> · رمز جديد</div>
    <div class="title">رمزك الجديد</div>
    <div class="lead">نسوي رمز جديد بدل القديم، لأن القديم انكتب في كود السكربت ويبقى في سجل نسخه. <em>احفظه</em>، تحتاجه لو ربطت جهاز ثاني أو رجعت بياناتك.</div>
    <div class="tok">${group(TOKEN)}</div>
    <div class="btns"><button class="bp press" data-copytok style="${S.copiedTok?'background:var(--income)':''}">${svg(S.copiedTok?I.check:I.copy,16)}${S.copiedTok?'انتسخ':'انسخ الرمز'}</button><button class="bg press" aria-label="رمز جديد">${svg(I.refresh,16)}</button></div>
    <div class="note warn"><span class="ni">${svg(I.warn,18)}</span><div><b>الرمز القديم يتقاعد.</b> بعد التحديث ما يفتح السكربت ولا يفك بياناتك الجديدة. أجهزتك الثانية بتطلب منك الرمز الجديد.</div></div>
    <button class="chk press ${S.saved?'on':''}" data-saved><span class="box">${S.saved?svg(I.check,14,2.4):''}</span>حفظت الرمز الجديد بمكان آمن</button>
  </div>${foot('التالي',!S.saved,2)}`
}
function step2(){
  return `<div class="scr">${header('تحديث الحماية',2)}
    <div class="kick">الخطوة <span class="num">2</span> · الكود</div>
    <div class="title">بدّل كود السكربت</div>
    <div class="lead">افتح نفس مشروع Apps Script اللي سويته أول مرة. امسح الكود كله والصق هذا مكانه. السطر الملوّن فيه <em>مفتاح دخول</em> مشتق من رمزك، مو الرمز نفسه.</div>
    <div class="code"><div class="top"><span>Code.gs</span><button class="press" data-copycode style="${S.copiedCode?'background:var(--income);color:var(--on-accent);border-color:var(--income)':''}">${S.copiedCode?'انتسخ الكود':'انسخ الكود كاملًا'}</button></div>
    <pre>// QB-Nomia encrypted sync server (v2)
// AUTH_KEY only opens this script: it cannot decrypt your data.
<span class="hl">var AUTH_KEY = '<i>${AUTH}</i>'</span>
var SHEET_NAME = 'sync_data'
…</pre></div>
    <div class="note ok"><span class="ni">${svg(I.lock,18)}</span><div>حتى لو أحد شاف هذا الكود، <b>ما يقدر يفك بياناتك</b>. مفتاح التشفير ينحسب من رمزك على جهازك فقط.</div></div>
    <div class="ol"><div><span>في المحرر <span class="kbd">Ctrl + A</span> ثم <span class="kbd">Delete</span>.</span></div><div><span>الصق بـ <span class="kbd">Ctrl + V</span> واحفظ بـ <span class="kbd">Ctrl + S</span>.</span></div></div>
  </div>${foot('التالي',!S.copiedCode,3)}`
}
function step3(){
  return `<div class="scr">${header('تحديث الحماية',3)}
    <div class="kick">الخطوة <span class="num">3</span> · النشر</div>
    <div class="title">انشر نسخة جديدة</div>
    <div class="lead">نحدّث النشر الموجود بدل ما نسوي واحد جديد، فيبقى <em>نفس الرابط</em> وما تحتاج تغيّره بأي جهاز.</div>
    <div class="ol">
      <div><span>فوق يمين اضغط <span class="ui">Deploy</span> ثم <b>Manage deployments</b>.</span></div>
      <div><span>اختر النشر الموجود واضغط أيقونة القلم (تعديل).</span></div>
      <div><span>في <b>Version</b> اختر <b>New version</b>.</span></div>
      <div><span>اضغط <span class="ui">Deploy</span>. الرابط المنتهي بـ <span class="kbd" dir="ltr">/exec</span> ما يتغيّر.</span></div>
    </div>
    <div class="note warn"><span class="ni">${svg(I.warn,18)}</span><div>من هذي اللحظة، أي جهاز ما تحدّث يوقف عن المزامنة لين تدخل فيه الرمز الجديد.</div></div>
  </div>${foot('نشرت النسخة الجديدة',false,4)}`
}
const LINES = ['الوصول للسكربت','قبول مفتاح الدخول الجديد','إعادة تشفير بياناتك بالمفتاح الجديد','رفعها لـ Google Sheets']
function step4(){
  const st = i => i < S.lines ? 'ok' : i === S.lines && S.lines < 4 ? 'run' : 'idle'
  return `<div class="scr">${header('تحديث الحماية',4)}
    <div class="kick">الخطوة <span class="num">4</span> · الاختبار</div>
    <div class="title">نتأكد ونشفّر من جديد</div>
    <div class="lead">نتأكد إن السكربت الجديد يقبل مفتاح الدخول، وبعدها نعيد تشفير بياناتك بالمفتاح الجديد ونرفعها.</div>
    <div class="lines">${LINES.map((l,i)=>`<div class="line ${st(i)==='idle'?'idle':''}"><span class="st ${st(i)}">${st(i)==='ok'?svg(I.check,13,2.6):''}</span>${l}</div>`).join('')}</div>
  </div>${foot(S.lines>=4?'تم':'جارٍ…',S.lines<4,5)}`
}
function done(){
  return `<div class="aurora"></div><div class="scr" style="text-align:center">
    <div class="done-ic">${svg(I.shield,38,2)}</div>
    <div class="title" style="margin-top:20px">بياناتك صارت أأمن</div>
    <div class="lead">السكربت يعرف مفتاح دخول فقط، ومفتاح التشفير على أجهزتك. ما يقدر أحد يفك بياناتك من حساب Google.</div>
    <div class="note warn" style="text-align:right"><span class="ni">${svg(I.warn,18)}</span><div><b>أجهزتك الثانية:</b> بتطلب الرمز الجديد أول ما تحاول تزامن. دخّله فيها مرة وحدة.</div></div>
    <div class="note warn" style="text-align:right"><span class="ni">${svg(I.warn,18)}</span><div><b>سجل نسخ الجدول</b> في Google Sheets يحتفظ بالنسخ القديمة المشفّرة بالرمز القديم. خلّ الرمز القديم سري، أو احذف الجدول القديم لو تبي تمسحها نهائيًا.</div></div>
  </div>${foot('رجوع للمزامنة',false,'settings')}`
}
function foot(label, disabled, next){ return `<div class="foot"><button class="bp press" ${disabled?'disabled':''} data-nav="${next}">${label}</button></div>` }

function other(){
  if(S.other==='ok') return `<div class="aurora"></div><div class="scr" style="padding-top:70px"><div class="hdr"><span class="glass">${svg(I.back)}</span><b>المزامنة والنسخ الاحتياطي</b></div>
    <div class="card status"><span class="cloud">${svg(I.cloud,24)}</span><div><b>مربوط بـ Google Sheets</b><small>محمي بمفتاح منفصل · آخر مزامنة الآن</small></div></div><div class="ghost"></div><div class="ghost"></div></div>
    <div class="island"><span class="dot" style="background:var(--income)"></span>رجعت المزامنة بالرمز الجديد</div>`
  return `<div class="aurora"></div><div class="scr" style="padding-top:70px"><div class="hdr"><span class="glass">${svg(I.back)}</span><b>المزامنة والنسخ الاحتياطي</b></div>
    <div class="upg" style="background:color-mix(in srgb,var(--sub) 9%,var(--surface));border-color:color-mix(in srgb,var(--sub) 32%,transparent)">
      <div class="row"><span class="ic" style="background:color-mix(in srgb,var(--sub) 16%,transparent);color:var(--sub)">${svg(I.key,20)}</span><div><b>رمز المزامنة تغيّر</b>
      <p>حدّثت حماية المزامنة من جهاز ثاني. دخّل الرمز الجديد هنا مرة وحدة، وبعدها نجيب آخر نسخة من Google Sheets.</p></div></div>
      <div class="field"><label>الرمز الجديد</label><input data-in value="${S.input}" placeholder="Kp7mWx2Q nR9vTz4H …"></div>
      ${S.other==='err'?'<div class="err">الرمز ما يطابق. تأكد إنه الرمز الجديد من الجهاز اللي حدّثته.</div>':''}
      <button class="go press" data-verify>تحقق وكمّل</button>
    </div>
    <div class="note warn"><span class="ni">${svg(I.warn,18)}</span><div>تعديلاتك على هذا الجهاز من بعد التحديث محفوظة عليه. لو فيه تعارض مع نسخة Sheets، بنسألك وش تعتمد.</div></div>
    <div class="ghost"></div></div>
    <div class="island"><span class="dot" style="background:var(--sub)"></span>المزامنة متوقفة · الرمز تغيّر</div>`
}

function render(){
  let h=''
  if(S.view==='other') h=other()
  else h = S.step==='settings'?settings():S.step===1?step1():S.step===2?step2():S.step===3?step3():S.step===4?step4():done()
  phone.innerHTML=h
  document.querySelectorAll('[data-seg]').forEach(seg=>{const k=seg.dataset.seg;seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S[k]))})
  document.querySelector('[data-desc]').innerHTML=DESC[S.entry]
  const inp=phone.querySelector('[data-in]'); if(inp) inp.addEventListener('input',e=>S.input=e.target.value)
  if(S.step===4 && S.lines<4 && S.view==='wizard') setTimeout(()=>{S.lines++;render()},700)
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return
  if(t.closest('[data-seg]')){const k=t.closest('[data-seg]').dataset.seg;S[k]=t.dataset.v;S.step='settings';S.other='card';S.lines=0;render();return}
  if(t.dataset.nav!==undefined){const v=t.dataset.nav;S.step=v==='settings'?'settings':Number(v);if(S.step===4)S.lines=0;render();return}
  if(t.matches('[data-copytok]')){S.copiedTok=true;render();return}
  if(t.matches('[data-copycode]')){S.copiedCode=true;render();return}
  if(t.matches('[data-saved]')){S.saved=!S.saved;render();return}
  if(t.matches('[data-verify]')){S.other=S.input.replace(/\s/g,'')===TOKEN?'ok':'err';render();return}
})
render()
</script>
</body>
</html>
