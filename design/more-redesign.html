<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة المزيد — ثلاثة اقتراحات</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c; --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff; --sub:#ffbf47; --commit:#5fb3ff; --owed:#2ee6c8; --orange:#ff9a4d;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0 40px}
  button,input{font:inherit;color:inherit;background:none;border:0}
  button{cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .press{transition:transform .15s var(--ease)}.press:active{transform:scale(.97)}
  .ctl{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:12px;padding:0 12px;max-width:560px}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .pill{padding:7px 13px;border-radius:99px;background:#16161a;border:1px solid #26262c;font-size:12px;font-weight:600;color:var(--text-2)}
  .pill.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .pill b{font-family:var(--font-num);margin-inline-end:4px}
  .desc{background:#111114;border:1px solid #222228;border-radius:16px;padding:10px 14px;font-size:12px;color:var(--text-2);line-height:1.75;max-width:440px;text-align:center}
  .desc b{color:var(--text)}

  .phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:0;border:0;height:calc(100vh - 170px)}}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 16px 110px}
  .scroll::-webkit-scrollbar{display:none}
  .aurora{position:absolute;top:-120px;left:-60px;right:-60px;height:340px;background:radial-gradient(50% 60% at 70% 40%,rgba(139,123,255,.14),transparent 70%);pointer-events:none}
  .hrow{position:absolute;top:0;left:0;right:0;height:92px;padding:44px 16px 0;display:flex;align-items:center;gap:8px;z-index:20}
  .sp{flex:1}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(24,24,28,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px)}
  .large{padding:100px 4px 14px}
  .large h1{font-size:30px;font-weight:700}
  .large p{font-size:12.5px;color:var(--text-3);margin-top:2px}
  .search{display:flex;align-items:center;gap:8px;height:46px;border-radius:99px;background:var(--surface);border:1px solid var(--border);padding:0 16px;color:var(--text-3);margin-bottom:18px}
  .search input{flex:1;outline:none;font-size:13px;color:var(--text)}
  .search input::placeholder{color:var(--text-3)}
  .sec{font-size:12px;font-weight:600;color:var(--text-3);margin:20px 8px 9px;display:flex;justify-content:space-between}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:22px}
  .ic{display:grid;place-items:center;flex-shrink:0}

  /* ===== أ: بطاقة الحالة + قوائم ===== */
  .status{position:relative;border-radius:26px;border:1px solid rgba(255,255,255,.09);padding:16px;overflow:hidden;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .st-top{display:flex;align-items:center;gap:12px}
  .logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(150deg,#fff,#f4f4f6 55%,#a9a9b3);box-shadow:0 10px 26px -12px rgba(255,255,255,.4);flex-shrink:0}
  .st-top b{font-size:16px;display:block}
  .st-top small{font-size:11.5px;color:var(--text-3)}
  .chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
  .chip{background:rgba(255,255,255,.04);border-radius:16px;padding:10px 8px;text-align:center}
  .chip .i{width:26px;height:26px;border-radius:9px;margin:0 auto 6px}
  .chip b{font-size:11.5px;display:block}
  .chip small{font-size:10px;color:var(--text-3)}
  .upd{margin-top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(62,224,143,.1);border:1px solid rgba(62,224,143,.25);font-size:12px;font-weight:600}
  .upd button{margin-inline-start:auto;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--income);color:#04140b}
  .list{overflow:hidden}
  .li{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:right}
  .li + .li{border-top:1px solid var(--border)}
  .li .ic{width:34px;height:34px;border-radius:11px}
  .li .m{flex:1;min-width:0}
  .li .n{font-size:13.5px;font-weight:600}
  .li .d{font-size:11px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .v{font-size:11.5px;font-weight:700;color:var(--text-2);flex-shrink:0;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.05)}
  .chev{color:var(--text-3);flex-shrink:0}

  /* ===== ب: Bento ===== */
  .bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bt{position:relative;border-radius:22px;background:var(--surface);border:1px solid var(--border);padding:14px;text-align:right;overflow:hidden;min-height:116px;display:flex;flex-direction:column}
  .bt.wide{grid-column:span 2;min-height:96px;flex-direction:row;align-items:center;gap:14px}
  .bt .glow{position:absolute;left:-30px;bottom:-40px;width:110px;height:110px;border-radius:50%;filter:blur(30px);opacity:.18}
  .bt .ic{width:38px;height:38px;border-radius:13px}
  .bt .n{font-size:13.5px;font-weight:700;margin-top:10px}
  .bt.wide .n{margin-top:0}
  .bt .k{font-size:11px;color:var(--text-3);margin-top:auto;padding-top:6px}
  .bt .v{font-size:17px;font-weight:700}
  .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:7px}
  .bar span{display:block;height:100%;border-radius:99px}
  .small4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sm{border-radius:18px;background:var(--surface);border:1px solid var(--border);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--text-2);position:relative}
  .sm .ic{width:34px;height:34px;border-radius:12px}
  .badge{position:absolute;top:6px;left:8px;width:9px;height:9px;border-radius:50%;background:var(--income);border:2px solid var(--surface)}

  /* ===== ج: أيقونات محسّنة ===== */
  .fav{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
  .fav::-webkit-scrollbar{display:none}
  .fv{flex-shrink:0;width:118px;border-radius:20px;padding:12px;text-align:right;position:relative;overflow:hidden;border:1px solid}
  .fv .ic{width:34px;height:34px;border-radius:12px;margin-bottom:10px}
  .fv b{font-size:12.5px;display:block}
  .fv small{font-size:10.5px;color:var(--text-3)}
  .fv.add{border-style:dashed;border-color:var(--border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-2);font-size:11.5px;font-weight:600}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
  .ap{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--text-2);position:relative;text-align:center}
  .ap .ic{width:58px;height:58px;border-radius:20px;border:1px solid}
  .ap .pin{position:absolute;top:-4px;left:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:2px solid var(--bg)}
  .secline{display:flex;align-items:center;gap:8px;margin:22px 4px 12px;font-size:12.5px;font-weight:700}
  .secline i{width:8px;height:8px;border-radius:3px}
  .secline span{flex:1;height:1px;background:var(--border)}
  .foot{display:flex;gap:8px;margin-top:22px}
  .foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--border)}
  .nav{position:absolute;bottom:14px;left:14px;right:14px;height:64px;border-radius:26px;background:rgba(22,22,26,.9);backdrop-filter:blur(18px);border:1px solid var(--border-strong);display:flex;justify-content:space-around;align-items:center;z-index:25;font-size:10px;color:var(--text-3)}
  .nav .on{color:var(--text);font-weight:600}
  .view{animation:fade .35s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ctl">
  <div class="row" id="modes"></div>
  <div class="desc" id="desc"></div>
</div>
<div class="phone">
  <div class="aurora"></div>
  <div class="scroll" id="scroll"></div>
  <div class="hrow"><span class="sp"></span><button class="gb" aria-label="قفل التطبيق"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></div>
  <nav class="nav"><span>الرئيسية</span><span>الحسابات</span><span>السلف</span><span class="on">المزيد</span></nav>
</div>

<script>
const S=(p,s=17,w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',tag:'<path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="7.5" r="1.3"/>',income:'<path d="M12 19V5M6 11l6-6 6 6"/>',goal:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/>',
  sub:'<polygon points="8,6 18,12 8,18"/>',commit:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',rec:'<path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/>',car:'<path d="M3 13.5 5 8a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5.5"/><path d="M2.5 13.5h19v4h-19z"/>',
  chart:'<path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/>',compare:'<path d="M7 4v16M17 4v16M3 8h8M13 16h8"/>',export:'<path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.8A4 4 0 0 0 6.5 19"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',update:'<path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',finger:'<path d="M12 11v4M8.5 7.5a5 5 0 0 1 8.5 3.5v2M7 12v1a5 5 0 0 0 1 3M12 3a8 8 0 0 1 8 8M4 11a8 8 0 0 1 3-6.2"/>',check:'<path d="M5 12.5 10 17l9-10"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="m15 6-6 6 6 6"/>',
};
const C={fin:'var(--transfer)',rec:'var(--sub)',rep:'var(--income)',sys:'var(--commit)'};
const soft=(c,p=15)=>`color-mix(in srgb, ${c} ${p}%, transparent)`;
const SECTIONS=[
  {k:'fin',t:'المالية',items:[['الحركات','كل الحركات','بحث وتعديل بكل حركاتك','search','248 حركة'],['الفئات','فئات المصاريف','الفئات والميزانيات','tag','2 تجاوزت'],['الدخل','مصادر الدخل','مصادر دخلك المتعددة','income','2 مصدر'],['الأهداف','أهداف الادخار','تتبّع الأهداف والزكاة','goal','64%']]},
  {k:'rec',t:'الدوري',items:[['اشتراكات','الاشتراكات','يوتيوب، Google Play، وغيرها','sub','245 / شهر'],['التزامات','الالتزامات','هوية، عقود، رخص','commit','1 قريب'],['متكررة','الحركات المتكررة','راتب أو حركة تحتاج تأكيد','rec','1 بانتظارك'],['السيارة','صيانة السيارة','العداد، الزيت، والوقود','car','الزيت بعد 800 كم']]},
  {k:'rep',t:'التقارير والأدوات',items:[['تقارير','التقارير','الصحة المالية والاتجاهات','chart',''],['مقارنة','المقارنة الشخصية','شهري، ربع سنوي، سنوي','compare',''],['تصدير','تصدير التقرير','PDF أو Excel','export',''],['حاسبة','الآلة الحاسبة','حساب أو تقسيم فاتورة','calc','']]},
  {k:'sys',t:'النظام',items:[['الأمان','الأمان والخصوصية','الرقم السري والبصمة','shield','البصمة مفعّلة'],['مزامنة','المزامنة والنسخ الاحتياطي','نسخة احتياطية مشفّرة','cloud','قبل 4 د'],['تحديث','تحديث التطبيق','يتوفر 2.11.0','update','جديد'],['حول','حول التطبيق','الإصدار والمطوّر','info','2.10.0']]},
];
const MODES={
  A:{n:'بطاقة الحالة + قوائم',d:'بطاقة في الأعلى تلخّص <b>حالة التطبيق</b> (الأمان، آخر مزامنة، الإصدار) مع تنبيه التحديث. تحتها الأدوات <b>كقوائم مجمّعة</b> بألوان لكل قسم، وكل سطر يعرض <b>معلومة حيّة</b> (245/شهر، 1 بانتظارك...) فتعرف وضعك بدون فتح الشاشة.'},
  B:{n:'شبكة معلومات (Bento)',d:'الأدوات المهمة <b>بطاقات كبيرة بمعلوماتها</b> (الاشتراكات الشهرية، تقدّم الأهداف، ما ينتظرك)، والأدوات الأقل استخدامًا <b>أيقونات صغيرة</b>. مثل لوحة تحكّم.'},
  C:{n:'أيقونات محسّنة + مفضّلة',d:'نفس فكرة الشبكة الحالية لكن <b>بألوان لكل قسم</b>، وصف <b>«المفضّلة»</b> في الأعلى تثبّت فيه ما تريد (بدل «الأكثر استخدامًا» التلقائي)، مع أزرار القفل والمزامنة في الأسفل.'},
};
let mode='A';
const head=`<div class="large"><h1>المزيد</h1><p class="num">الإصدار 2.10.0 · آخر مزامنة قبل 4 دقائق</p></div>
  <label class="search">${S(P.search,16,2)}<input placeholder="ابحث عن أداة أو إعداد..."></label>`;
function viewA(){
  return `<div class="large"><h1>المزيد</h1></div>
  <div class="status">
    <div class="st-top"><div class="logo">${S('<path d="M4 17 L10 9 L14 13 L20 5"/><path d="M15 5 H20 V10"/>',24,2.6).replace('currentColor','#0a0a0c')}</div><div><b>QB·Nomia</b><small class="num">الإصدار 2.10.0</small></div></div>
    <div class="chips">
      <div class="chip"><div class="i ic" style="background:${soft('var(--income)')};color:var(--income)">${S(P.finger,14,2)}</div><b>محمي</b><small>رمز + بصمة</small></div>
      <div class="chip"><div class="i ic" style="background:${soft('var(--commit)')};color:var(--commit)">${S(P.cloud,14,2)}</div><b>متزامن</b><small>قبل 4 دقائق</small></div>
      <div class="chip"><div class="i ic" style="background:${soft('var(--sub)')};color:var(--sub)">${S(P.export,14,2)}</div><b>آخر تصدير</b><small>قبل 3 أيام</small></div>
    </div>
    <div class="upd"><span class="ic" style="width:26px;height:26px;border-radius:9px;background:${soft('var(--income)',20)};color:var(--income)">${S(P.update,14,2.2)}</span>يتوفر الإصدار <span class="num">2.11.0</span><button>تحديث</button></div>
  </div>
  <label class="search" style="margin:16px 0 0">${S(P.search,16,2)}<input placeholder="ابحث عن أداة أو إعداد..."></label>
  ${SECTIONS.map(s=>`<div class="sec"><span>${s.t}</span></div><div class="card list">${s.items.filter(i=>i[0]!=='تحديث').map(([l,f,d,ic,v])=>`<button class="li press"><span class="ic" style="background:${soft(C[s.k])};color:${C[s.k]}">${S(P[ic])}</span><span class="m"><div class="n">${f}</div><div class="d">${d}</div></span>${v?`<span class="v num">${v}</span>`:''}<span class="chev">${S(P.chev,14,2.4)}</span></button>`).join('')}</div>`).join('')}`;
}
function viewB(){
  const tile=(ic,c,n,k,v,extra='',wide=false)=>`<button class="bt press ${wide?'wide':''}"><span class="glow" style="background:${c}"></span><span class="ic" style="background:${soft(c)};color:${c}">${S(P[ic],19)}</span>${wide?`<span style="flex:1"><div class="n">${n}</div><div class="k" style="padding-top:2px">${k}</div></span><span class="v num">${v}</span>`:`<div class="n">${n}</div><div class="k">${k}</div><div class="v num">${v}</div>${extra}`}</button>`;
  const sm=(s,i)=>`<button class="sm press"><span class="ic" style="background:${soft(C[s])};color:${C[s]}">${S(P[i[3]])}</span>${i[0]}${i[0]==='تحديث'?'<span class="badge"></span>':''}</button>`;
  return head+`
  <div class="bento">
    ${tile('sub',C.rec,'الاشتراكات','شهريًا · 6 نشطة','245 ر.س')}
    ${tile('goal',C.fin,'أهداف الادخار','3 أهداف','64%',`<div class="bar"><span style="width:64%;background:${C.fin}"></span></div>`)}
    ${tile('rec',C.rec,'بانتظار تأكيدك','حركة متكررة: الراتب','1','',true)}
    ${tile('commit',C.rec,'الالتزامات','أقرب: رخصة القيادة','6 أيام')}
    ${tile('car',C.rec,'السيارة','تغيير الزيت بعد','800 كم')}
    ${tile('chart',C.rep,'التقارير','صافي أكتوبر','+4,280','',true)}
  </div>
  <div class="sec"><span>المالية</span></div><div class="small4">${SECTIONS[0].items.map(i=>sm('fin',i)).join('')}</div>
  <div class="sec"><span>الأدوات</span></div><div class="small4">${SECTIONS[2].items.slice(1).map(i=>sm('rep',i)).join('')}${sm('rec',SECTIONS[1].items[0])}</div>
  <div class="sec"><span>النظام</span></div><div class="small4">${SECTIONS[3].items.map(i=>sm('sys',i)).join('')}</div>`;
}
function viewC(){
  const favs=[['الحركات','search','fin','248 حركة'],['التقارير','chart','rep','أكتوبر'],['الاشتراكات','sub','rec','245 / شهر']];
  return head+`
  <div class="sec"><span>المفضّلة</span><span style="font-weight:500">اضغط مطوّلًا على أي أداة لتثبيتها</span></div>
  <div class="fav">${favs.map(([n,ic,s,sub])=>`<button class="fv press" style="background:linear-gradient(150deg,${soft(C[s],14)},${soft(C[s],3)});border-color:${soft(C[s],28)}"><span class="ic" style="background:${soft(C[s],22)};color:${C[s]}">${S(P[ic])}</span><b>${n}</b><small class="num">${sub}</small></button>`).join('')}<button class="fv add press">${S(P.plus,18,2.2)}تثبيت أداة</button></div>
  ${SECTIONS.map(s=>`<div class="secline"><i style="background:${C[s.k]}"></i>${s.t}<span></span></div><div class="grid4">${s.items.map(([l,f,d,ic],idx)=>`<button class="ap press"><span class="ic" style="background:linear-gradient(160deg,${soft(C[s.k],20)},${soft(C[s.k],6)});border-color:${soft(C[s.k],25)};color:${C[s.k]}">${S(P[ic],21)}</span>${l}${l==='تحديث'?`<span class="pin" style="background:var(--income);color:#04140b">${S(P.update,10,2.6)}</span>`:(s.k==='fin'&&idx===0)||(s.k==='rep'&&idx===0)||(s.k==='rec'&&idx===0)?`<span class="pin">${S('<path d="M12 17v5M5 9l7-7 7 7-3 3v4H8v-4z"/>',9,2.4)}</span>`:''}</button>`).join('')}</div>`).join('')}
  <div class="foot"><button class="press">${S(P.lock,15,2)}قفل التطبيق</button><button class="press">${S(P.rec,15,2)}مزامنة الآن</button></div>`;
}
const V={A:viewA,B:viewB,C:viewC};
function render(){
  document.getElementById('modes').innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="pill ${k===mode?'on':''}" data-m="${k}"><b>${({A:'أ',B:'ب',C:'ج'})[k]}</b>${m.n}</button>`).join('');
  document.getElementById('desc').innerHTML=MODES[mode].d;
  const sc=document.getElementById('scroll');sc.innerHTML=`<div class="view">${V[mode]()}</div>`;sc.scrollTop=0;
}
document.getElementById('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;render();};
render();
</script>
</body>
</html>
