<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نسيت الرقم السري</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13); --accent-line:rgba(255,255,255,.28);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --sub:#ffbf47;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.56,.64,1); --expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:18px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .press{transition:transform .2s var(--spring)}.press:active{transform:scale(.97)}

  /* لوحة الخيارات */
  .intro{width:100%;max-width:420px}
  .intro h1{font-size:22px;font-weight:700}
  .intro p{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.8}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px}
  .plbl{font-size:11.5px;color:var(--text-3);font-weight:500}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong)}
  .seg button{flex:1;height:34px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-2);text-align:center;transition:background .3s var(--spring),color .2s}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .optdesc{font-size:12px;color:var(--text-2);line-height:1.8}
  .optdesc b{color:var(--text)}
  .reset{align-self:flex-start;font-size:12px;color:var(--text-3);font-weight:600;padding:4px 2px}

  /* الجهاز */
  .phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:40px;border:1px solid #1d1d22;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.9);isolation:isolate}
  @media (max-width:440px){.phone{border-radius:28px;height:88vh;min-height:700px}}
  .aurora{position:absolute;inset:-10% -10% auto;height:340px;pointer-events:none;z-index:0;background:radial-gradient(60% 70% at 70% 10%,rgba(255,255,255,.1),transparent 70%),radial-gradient(50% 60% at 15% 0%,rgba(139,123,255,.06),transparent 70%)}

  /* شاشة القفل */
  .lock{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:64px 28px 30px}
  .logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
  .hello{font-size:20px;font-weight:600;margin-top:34px}
  .hint{height:20px;font-size:13px;color:var(--text-2);margin-top:4px;transition:color .2s}
  .hint.err{color:var(--expense)}
  .dots{display:flex;gap:14px;direction:ltr;margin-top:56px}
  .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);transition:background .2s,transform .3s var(--spring),border-color .2s}
  .dots i.f{background:var(--accent);border-color:transparent;transform:scale(1.1)}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;margin-top:auto;direction:ltr;transition:opacity .3s}
  .pad.off{opacity:.32;pointer-events:none}
  .key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-num);font-size:28px;font-weight:500;background:rgba(28,28,33,.55);border:1px solid var(--border);transition:transform .15s var(--spring)}
  .key:active{transform:scale(.92)}
  .key.ghost{background:none;border-color:transparent;color:var(--text-2)}
  .foot{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:28px;font-size:12px;padding:0 8px}
  .foot button{color:var(--text-2)}
  .foot .num{color:var(--text-3)}

  /* مهلة الانتظار */
  .wait{display:flex;align-items:center;gap:8px;margin-top:4px;height:20px;font-size:13px;color:var(--text-2)}
  .wait svg{transform:rotate(-90deg)}
  .wait .trk{stroke:rgba(255,255,255,.1)}
  .wait .arc{stroke:var(--sub);transition:stroke-dashoffset 1s linear}

  /* طبقات عامة */
  .scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .18s ease-out both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* الخيار 1: نافذة وسط الشاشة (المطبّق حاليًا) */
  .dlg-wrap{position:absolute;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;padding:0 24px}
  .dlg{width:100%;max-width:330px;border-radius:32px;border:1px solid var(--border-strong);background:var(--surface-el);padding:24px;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.9);animation:pop .34s var(--spring) both}
  .dlg h3{font-size:17px;font-weight:600;margin-bottom:8px}
  .dlg p{font-size:13px;line-height:1.75;color:var(--text-2);margin-bottom:22px}
  .row2{display:flex;gap:10px}
  .btn{flex:1;height:46px;border-radius:999px;font-size:13.5px;font-weight:600;text-align:center}
  .btn.ghost{background:rgba(255,255,255,.06)}
  .btn.danger{background:var(--expense);color:#0a0a0c;box-shadow:0 12px 26px -12px var(--expense)}
  .btn.white{background:var(--accent);color:var(--on-accent)}
  .btn[disabled]{opacity:.35;pointer-events:none}

  /* الخيار 2: ورقة سفلية */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;border-radius:32px 32px 0 0;border:1px solid var(--border-strong);border-bottom:0;background:var(--surface-el);padding:0 20px 26px;animation:sheet .42s var(--expo) both}
  .handle{width:38px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:10px auto 16px}
  .sheet h3{font-size:17px;font-weight:600}
  .sheet .sub{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.7}
  .list{margin-top:14px;border-radius:20px;background:var(--void);border:1px solid var(--border);overflow:hidden}
  .li{display:flex;align-items:center;gap:11px;padding:11px 13px;font-size:13px}
  .li + .li{border-top:1px solid var(--border)}
  .li .ic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--text-2);flex:none}
  .backup{margin-top:10px;display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:18px;font-size:12.5px;line-height:1.7}
  .backup.ok{background:color-mix(in srgb,var(--income) 10%,transparent);border:1px solid color-mix(in srgb,var(--income) 30%,transparent)}
  .backup.ok .bi{color:var(--income)}
  .backup.no{background:color-mix(in srgb,var(--sub) 10%,transparent);border:1px solid color-mix(in srgb,var(--sub) 30%,transparent)}
  .backup.no .bi{color:var(--sub)}
  .backup b{display:block;font-size:13px;font-weight:600}
  .backup span{color:var(--text-2)}
  .hold{position:relative;overflow:hidden;width:100%;height:52px;border-radius:17px;margin-top:16px;background:color-mix(in srgb,var(--expense) 14%,transparent);border:1px solid color-mix(in srgb,var(--expense) 40%,transparent);color:var(--expense);font-size:14px;font-weight:700;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none}
  .hold .fill{position:absolute;inset:0;background:var(--expense);transform-origin:right;transform:scaleX(0)}
  .hold .lbl{position:relative;z-index:1}
  .hold.going .lbl{color:var(--text)}
  .cancel{display:block;width:100%;text-align:center;margin-top:12px;font-size:13px;color:var(--text-2);font-weight:600;padding:6px}

  /* الخيار 3: صفحة كاملة */
  .page{position:absolute;inset:0;z-index:21;background:var(--bg);display:flex;flex-direction:column;padding:16px 22px 26px;animation:rise .42s var(--expo) both}
  .page .top{display:flex;justify-content:flex-start}
  .glass{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(28,28,33,.9);border:1px solid var(--border-strong)}
  .big-ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;margin:40px auto 0;background:color-mix(in srgb,var(--expense) 14%,transparent);color:var(--expense)}
  .page h2{font-size:24px;font-weight:700;text-align:center;margin-top:18px}
  .page .sub{font-size:13px;color:var(--text-2);text-align:center;margin-top:8px;line-height:1.8;padding:0 6px}
  .page .list{margin-top:22px}
  .page .bottom{margin-top:auto}
  .count{font-family:var(--font-num)}

  /* بعد المسح */
  .fresh{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;text-align:center;animation:fade .3s ease-out both}
  .fresh .ring{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);animation:pop .52s var(--spring) both}
  .fresh h2{font-size:20px;font-weight:600;margin-top:22px}
  .fresh p{font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.8}
  .fresh .col{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:30px}
  .fresh .col .btn{flex:none;height:50px;border-radius:17px}
  .note{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-3)}
</style>
</head>
<body>
  <div class="intro">
    <h1>نسيت الرقم السري</h1>
    <p>لما ينسى المستخدم رقمه، نمسح بيانات التطبيق من الجهاز حتى ما يقدر أحد يتجاوز القفل. الخيارات هنا عن طريقة التأكيد قبل المسح. اضغط «نسيت الرقم السري؟» أسفل الشاشة.</p>
  </div>

  <div class="panel">
    <div class="plbl">طريقة التأكيد</div>
    <div class="seg" data-seg="opt">
      <button data-v="1">1. نافذة</button><button data-v="2">2. ورقة + ضغط مطوّل</button><button data-v="3">3. صفحة + عدّاد</button>
    </div>
    <div class="optdesc" data-desc></div>
    <div class="plbl">النسخة الاحتياطية</div>
    <div class="seg" data-seg="backup">
      <button data-v="sheets">مربوطة بـ Sheets</button><button data-v="none">ما فيه نسخة</button>
    </div>
    <div class="plbl">حالة شاشة القفل</div>
    <div class="seg" data-seg="lock">
      <button data-v="normal">عادي</button><button data-v="wait">بعد 5 محاولات خاطئة</button>
    </div>
    <button class="reset" data-reset>إعادة العرض من البداية</button>
  </div>

  <div class="phone" data-phone></div>

<script>
const svg = (p,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`
const I = {
  logo:'<path d="M4 17 9 11l4 3 7-8"/><path d="M15 6h5v5"/>',
  del:'<path d="M21 5H9l-6 7 6 7h12z"/><path d="m16 9-5 6M11 9l5 6"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14h.01"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1 0 9.5z"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  restore:'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
}
const DESC = {
  1:'<b>المطبّق حاليًا.</b> نافذة تأكيد وسط الشاشة بزر أحمر. سريعة، لكن ضغطة واحدة بالغلط تمسح كل شي.',
  2:'<b>ورقة سفلية</b> توضّح وش راح ينمسح، وحالة نسختك الاحتياطية. المسح يحتاج <b>ضغط مطوّل ثانية ونص</b>، فما يصير بالغلط.',
  3:'<b>صفحة كاملة</b> فيها نفس الشرح، وزر المسح ما يشتغل إلا بعد <b>عدّاد 5 ثواني</b> عشان يقرأ قبل ما يقرر.',
}
const S = { opt:'2', backup:'sheets', lock:'normal', step:'lock', pin:'', waitLeft:30, count:5 }
let timers = []
const clearTimers = () => { timers.forEach(clearInterval); timers = [] }
const phone = document.querySelector('[data-phone]')

const greeting = () => { const h=new Date().getHours(); return h>=5&&h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير' }

function lockScreen(){
  const waiting = S.lock==='wait' && S.waitLeft>0
  const C = 2*Math.PI*7, off = C*(1-S.waitLeft/30)
  const hint = waiting
    ? `<div class="wait"><svg width="18" height="18" viewBox="0 0 18 18"><circle class="trk" cx="9" cy="9" r="7" fill="none" stroke-width="2"/><circle class="arc" cx="9" cy="9" r="7" fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><span>محاولات كثيرة، حاول بعد <span class="num">${S.waitLeft}</span> ثانية</span></div>`
    : `<div class="hint">أدخل رقمك السري للمتابعة</div>`
  const keys=['1','2','3','4','5','6','7','8','9','','0','del']
  return `<div class="aurora"></div><div class="lock">
    <div class="logo">${svg(I.logo,26,2.2)}</div>
    <div class="hello">${greeting()}</div>${hint}
    <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div>
    <div class="pad ${waiting?'off':''}">${keys.map(k=>k===''?'<span></span>':k==='del'?`<button class="key ghost" data-del>${svg(I.del,24,1.8)}</button>`:`<button class="key" data-k="${k}">${k}</button>`).join('')}</div>
    <div class="foot"><button data-forgot>نسيت الرقم السري؟</button><span class="num">v3.3.1</span></div>
  </div>`
}

const LIST = () => `<div class="list">
  <div class="li"><span class="ic">${svg(I.wallet,16)}</span>حساباتك وحركاتك وكل بياناتك المالية</div>
  <div class="li"><span class="ic">${svg(I.lock,16)}</span>الرقم السري والبصمة</div>
  <div class="li"><span class="ic">${svg(I.cloud,16)}</span>ربط المزامنة على هذا الجهاز</div>
  <div class="li"><span class="ic">${svg(I.sliders,16)}</span>تفضيلاتك وإعداداتك</div>
</div>`

const BACKUP = () => S.backup==='sheets'
  ? `<div class="backup ok"><span class="bi">${svg(I.check,18,2.2)}</span><div><b>نسختك محفوظة في Google Sheets</b><span>آخر مزامنة قبل <span class="num">3</span> دقائق. تقدر تستعيدها بعد المسح برابط السكربت والرمز السري.</span></div></div>`
  : `<div class="backup no"><span class="bi">${svg(I.alert,18,2)}</span><div><b>ما فيه نسخة احتياطية على هذا الجهاز</b><span>لو مسحت الحين، بياناتك تروح نهائيًا. لو عندك ملف نسخة احتياطية تقدر تستعيده بعدين.</span></div></div>`

function overlay(){
  if(S.step!=='confirm') return ''
  if(S.opt==='1') return `<div class="scrim" data-cancel></div><div class="dlg-wrap"><div class="dlg">
    <h3>نسيت الرقم السري؟</h3>
    <p>لحماية بياناتك، راح نمسح كل بيانات التطبيق من هذا الجهاز ونبدأ من جديد. تقدر تستعيدها بعدين من نسختك الاحتياطية في Google Sheets أو من ملف النسخة.</p>
    <div class="row2"><button class="btn ghost press" data-cancel>إلغاء</button><button class="btn danger press" data-wipe>امسح وابدأ من جديد</button></div>
  </div></div>`
  if(S.opt==='2') return `<div class="scrim" data-cancel></div><div class="sheet">
    <div class="handle"></div>
    <h3>نسيت الرقم السري؟</h3>
    <div class="sub">ما نقدر نسترجع الرقم، لأنه محفوظ مشفّر على جهازك فقط. حتى ما يقدر أحد يتجاوز القفل، راح نمسح من هذا الجهاز:</div>
    ${LIST()}${BACKUP()}
    <button class="hold" data-hold><span class="fill"></span><span class="lbl">اضغط مطوّلًا للمسح</span></button>
    <button class="cancel" data-cancel>تذكّرته، رجّعني</button>
  </div>`
  return `<div class="page">
    <div class="top"><button class="glass press" data-cancel aria-label="إغلاق">${svg(I.close,18)}</button></div>
    <div class="big-ic">${svg(I.reset,30,2)}</div>
    <h2>نبدأ من جديد؟</h2>
    <div class="sub">ما نقدر نسترجع الرقم السري. حتى ما يقدر أحد يتجاوز القفل، راح نمسح من هذا الجهاز:</div>
    ${LIST()}${BACKUP()}
    <div class="bottom">
      <button class="btn danger press" style="width:100%;height:52px;border-radius:17px" data-wipe ${S.count>0?'disabled':''}>${S.count>0?`امسح وابدأ من جديد (<span class="count">${S.count}</span>)`:'امسح وابدأ من جديد'}</button>
      <button class="cancel" data-cancel>تذكّرته، رجّعني</button>
    </div>
  </div>`
}

function fresh(){
  if(S.step!=='fresh') return ''
  return `<div class="fresh">
    <div class="ring">${svg(I.check,34,2.6)}</div>
    <h2>انمسحت البيانات من الجهاز</h2>
    <p>التطبيق الحين مثل أول مرة. ابدأ من الصفر، أو رجّع بياناتك من نسختك الاحتياطية.</p>
    <div class="col">
      <button class="btn white press" data-again>${S.backup==='sheets'?'استعادة من Google Sheets':'ابدأ من جديد'}</button>
      <button class="btn ghost press" data-again>${S.backup==='sheets'?'ابدأ من جديد':'عندي ملف نسخة احتياطية'}</button>
    </div>
    <div class="note">في التطبيق، هذي الخطوة تنقلك لقصص الترحيب وفيها «عندي نسخة احتياطية»</div>
  </div>`
}

function render(){
  phone.innerHTML = lockScreen() + overlay() + fresh()
  document.querySelectorAll('[data-seg]').forEach(seg=>{
    const k=seg.dataset.seg; seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S[k]))
  })
  document.querySelector('[data-desc]').innerHTML = DESC[S.opt]
  bindHold()
}

function startWait(){
  S.waitLeft=30
  timers.push(setInterval(()=>{ if(S.waitLeft>0){ S.waitLeft--; if(S.step==='lock'||S.step==='confirm') render() } },1000))
}
function startCount(){
  S.count=5
  timers.push(setInterval(()=>{ if(S.count>0 && S.step==='confirm'){ S.count--; render() } },1000))
}
function restart(){
  clearTimers(); S.step='lock'; S.pin=''
  if(S.lock==='wait') startWait(); else S.waitLeft=0
  render()
}

function bindHold(){
  const h = phone.querySelector('[data-hold]'); if(!h) return
  const fill = h.querySelector('.fill'); let raf=0, t0=0
  const DUR=1500
  const step = t => { const p=Math.min(1,(t-t0)/DUR); fill.style.transform=`scaleX(${p})`; if(p<1) raf=requestAnimationFrame(step); else { S.step='fresh'; render() } }
  const down = e => { e.preventDefault(); h.classList.add('going'); t0=performance.now(); raf=requestAnimationFrame(step) }
  const up = () => { cancelAnimationFrame(raf); h.classList.remove('going'); fill.style.transition='transform .3s var(--expo)'; fill.style.transform='scaleX(0)'; setTimeout(()=>fill.style.transition='',300) }
  h.addEventListener('pointerdown',down); h.addEventListener('pointerup',up); h.addEventListener('pointerleave',up); h.addEventListener('pointercancel',up)
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-cancel]'); if(!t) return
  if(t.closest('[data-seg]')){ const k=t.closest('[data-seg]').dataset.seg; S[k]=t.dataset.v; restart(); return }
  if(t.matches('[data-reset]')){ restart(); return }
  if(!phone.contains(t)) return
  if(t.matches('[data-k]')){ if(S.pin.length<4){ S.pin+=t.dataset.k; render(); if(S.pin.length===4) setTimeout(()=>{ S.pin=''; render() },500) } return }
  if(t.matches('[data-del]')){ S.pin=S.pin.slice(0,-1); render(); return }
  if(t.matches('[data-forgot]')){ S.step='confirm'; if(S.opt==='3') startCount(); render(); return }
  if(t.matches('[data-cancel]')){ S.step='lock'; render(); return }
  if(t.matches('[data-wipe]')){ S.step='fresh'; render(); return }
  if(t.matches('[data-again]')){ S.lock='normal'; restart(); return }
})

restart()
</script>
</body>
</html>
