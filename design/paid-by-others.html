<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصروف دفعه غيرك</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff; --sub:#ffbf47; --owed-to:#2ee6c8; --fuel:#ff8a1a;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.56,.64,1); --expo:cubic-bezier(.16,1,.3,1); --calm:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:18px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .press{transition:transform .18s var(--spring)}.press:active{transform:scale(.97)}

  .intro{width:100%;max-width:420px}
  .intro h1{font-size:22px;font-weight:700}
  .intro p{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.7}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px}
  .plbl{font-size:11.5px;color:var(--text-3);font-weight:500;margin-bottom:7px;display:flex;justify-content:space-between}
  .plbl b{color:var(--text-2);font-weight:600}
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,28,33,.9);border:1px solid var(--border-strong);overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:background .3s var(--spring),color .2s}
  .seg button.on{background:var(--accent);color:var(--on-accent)}

  .phone{width:390px;max-width:100%;min-height:780px;background:var(--bg);border-radius:40px;border:1px solid #1d1d22;padding:22px 20px 30px;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:28px;padding:18px 14px 24px}}
  .hdr{display:flex;justify-content:space-between;align-items:center}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--border)}
  .h1{font-size:26px;font-weight:700;margin:14px 0 16px}
  .fade{animation:fade .45s var(--expo) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .types{position:relative;display:flex;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:4px;margin-bottom:18px}
  .types span{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px)/3);right:4px;border-radius:999px;background:var(--expense)}
  .types button{position:relative;flex:1;padding:10px 0;font-size:13.5px;font-weight:600;color:var(--text-2)}
  .types button.on{color:var(--on-accent)}

  .field{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);text-align:right}
  .fl{font-size:11px;color:var(--text-3);margin-bottom:6px;padding:0 4px}
  .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .ft{font-size:14px;font-weight:600}
  .fs{font-size:11px;color:var(--text-3);margin-top:1px}

  .payer{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
  .payer .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--surface-hi);transition:right .42s var(--spring)}
  .payer button{position:relative;flex:1;height:36px;font-size:12.5px;font-weight:600;color:var(--text-3);transition:color .2s;display:flex;align-items:center;justify-content:center;gap:6px}
  .payer button.on{color:var(--text)}

  .people{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
  .people::-webkit-scrollbar{display:none}
  .pp{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:62px}
  .av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;transition:box-shadow .25s,transform .3s var(--spring)}
  .pp.on .av{transform:scale(1.06)}
  .pp small{font-size:11px;color:var(--text-2);white-space:nowrap}
  .pp.on small{color:var(--text);font-weight:600}

  .amount{text-align:center;margin:18px 0 16px}
  .amount .q{font-size:12.5px;color:var(--text-2);margin-bottom:2px}
  .amount .v{font-size:52px;font-weight:700;line-height:1.1}
  .amount .v span{font-family:var(--font-sans);font-size:18px;opacity:.6;font-weight:500;margin-inline-start:8px}
  .info{display:flex;gap:10px;align-items:flex-start;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--border);padding:11px 13px;font-size:11.5px;color:var(--text-2);line-height:1.7}
  .info svg{flex-shrink:0;margin-top:2px;color:var(--text-3)}
  .save{width:100%;margin-top:16px;padding:15px;border-radius:18px;font-size:14px;font-weight:700;background:linear-gradient(150deg,#fff,#a9a9b3);color:var(--on-accent)}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface)}
  .sw{width:46px;height:28px;border-radius:999px;background:var(--surface-hi);position:relative;transition:background .25s}
  .sw::after{content:'';position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .35s var(--spring)}
  .sw.on{background:var(--accent)}.sw.on::after{right:21px;background:var(--on-accent)}

  /* القوائم */
  .grp{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--text-3);margin:16px 6px 8px}
  .tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
  .tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px 2px 3px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text-2)}
  .tag i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:14px}
  .hero{position:relative;overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .stat2 div{border-radius:16px;background:rgba(255,255,255,.04);padding:11px 10px}
  .stat2 b{display:block;font-size:16px;font-weight:700}
  .stat2 small{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
  .split{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin-top:12px}

  .note{width:100%;max-width:420px;font-size:12px;color:var(--text-2);line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px}
  .note .k{color:var(--text-3);font-size:11px;display:block;margin-bottom:2px}
</style>
</head>
<body>

<div class="intro">
  <h1>مصروف دفعه غيرك</h1>
  <p>تسجيل مصروف يخصّك لكن دفعه شخص آخر (مثل صديق عبّى بنزين سيارتك). للمراجعة والتذكّر فقط: لا يخصم من أي حساب، ولا يدخل في مصاريفك أو ميزانيتك، وليس دَينًا. تنقّل بين الشاشات من اللوحة.</p>
</div>

<div class="panel">
  <div>
    <div class="plbl">الشاشة <b id="nScr"></b></div>
    <div class="seg" id="segScr">
      <button data-v="0" class="on">إضافة مصروف</button>
      <button data-v="1">تسجيل وقود</button>
      <button data-v="2">الحركات</button>
      <button data-v="3">السيارة</button>
      <button data-v="4">صفحة الشخص</button>
      <button data-v="5">الفئة</button>
    </div>
  </div>
  <div id="optBox">
    <div class="plbl">طريقة اختيار «من دفع؟» <b id="nOpt"></b></div>
    <div class="seg" id="segOpt">
      <button data-v="0" class="on"><span class="num">1</span> · مفتاح أنا / شخص آخر</button>
      <button data-v="1"><span class="num">2</span> · زر تبديل</button>
      <button data-v="2"><span class="num">3</span> · داخل قائمة الحسابات</button>
    </div>
  </div>
</div>

<div class="phone"><div id="root"></div></div>

<div class="note" id="note"></div>

<script>
const svg = (p,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`
const PALETTE = ['#45C8FF','#A1A1AD','#FFBF47','#2EE6C8','#FF9A4D','#FF5F6D','#E4E4EA']
function colorFor(seed){let h=0;for(let i=0;i<seed.length;i++)h=(h<<5)-h+seed.charCodeAt(i);return PALETTE[Math.abs(h|0)%PALETTE.length]}
const PEOPLE = ['أحمد','سعد','خالد','فهد','نورة','ماجد']
const av = (n,s=50) => { const c=colorFor(n); return `<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.38}px;background:radial-gradient(120% 120% at 30% 20%,${c}55,${c}14 70%);box-shadow:inset 0 0 0 1.5px ${c}40;color:${c}">${n[0]}</span>` }
const I = {
  info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',16,2),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',15,2),
  wallet:svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/>',15,2),
  fuel:svg('<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h5"/>',19),
  food:svg('<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M17 21V3c-2 1-3 4-3 7h3"/>',19),
  heart:svg('<path d="M20.8 8.6a5 5 0 0 0-8.8-3.2 5 5 0 0 0-8.8 3.2c0 5.4 8.8 10.4 8.8 10.4s8.8-5 8.8-10.4z"/>',17),
  chev:svg('<path d="m15 6-6 6 6 6"/>',14,2.4),
  back:svg('<path d="m9 6 6 6-6 6"/>',18,2.2),
}
const S = { scr:0, opt:0, other:true, person:'أحمد', sheet:false }

/* ===== «من دفع؟» بثلاث طرق ===== */
function payerControl(){
  const people = `<div class="fade" style="margin-top:4px"><div class="fl">مين دفع عنك؟</div><div class="people">${PEOPLE.map(n=>`<button class="pp press ${S.person===n?'on':''}" data-person="${n}">${av(n)}<small>${n}</small></button>`).join('')}
    <button class="pp press"><span class="av" style="border:1.5px dashed var(--border-strong);color:var(--text-2)">${svg('<path d="M12 5v14M5 12h14"/>',18,2.2)}</span><small>شخص جديد</small></button></div></div>`
  const account = `<div class="fade"><div class="fl">الحساب</div><button class="field press" ${S.opt===2?'data-sheet':''}><span class="ic" style="background:rgba(139,123,255,.14);color:var(--transfer)">${I.wallet}</span><div style="flex:1"><div class="ft">الراجحي</div><div class="fs">بنكي · الرصيد الحالي</div></div><span class="num" style="font-size:16px;font-weight:700;color:var(--transfer)">8,240 ر.س</span></button></div>`
  const chosen = `<div class="fade"><div class="fl">الحساب</div><button class="field press" data-sheet>${av(S.person,40)}<div style="flex:1"><div class="ft">دفعها ${S.person}</div><div class="fs">لن تُخصم من أي حساب</div></div><span style="color:var(--text-3)">${I.chev}</span></button></div>`
  if(S.opt===0) return `<div class="payer"><span class="pill" style="right:${S.other?'50%':'4px'}"></span>
      <button class="${S.other?'':'on'}" data-other="0">${I.wallet}دفعتها أنا</button><button class="${S.other?'on':''}" data-other="1">${I.user}دفعها شخص آخر</button></div>
    ${S.other?people:account}`
  if(S.opt===1) return `${S.other?people:account}<div class="toggle" style="margin-top:10px"><div><div class="ft" style="font-size:13px">دفعها شخص آخر</div><div class="fs">للتذكّر فقط · لا تُخصم من حسابك</div></div><button class="sw ${S.other?'on':''}" data-toggle></button></div>`
  return S.other?chosen:account
}
function accountSheet(){
  return `<div style="position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:5" data-close></div>
  <div class="fade" style="position:absolute;left:0;right:0;bottom:0;z-index:6;border-radius:32px 32px 0 0;border:1px solid var(--border-strong);border-bottom:0;background:var(--surface-el);padding:10px 16px 26px">
    <div style="width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 14px"></div>
    <div style="font-size:17px;font-weight:600;margin-bottom:12px">من أين دفعت؟</div>
    ${[['الراجحي','بنكي','8,240','var(--transfer)'],['الكاش','نقدي','620','var(--income)']].map(([n,t,b,c])=>`<button class="field press" style="margin-bottom:8px" data-pick-acc><span class="ic" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}">${I.wallet}</span><div style="flex:1"><div class="ft">${n}</div><div class="fs">${t}</div></div><span class="num" style="font-weight:700;color:${c}">${b} ر.س</span></button>`).join('')}
    <div style="font-size:11.5px;font-weight:600;color:var(--text-3);margin:14px 4px 8px">أو دفعها عنك شخص</div>
    <div class="people" style="margin:0 -16px;padding:0 16px">${PEOPLE.map(n=>`<button class="pp press ${S.other&&S.person===n?'on':''}" data-pick-person="${n}">${av(n,46)}<small>${n}</small></button>`).join('')}</div>
  </div>`
}

/* ===== الشاشات ===== */
const SCREENS = [
  () => `<div class="hdr"><span class="gb">${I.back}</span><span style="font-size:15px;font-weight:600">حركة جديدة</span><span style="width:40px"></span></div>
    <div style="height:16px"></div>
    <div class="types"><span></span><button class="on">مصروف</button><button>دخل</button><button>تحويل</button></div>
    ${payerControl()}
    <div class="amount"><div class="q">${S.other?`كم دفع ${S.person} عنك؟`:'كم صرفت؟'}</div><div class="v num" style="color:${S.other?'var(--text)':'var(--expense)'}" dir="ltr">50<span>ر.س</span></div></div>
    <div class="fl">الفئة</div><button class="field press"><span class="ic" style="background:rgba(255,138,26,.15);color:var(--fuel)">${I.fuel}</span><div style="flex:1"><div class="ft">وقود</div></div><span style="color:var(--text-3)">${I.chev}</span></button>
    ${S.other?`<div class="info fade" style="margin-top:12px">${I.info}<div>تُسجَّل للتذكّر فقط: <b style="color:var(--text)">لا تُخصم من حسابك</b>، ولا تدخل في مصاريفك أو ميزانية «وقود»، وليست دَينًا على ${S.person}. تظهر في صفحة ${S.person} ضمن «المساهمات».</div></div>`:''}
    <button class="save press">${S.other?`حفظ · دفعها ${S.person}`:'حفظ المصروف'}</button>
    ${S.sheet?accountSheet():''}`,

  () => `<div class="hdr"><span class="gb">${I.back}</span><span style="font-size:15px;font-weight:600">تسجيل وقود</span><span style="width:40px"></span></div>
    <div style="height:16px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="field" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="fs">العدّاد</span><span class="num" style="font-size:18px;font-weight:700">84,210 <small style="font-size:11px;color:var(--text-3)">كم</small></span></div>
      <div class="field" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="fs">اللترات</span><span class="num" style="font-size:18px;font-weight:700">21.6 <small style="font-size:11px;color:var(--text-3)">لتر</small></span></div>
    </div>
    <div class="field" style="justify-content:space-between;margin-bottom:12px"><span class="ft" style="font-size:13px">تعبئة كاملة</span><span class="sw on"></span></div>
    <div class="fl">التكلفة</div><div class="field" style="margin-bottom:14px"><span class="num" style="font-size:20px;font-weight:700">50</span><span class="fs">ر.س</span></div>
    ${payerControl()}
    ${S.other?`<div class="info fade" style="margin-top:12px">${I.info}<div>اللترات والعدّاد تدخل في حساب الاستهلاك عادي. التكلفة تظهر في «دفعها غيرك» ولا تُخصم من حسابك.</div></div>`:''}
    <button class="save press">حفظ التعبئة</button>
    ${S.sheet?accountSheet():''}`,

  () => `<div class="h1">كل الحركات</div>
    <div class="hero" style="padding:14px"><div style="font-size:12px;color:var(--text-2)"><b class="num" style="color:var(--text)">4</b> حركات · اليوم وأمس</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">${[['الدخل','0','var(--income)'],['المصروف','164','var(--expense)'],['الصافي','−164','var(--text)']].map(([l,v,c])=>`<div style="border-radius:14px;background:rgba(255,255,255,.04);padding:8px;text-align:center"><small style="display:block;font-size:10.5px;color:var(--text-3)">${l}</small><b class="num" style="color:${c};font-size:15px">${v}</b></div>`).join('')}</div>
      <div style="font-size:10.5px;color:var(--text-3);margin-top:8px">لا يشمل <span class="num">50</span> ر.س دفعها غيرك</div></div>
    <div class="grp"><span>اليوم</span><span class="num">−97</span></div>
    <div class="tx"><span class="ic" style="background:rgba(255,138,26,.15);color:var(--fuel)">${I.fuel}</span><div style="flex:1;min-width:0"><div class="ft">وقود</div><div style="margin-top:4px"><span class="tag"><i style="background:${colorFor('أحمد')}33;color:${colorFor('أحمد')}">أ</i>دفعها أحمد</span></div></div>
      <div style="text-align:left"><div class="num" style="font-size:14px;font-weight:700;color:var(--text-3)">50 ر.س</div><div style="font-size:10px;color:var(--text-3);margin-top:2px">لم تُخصم</div></div></div>
    <div class="tx"><span class="ic" style="background:rgba(69,200,255,.14);color:#45C8FF">${I.food}</span><div style="flex:1"><div class="ft">مطاعم</div><div class="fs">الراجحي</div></div><div class="num" dir="ltr" style="font-size:14px;font-weight:700">−97 ر.س</div></div>
    <div class="grp"><span>أمس</span><span class="num">−67</span></div>
    <div class="tx"><span class="ic" style="background:rgba(69,200,255,.14);color:#45C8FF">${I.food}</span><div style="flex:1"><div class="ft">مطاعم</div><div class="fs">الكاش</div></div><div class="num" dir="ltr" style="font-size:14px;font-weight:700">−67 ر.س</div></div>`,

  () => `<div class="h1">السيارة</div>
    <div class="hero"><div style="font-size:12.5px;color:var(--text-2)">تكلفة الكيلومتر · آخر <span class="num">1,240</span> كم</div>

    <div class="grp" style="margin-top:20px"><span style="font-size:14px;color:var(--text)">المساهمات</span><span>للتذكّر · لا تدخل في الرصيد</span></div>

      <div style="display:flex;align-items:center;gap:10px"><span class="ic" style="background:rgba(255,255,255,.06);color:var(--text)">${I.heart}</span><div style="flex:1"><div class="fs" style="font-size:11.5px">دفع عنك هذه السنة</div><div class="num" style="font-size:20px;font-weight:700">135 <span style="font-family:var(--font-sans);font-size:11px;color:var(--text-3)">ر.س · 3 مرات</span></div></div></div>
      <div style="border-top:1px solid var(--border);margin:12px 0 4px"></div>
      ${[['وقود','2026/10/09','50',I.fuel,'var(--fuel)'],['مطاعم','2026/09/21','60',I.food,'#45C8FF'],['وقود','2026/08/14','25',I.fuel,'var(--fuel)']].map(([t,d,a,ic,c])=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0"><span class="ic" style="width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,${c} 15%,transparent);color:${c}">${ic}</span><div style="flex:1"><div style="font-size:13px;font-weight:600">${t}</div><div class="num fs">${d}</div></div><span class="num" style="font-weight:700;font-size:13px">${a} ر.س</span></div>`).join('')}

const NOTES = [
  '<span class="k">إضافة مصروف</span>عند اختيار «دفعها شخص آخر» يختفي اختيار الحساب ويظهر الأشخاص من قائمة السلف. الرقم يصير أبيض بدل الأحمر لأنه ليس مصروفًا عليك. جرّب الطرق الثلاث من اللوحة: (١) مفتاح «دفعتها أنا / دفعها شخص آخر» فوق الحساب، (٢) زر تبديل تحت الأشخاص، (٣) الأشخاص داخل ورقة اختيار الحساب نفسها (اضغط على حقل الحساب).',
  '<span class="k">تسجيل وقود</span>نفس «من دفع؟» في شاشة السيارة. اللترات والعدّاد يدخلان في حساب الاستهلاك عادي، والتكلفة تُحفظ بدون أي حركة مالية.',
  '<span class="k">الحركات</span>تظهر في القائمة لتتذكّرها، بشارة «دفعها أحمد» والمبلغ رمادي مع «لم تُخصم». لا تدخل في الدخل ولا المصروف ولا الصافي، وتحت الملخص سطر صغير يذكّر بمجموعها.',
  '<span class="k">السيارة</span>تكلفة الكيلومتر برقمين: اللي دفعته أنت، والتكلفة الحقيقية للسيارة (شاملة ما دفعه غيرك). الشريط يفصل بينهما، والجزء المخطّط هو ما دفعه غيرك.',
  '<span class="k">صفحة الشخص</span>قسم «المساهمات»: كم دفع عنك هذه السنة وعدد المرات، وقائمة بها. لا يدخل في رصيد السلف ولا يغيّره.',
  '<span class="k">الفئة</span>المصروف والميزانية بدون تغيير، وتحتهما سطر «ودفع عنك غيرك 50 ر.س» للتذكّر.',
]

const root = document.getElementById('root')
function render(){
  root.innerHTML = `<div class="fade">${SCREENS[S.scr]()}</div>`
  document.querySelectorAll('#segScr button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.scr))
  document.querySelectorAll('#segOpt button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.opt))
  document.getElementById('optBox').style.display = S.scr<=1 ? '' : 'none'
  document.getElementById('nScr').textContent = document.querySelector(`#segScr button[data-v="${S.scr}"]`).textContent
  document.getElementById('nOpt').textContent = 'خيار '+(S.opt+1)
  document.getElementById('note').innerHTML = NOTES[S.scr]
}
document.getElementById('segScr').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.scr=+b.dataset.v;S.sheet=false;render()}
document.getElementById('segOpt').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.opt=+b.dataset.v;S.sheet=false;render()}
root.addEventListener('click',e=>{
  const o=e.target.closest('[data-other]'); if(o){S.other=o.dataset.other==='1';render();return}
  if(e.target.closest('[data-toggle]')){S.other=!S.other;render();return}
  const p=e.target.closest('[data-person]'); if(p){S.person=p.dataset.person;render();return}
  if(e.target.closest('[data-close]')){S.sheet=false;render();return}
  const pp=e.target.closest('[data-pick-person]'); if(pp){S.other=true;S.person=pp.dataset.pickPerson;S.sheet=false;render();return}
  if(e.target.closest('[data-pick-acc]')){S.other=false;S.sheet=false;render();return}
  if(e.target.closest('[data-sheet]')){S.sheet=true;render()}
})
render()
</script>
