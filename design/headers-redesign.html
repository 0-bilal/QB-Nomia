<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رؤوس الشاشات — ستة أنماط</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c; --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0 40px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .ctl{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:12px;padding:0 12px;max-width:560px}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .pill{padding:7px 12px;border-radius:99px;background:#16161a;border:1px solid #26262c;font-size:12px;font-weight:600;color:var(--text-2)}
  .pill.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .pill b{font-family:var(--font-num);margin-inline-end:4px}
  .desc{background:#111114;border:1px solid #222228;border-radius:16px;padding:10px 14px;font-size:12px;color:var(--text-2);line-height:1.7;text-align:center;max-width:420px}
  .desc b{color:var(--text)}

  .phone{width:390px;max-width:100%;height:780px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:0;border:0;height:calc(100vh - 200px)}}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 16px 120px}
  .scroll::-webkit-scrollbar{display:none}
  .aurora{position:absolute;top:-120px;left:-60px;right:-60px;height:340px;background:radial-gradient(50% 60% at 70% 40%,rgba(139,123,255,.14),transparent 70%);pointer-events:none}

  /* طبقة الرأس */
  .hdr{position:absolute;top:0;left:0;right:0;z-index:20;pointer-events:none;transition:transform .3s var(--ease)}
  .hdr *{pointer-events:auto}
  .hdr.hidden{transform:translateY(-110%)}
  .hdr .bg{position:absolute;inset:0;background:rgba(10,10,12,.74);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.08);opacity:0;transition:opacity .2s;pointer-events:none}
  .hdr.solid .bg{opacity:1}
  .hrow{position:relative;height:92px;padding:44px 14px 0;display:flex;align-items:center;gap:8px}
  .hrow .sp{flex:1}
  .mid{position:absolute;left:66px;right:66px;top:44px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .25s var(--ease)}
  .mid b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mid small{font-size:10.5px;color:var(--text-3)}
  .hdr.solid .mid,.mid.show{opacity:1;transform:none}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(24,24,28,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);flex-shrink:0;position:relative}
  .gb.acc{background:var(--accent);color:var(--on-accent);border:0}
  .gb .bdg{position:absolute;top:-2px;left:-2px;min-width:16px;height:16px;border-radius:99px;background:var(--expense);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
  .prog{position:absolute;bottom:-1px;right:0;height:2px;background:var(--accent);opacity:.75;width:0}

  /* (ج) كبسولة عائمة */
  .capsule{position:absolute;top:48px;left:50%;transform:translate(-50%,-14px) scale(.9);opacity:0;transition:all .3s var(--ease);background:rgba(28,28,33,.85);backdrop-filter:blur(20px);border:1px solid var(--border-strong);border-radius:99px;padding:7px 14px 7px 8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
  .capsule.on{opacity:1;transform:translate(-50%,0) scale(1)}
  .capsule .lg{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#fff,#f4f4f6 55%,#a9a9b3)}
  .capsule small{font-size:11px;color:var(--text-3);font-weight:500}

  /* (د) مسار التطبيق */
  .crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3)}
  .crumb .lg{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,#fff,#f4f4f6 55%,#a9a9b3)}
  .crumb b{color:var(--text);font-size:15px}

  /* (و) متتبع الأقسام */
  .tracker{display:flex;flex-direction:column;align-items:center}
  .tracker .s{font-size:10.5px;color:var(--text-3)}
  .tracker .c{font-size:14px;font-weight:700;transition:opacity .15s}
  .dots{display:flex;gap:4px;margin-top:3px}
  .dots i{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);transition:all .2s}
  .dots i.on{width:14px;background:var(--accent)}

  /* المحتوى */
  .large{padding:96px 4px 16px;transform-origin:right top}
  .large h1{font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .large p{font-size:12.5px;color:var(--text-3);margin-top:4px}
  .greet{padding:96px 4px 14px;display:flex;align-items:center;gap:10px}
  .greet .lg{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,#fff,#f4f4f6 55%,#a9a9b3)}
  .greet b{font-size:22px;font-weight:700;display:block}
  .greet small{font-size:11.5px;color:var(--text-3)}
  .spacer{height:100px}
  .hero{border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .hero .l{font-size:12.5px;color:var(--text-2)}
  .hero .v{font-size:40px;font-weight:700;margin-top:4px}
  .sh{font-size:14.5px;font-weight:700;margin:22px 6px 10px}
  .blk{height:110px;border-radius:24px;background:var(--surface);border:1px solid var(--border);margin-top:10px;padding:16px}
  .blk .t{width:40%;height:10px;border-radius:6px;background:rgba(255,255,255,.08)}
  .blk .t2{width:70%;height:8px;border-radius:6px;background:rgba(255,255,255,.05);margin-top:12px}

  /* شريط التنقل السفلي */
  .nav{position:absolute;bottom:14px;left:14px;right:14px;height:64px;border-radius:26px;background:rgba(22,22,26,.88);backdrop-filter:blur(18px);border:1px solid var(--border-strong);display:flex;justify-content:space-around;align-items:center;z-index:25;font-size:10px;color:var(--text-3);transition:all .3s var(--ease)}
  .nav span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:16px;transition:all .3s var(--ease)}
  .nav .on{color:var(--text);font-weight:600}
  .nav.labelled .on{background:rgba(255,255,255,.1);flex-direction:row;gap:6px;font-size:12px;padding:8px 14px}
  .nav i{width:18px;height:18px;border-radius:5px;background:currentColor;opacity:.6}
</style>
</head>
<body>
<div class="ctl">
  <div class="row" id="screens">
    <button class="pill on" data-s="home">الرئيسية</button>
    <button class="pill" data-s="tab">تبويب (الحسابات)</button>
    <button class="pill" data-s="sub">شاشة فرعية (التقارير)</button>
  </div>
  <div class="row" id="modes"></div>
  <div class="desc" id="desc"></div>
</div>

<div class="phone">
  <div class="aurora"></div>
  <div class="scroll" id="scroll"><div id="content"></div></div>
  <div class="hdr" id="hdr"><div class="bg"></div><div class="hrow" id="hrow"></div><div class="prog" id="prog"></div></div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
const I={
  back:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  eye:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  bell:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  share:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>',
  logo:(s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#0a0a0c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 L10 9 L14 13 L20 5"/><path d="M15 5 H20 V10"/></svg>`,
  sep:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
};
const MODES={
  A:{n:'العنوان الكبير ينكمش',d:'العنوان الكبير يتمرر مع الصفحة ويتلاشى، ويظهر بدله <b>شريط زجاجي</b> فيه العنوان صغيرًا في المنتصف. الأزرار ثابتة دائمًا.'},
  B:{n:'يختفي ويرجع',d:'مثل (أ)، لكن <b>الشريط كله يختفي</b> عند التمرير للأسفل ليعطي المحتوى الشاشة كاملة، ويرجع فورًا عند أي تمرير للأعلى.'},
  C:{n:'كبسولة عائمة',d:'لا يوجد شريط. عند التمرير تظهر <b>كبسولة صغيرة عائمة</b> في الأعلى فيها الشعار واسم الشاشة، والأزرار تطفو بجانبها. أخف وأقل حجبًا للمحتوى.'},
  D:{n:'مسار ثابت صغير',d:'رأس <b>صغير ثابت</b> من البداية يعرض اسم التطبيق ثم اسم الشاشة (QB·Nomia ‹ الحسابات) بدل العنوان الكبير. لا شيء يتحرك عند التمرير، فقط تظهر خلفية زجاجية.'},
  E:{n:'الاسم في شريط التنقل',d:'لا يوجد عنوان في الأعلى إطلاقًا، الأزرار فقط تطفو. <b>اسم الشاشة يظهر داخل زر التبويب النشط</b> في الشريط السفلي. أقصى مساحة للمحتوى (للتبويبات والرئيسية فقط).'},
  F:{n:'متتبع الأقسام',d:'الشريط العلوي يعرض <b>اسم القسم الذي تقرأه الآن</b> (مثل: الحسابات · آخر الحركات) ويتغيّر أثناء التمرير، مع نقاط توضّح موضعك بين الأقسام.'},
};
const SECTIONS=['ملخص','بطاقاتك','هذا الشهر','آخر الحركات'];
const blocks=n=>Array.from({length:n},()=>'<div class="blk"><div class="t"></div><div class="t2"></div><div class="t2" style="width:50%"></div></div>').join('');
const body=()=>SECTIONS.slice(1).map(s=>`<div class="sh" data-sec="${s}">${s}</div>${blocks(2)}`).join('');
const SCREENS={
  home:{name:'الرئيسية',sub:'الخميس 8 أكتوبر',mid:'<b class="num">37,965.75 ر.س</b><small>إجمالي رصيدك</small>',start:'',end:`<button class="gb">${I.bell}<span class="bdg num">3</span></button><button class="gb">${I.eye}</button>`,nav:0,
    large:`<div class="greet" id="large"><div class="lg">${I.logo()}</div><div><b>صباح الخير</b><small>الخميس <span class="num">8 أكتوبر</span></small></div></div>`,
    hero:`<div class="hero" id="hero" data-sec="ملخص"><div class="l">إجمالي رصيدك</div><div class="v num">37,965<span style="opacity:.5;font-size:20px">.75</span> <span style="font-size:14px;opacity:.55">ر.س</span></div></div>`},
  tab:{name:'حساباتك',sub:'5 حسابات',mid:'<b>حساباتك</b><small>5 حسابات</small>',start:'',end:`<button class="gb acc">${I.plus}</button><button class="gb">${I.eye}</button>`,nav:1,
    large:`<div class="large" id="large"><h1>حساباتك</h1><p>5 حسابات · 3 ظاهرة في الرئيسية</p></div>`,
    hero:`<div class="hero" id="hero" data-sec="ملخص"><div class="l">إجمالي الأرصدة</div><div class="v num">37,965</div></div>`},
  sub:{name:'التقارير',sub:'أكتوبر 2026',mid:'<b>التقارير</b><small>أكتوبر 2026</small>',start:`<button class="gb">${I.back}</button>`,end:`<button class="gb">${I.share}</button>`,nav:-1,
    large:`<div class="large" id="large"><h1>التقارير</h1><p>أكتوبر 2026 · مقارنة بسبتمبر</p></div>`,
    hero:`<div class="hero" id="hero" data-sec="ملخص"><div class="l">صافي التوفير</div><div class="v num" style="color:var(--income)">4,280</div></div>`},
};
let screen='home',mode='A',lastY=0;
const $=id=>document.getElementById(id);
const sc=$('scroll'),hdr=$('hdr');

function renderModes(){$('modes').innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="pill ${k===mode?'on':''}" data-m="${k}"><b>${({A:'أ',B:'ب',C:'ج',D:'د',E:'هـ',F:'و'})[k]}</b>${m.n}</button>`).join('');}

function render(){
  const s=SCREENS[screen];
  const eMode=(mode==='E'&&screen==='sub')?'A':mode; // الشاشات الفرعية بلا شريط تنقل
  $('desc').innerHTML=MODES[mode].d+(mode==='E'&&screen==='sub'?'<br><span style="color:#6b6b75">الشاشات الفرعية ما فيها شريط تنقل، فتستخدم (أ).</span>':'');
  const top = eMode==='D'||eMode==='E' ? '<div class="spacer"></div>' : s.large;
  $('content').innerHTML=top+s.hero+body();
  let mid=`<div class="mid" id="mid">${s.mid}</div>`;
  if(eMode==='C') mid=`<div class="capsule" id="cap"><span class="lg">${I.logo(14)}</span>${s.name}<small>${s.sub}</small></div>`;
  if(eMode==='D') mid=`<div class="crumb" style="position:absolute;right:${s.start?66:16}px;top:44px;height:40px">${screen==='sub'?'':`<span class="lg">${I.logo(18)}</span>`}<span>QB·Nomia</span>${I.sep}<b>${s.name}</b></div>`;
  if(eMode==='E') mid='';
  if(eMode==='F') mid=`<div class="mid" id="mid"><div class="tracker"><span class="s">${s.name}</span><span class="c" id="secName">${SECTIONS[0]}</span><span class="dots">${SECTIONS.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</span></div></div>`;
  $('hrow').innerHTML=s.start+mid+'<span class="sp"></span>'+s.end;
  $('prog').style.display=screen==='sub'&&(eMode==='A'||eMode==='B')?'block':'none';
  const nav=$('nav');
  nav.style.display=s.nav<0?'none':'flex';
  const names=['الرئيسية','الحسابات','السلف','المزيد'];
  nav.innerHTML=names.map((n,i)=>`<span class="${i===s.nav?'on':''}"><i></i>${n}</span>`).join('');
  nav.classList.toggle('labelled',eMode==='E');
  hdr.dataset.mode=eMode;
  sc.scrollTop=0;lastY=0;hdr.classList.remove('solid','hidden');onScroll();
}
function onScroll(){
  const y=sc.scrollTop,m=hdr.dataset.mode,large=$('large'),hero=$('hero');
  if(large){const t=Math.min(1,y/70);large.style.opacity=1-t;large.style.transform=`scale(${1-t*.08}) translateY(${-t*6}px)`;}
  const trig=screen==='home'?hero.offsetTop+hero.offsetHeight-92:(large?large.offsetTop+large.offsetHeight-110:10);
  const past=y>trig;
  hdr.classList.toggle('solid',(m==='A'||m==='B'||m==='F')?past:m==='D'?y>6:false);
  if(m==='C'){const c=$('cap');c&&c.classList.toggle('on',past);}
  if(m==='B'){if(y>lastY+4&&y>160)hdr.classList.add('hidden');else if(y<lastY-4)hdr.classList.remove('hidden');}else hdr.classList.remove('hidden');
  if(m==='F'){let cur=0;document.querySelectorAll('[data-sec]').forEach(el=>{if(el.offsetTop-110<=y)cur=SECTIONS.indexOf(el.dataset.sec)});
    const n=$('secName');if(n&&n.textContent!==SECTIONS[cur]){n.textContent=SECTIONS[cur];}
    document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===cur));}
  $('prog').style.width=(y/Math.max(1,sc.scrollHeight-sc.clientHeight)*100)+'%';
  lastY=y;
}
sc.addEventListener('scroll',onScroll,{passive:true});
$('screens').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;screen=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));render();};
$('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;renderModes();render();};
renderModes();render();
</script>
</body>
</html>
