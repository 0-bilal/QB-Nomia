<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رؤوس الشاشات — تصميم مقترح</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --on-accent:#0a0a0c; --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --transfer:#8b7bff;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0 40px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .bar-ctl{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:14px;padding:0 12px}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .pill{padding:7px 13px;border-radius:99px;background:#16161a;border:1px solid #26262c;font-size:12px;font-weight:600;color:var(--text-2)}
  .pill.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .ctl-note{font-size:11.5px;color:#6b6b75;text-align:center;max-width:420px;line-height:1.6}

  .phone{width:390px;max-width:100%;height:780px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){.phone{border-radius:0;border:0;height:calc(100vh - 120px)}}
  .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 16px 120px}
  .scroll::-webkit-scrollbar{display:none}
  .aurora{position:absolute;top:-120px;left:-60px;right:-60px;height:340px;background:radial-gradient(50% 60% at 70% 40%,rgba(139,123,255,.14),transparent 70%);pointer-events:none}

  /* الشريط المضغوط العلوي */
  .cbar{position:absolute;top:0;left:0;right:0;z-index:20;height:92px;padding:44px 14px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
  .cbar .bg{position:absolute;inset:0;background:rgba(10,10,12,.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.08);opacity:0;transition:opacity .18s}
  .cbar > *:not(.bg){position:relative;pointer-events:auto}
  .cbar .ctitle{position:absolute;left:70px;right:70px;top:44px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .25s var(--ease)}
  .cbar .ctitle b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cbar .ctitle small{font-size:10.5px;color:var(--text-3);font-family:var(--font-num)}
  .cbar.on .bg{opacity:1}
  .cbar.on .ctitle{opacity:1;transform:none}
  .cbar .sp{flex:1}
  .gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(24,24,28,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);flex-shrink:0;position:relative}
  .gb.acc{background:var(--accent);color:var(--on-accent);border:0}
  .gb .bdg{position:absolute;top:-2px;left:-2px;min-width:16px;height:16px;border-radius:99px;background:var(--expense);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
  .cbar.hidebar{transform:translateY(-100%);transition:transform .3s var(--ease)}
  .cbar{transition:transform .3s var(--ease)}

  /* العنوان الكبير داخل المحتوى */
  .large{padding:96px 4px 16px;transform-origin:right top}
  .large h1{font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .large p{font-size:12.5px;color:var(--text-3);margin-top:4px}
  .greet{padding:96px 4px 14px;display:flex;align-items:center;gap:10px}
  .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,#fff,#f4f4f6 55%,#a9a9b3)}
  .greet b{font-size:22px;font-weight:700;display:block}
  .greet small{font-size:11.5px;color:var(--text-3)}

  /* محتوى تجريبي */
  .hero{border-radius:28px;border:1px solid rgba(255,255,255,.09);padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07),transparent 55%),linear-gradient(165deg,var(--surface-el),var(--void))}
  .hero .l{font-size:12.5px;color:var(--text-2)}
  .hero .v{font-size:40px;font-weight:700;margin-top:4px}
  .blk{height:120px;border-radius:24px;background:var(--surface);border:1px solid var(--border);margin-top:12px;padding:16px}
  .blk .t{width:40%;height:10px;border-radius:6px;background:rgba(255,255,255,.08)}
  .blk .t2{width:70%;height:8px;border-radius:6px;background:rgba(255,255,255,.05);margin-top:12px}
  .seg{display:flex;gap:6px;margin:4px 0 6px}
  .seg span{padding:7px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text-2)}
  .seg span.on{background:var(--accent);color:var(--on-accent)}
  .sticky-sub{position:sticky;top:92px;z-index:5;margin:0 -16px;padding:8px 16px;background:linear-gradient(180deg,rgba(5,5,6,.96),rgba(5,5,6,.85));backdrop-filter:blur(12px)}

  /* شريط التنقل السفلي */
  .nav{position:absolute;bottom:14px;left:14px;right:14px;height:64px;border-radius:26px;background:rgba(22,22,26,.85);backdrop-filter:blur(18px);border:1px solid var(--border-strong);display:flex;justify-content:space-around;align-items:center;z-index:25;font-size:10px;color:var(--text-3)}
  .nav .on{color:var(--text);font-weight:600}
  .progress{position:absolute;top:91px;right:0;height:2px;background:var(--accent);z-index:21;opacity:.7;width:0}
</style>
</head>
<body>
<div class="bar-ctl">
  <div class="row" id="screens">
    <button class="pill on" data-s="home">الرئيسية</button>
    <button class="pill" data-s="tab">تبويب (الحسابات)</button>
    <button class="pill" data-s="sub">شاشة فرعية (التقارير)</button>
  </div>
  <div class="row" id="modes">
    <button class="pill on" data-m="A">أ — عنوان كبير ينكمش</button>
    <button class="pill" data-m="B">ب — يختفي عند النزول ويرجع عند الصعود</button>
  </div>
  <div class="ctl-note" id="note"></div>
</div>

<div class="phone">
  <div class="aurora"></div>
  <div class="scroll" id="scroll"><div id="content"></div></div>
  <div class="cbar" id="cbar"><div class="bg"></div><div class="ctitle" id="ctitle"></div><div id="cstart" style="display:flex;gap:8px"></div><span class="sp"></span><div id="cend" style="display:flex;gap:8px"></div></div>
  <div class="progress" id="prog"></div>
  <nav class="nav" id="nav"><span>الرئيسية</span><span>الحسابات</span><span>السلف</span><span>المزيد</span></nav>
</div>

<script>
const I={
  back:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  eye:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  bell:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  share:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>',
  logo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 L10 9 L14 13 L20 5"/><path d="M15 5 H20 V10"/></svg>',
};
const blocks=n=>Array.from({length:n},()=>'<div class="blk"><div class="t"></div><div class="t2"></div><div class="t2" style="width:50%"></div></div>').join('');
const SCREENS={
  home:{
    start:`<button class="gb">${I.bell}<span class="bdg num">3</span></button><button class="gb">${I.eye}</button>`, end:'',
    ctitle:`<b class="num">37,965.75 ر.س</b><small>إجمالي رصيدك</small>`,
    content:`<div class="greet" id="large"><div class="logo">${I.logo}</div><div><b>صباح الخير</b><small>الخميس <span class="num">8 أكتوبر</span></small></div></div>
      <div class="hero" id="hero"><div class="l">إجمالي رصيدك</div><div class="v num">37,965<span style="opacity:.5;font-size:20px">.75</span> <span style="font-size:14px;opacity:.55">ر.س</span></div></div>${blocks(7)}`,
    nav:true, note:'الرئيسية: التحية والتاريخ يتمرران مع المحتوى. عندما تختفي بطاقة الرصيد يظهر الرصيد مختصرًا في الشريط العلوي، والجرس والعين يبقيان ثابتين.'
  },
  tab:{
    start:`<button class="gb acc">${I.plus}</button><button class="gb">${I.eye}</button>`, end:'',
    ctitle:`<b>حساباتك</b><small>5 حسابات</small>`,
    content:`<div class="large" id="large"><h1>حساباتك</h1><p>5 حسابات · 3 ظاهرة في الرئيسية</p></div>
      <div class="hero" id="hero"><div class="l">إجمالي الأرصدة</div><div class="v num">37,965</div></div>
      <div class="sticky-sub" id="stickySub"><div class="seg"><span class="on">قائمة</span><span>بطاقات</span></div></div>${blocks(7)}`,
    nav:true, note:'التبويبات: العنوان الكبير والسطر الفرعي يتمرران مع الصفحة، ويظهر العنوان صغيرًا في منتصف شريط زجاجي. الأزرار ثابتة، وأدوات الصفحة (مثل قائمة/بطاقات) تلتصق تحت الشريط.'
  },
  sub:{
    start:'', end:`<button class="gb">${I.share}</button>`, back:true,
    ctitle:`<b>التقارير</b><small>أكتوبر 2026</small>`,
    content:`<div class="large" id="large"><h1>التقارير</h1><p>أكتوبر 2026 · مقارنة بسبتمبر</p></div>
      <div class="hero" id="hero"><div class="l">صافي التوفير</div><div class="v num" style="color:var(--income)">4,280</div></div>${blocks(8)}`,
    nav:false, note:'الشاشات الفرعية: زر الرجوع وزر الإجراء ثابتان، والعنوان يبدأ كبيرًا تحت زر الرجوع ثم ينكمش لمنتصف الشريط عند التمرير، مع خط تقدّم رفيع يوضح موضعك في الصفحة.'
  },
};
let screen='home',mode='A',lastY=0;
const sc=document.getElementById('scroll'),cbar=document.getElementById('cbar'),prog=document.getElementById('prog');
function render(){
  const s=SCREENS[screen];
  document.getElementById('content').innerHTML=s.content;
  document.getElementById('ctitle').innerHTML=s.ctitle;
  document.getElementById('cstart').innerHTML=s.back?`<button class="gb">${I.back}</button>`:'';
  document.getElementById('cend').innerHTML=s.end+s.start;
  document.getElementById('nav').style.display=s.nav?'flex':'none';
  prog.style.display=screen==='sub'?'block':'none';
  document.getElementById('note').textContent=s.note+(mode==='B'?' — في النمط (ب) يختفي الشريط كاملًا عند التمرير للأسفل ويرجع فورًا عند أي تمرير للأعلى.':'');
  sc.scrollTop=0;lastY=0;cbar.classList.remove('on','hidebar');onScroll();
}
function onScroll(){
  const y=sc.scrollTop, large=document.getElementById('large'), hero=document.getElementById('hero');
  // العنوان الكبير: يتلاشى وينكمش قليلًا مع أول التمرير
  const t=Math.min(1,y/70);
  if(large){large.style.opacity=1-t;large.style.transform=`scale(${1-t*.08}) translateY(${t*-6}px)`;}
  const trigger=screen==='home'?(hero.offsetTop+hero.offsetHeight-92):(large.offsetTop+large.offsetHeight-110);
  cbar.classList.toggle('on',y>trigger);
  if(mode==='B'){ if(y>lastY+4&&y>160)cbar.classList.add('hidebar'); else if(y<lastY-4)cbar.classList.remove('hidebar'); }
  else cbar.classList.remove('hidebar');
  const ss=document.getElementById('stickySub'); if(ss) ss.style.top=(cbar.classList.contains('hidebar')?0:92)+'px';
  prog.style.width=(y/(sc.scrollHeight-sc.clientHeight)*100)+'%';
  lastY=y;
}
sc.addEventListener('scroll',onScroll,{passive:true});
document.getElementById('screens').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;screen=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));render();};
document.getElementById('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));render();};
render();
</script>
</body>
</html>
