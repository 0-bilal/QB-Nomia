<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الفئات واختيار الفئة — تصميم مقترح</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --void:#0b0b0d; --surface:#121215; --surface-el:#1a1a1f; --surface-hi:#24242a;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --accent:#f4f4f6; --accent-soft:rgba(255,255,255,.09); --on-accent:#0a0a0c;
    --text:#f4f4f6; --text-2:#a1a1ad; --text-3:#62626d;
    --income:#3ee08f; --expense:#ff5f6d; --warn:#ffbf47;
    --font-sans:'Readex Pro',system-ui,sans-serif; --font-num:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{font-family:var(--font-sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 0 40px}
  button,input{font:inherit;color:inherit;background:none;border:0}
  button{cursor:pointer}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .press{transition:transform .15s var(--ease)}.press:active{transform:scale(.96)}

  .preview-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;padding:0 16px}
  .pill{padding:8px 14px;border-radius:99px;background:#16161a;border:1px solid #26262c;font-size:12.5px;font-weight:600;color:var(--text-2)}
  .pill.on{background:var(--accent);color:var(--on-accent);border-color:transparent}

  .phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;border:1px solid #1d1d22;overflow:hidden;position:relative;box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  @media (max-width:440px){body{padding-top:12px}.phone{border-radius:0;border:0;height:100vh}}
  .scroll{height:100%;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .screen{display:none}.screen.on{display:block;animation:fade .35s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .top{display:flex;align-items:center;gap:12px;padding:30px 4px 18px}
  .round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-el);border:1px solid var(--border);flex-shrink:0}
  .round.accent{background:var(--accent);color:var(--on-accent);border:0}
  .top h1{font-size:21px;font-weight:700;flex:1}

  .elev{position:relative;border-radius:28px;border:1px solid rgba(255,255,255,.09);overflow:hidden;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.07) 0%,transparent 55%),linear-gradient(165deg,var(--surface-el) 0%,var(--void) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -28px rgba(0,0,0,.9)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px}

  /* بطاقة الميزانية */
  .budget{padding:18px}
  .b-top{display:flex;justify-content:space-between;align-items:center}
  .lbl{font-size:12.5px;color:var(--text-2);font-weight:500}
  .edit{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-2);background:rgba(255,255,255,.07);padding:5px 10px;border-radius:99px}
  .b-amt{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  .b-amt .v{font-size:32px;font-weight:700}
  .b-amt .of{font-size:13px;color:var(--text-3);font-weight:500}
  .meter{height:10px;border-radius:99px;background:rgba(255,255,255,.07);margin:14px 0 8px;overflow:hidden;position:relative}
  .meter span{display:block;height:100%;border-radius:99px}
  .meter i{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.5);border-radius:2px}
  .b-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .b-stat{background:rgba(255,255,255,.04);border-radius:16px;padding:10px 8px;text-align:center}
  .b-stat .v{font-size:14.5px;font-weight:700}
  .b-stat .k{font-size:10.5px;color:var(--text-3);margin-top:2px}

  .sec{display:flex;justify-content:space-between;align-items:center;margin:22px 6px 10px}
  .sec h2{font-size:14px;font-weight:600}
  .sec .act{font-size:11.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:5px;background:var(--surface-el);border:1px solid var(--border);padding:6px 11px;border-radius:99px}
  .sec .act.on{background:var(--accent);color:var(--on-accent);border-color:transparent}

  /* توزيع */
  .dist{padding:14px}
  .stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
  .lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);min-width:0}
  .lg i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .lg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg b{font-weight:600;color:var(--text)}

  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .chip .n{font-size:10.5px;opacity:.7}

  /* شبكة الفئات */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px;text-align:right;position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column}
  .tile .glow{position:absolute;inset:auto -30px -40px auto;width:110px;height:110px;border-radius:50%;filter:blur(30px);opacity:.18;pointer-events:none}
  .t-top{display:flex;justify-content:space-between;align-items:flex-start}
  .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px}
  .t-name{font-size:13.5px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-amt{font-size:16px;font-weight:700;margin-top:1px}
  .t-amt small{font-size:10.5px;color:var(--text-3);font-weight:500;font-family:var(--font-sans)}
  .t-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:auto;overflow:hidden}
  .t-bar span{display:block;height:100%;border-radius:99px}
  .t-foot{font-size:10.5px;color:var(--text-3);margin-top:6px;display:flex;justify-content:space-between}
  .tile.add{border-style:dashed;border-color:var(--border-strong);background:transparent;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:12.5px;font-weight:600}
  .tile.add .ic{background:var(--surface-el);color:var(--text)}

  /* وضع الترتيب */
  .order-row{display:flex;align-items:center;gap:12px;padding:11px 14px}
  .order-row + .order-row{border-top:1px solid var(--border)}
  .order-row .nm{flex:1;font-size:13.5px;font-weight:600}
  .arrows{display:flex;gap:6px}
  .arrows button{width:32px;height:32px;border-radius:50%;background:var(--surface-hi);display:grid;place-items:center;color:var(--text-2)}
  .arrows button:disabled{opacity:.25}
  .pos{width:22px;font-size:11px;color:var(--text-3);text-align:center}

  /* الورقة السفلية */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:6}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--surface-el);border-top:1px solid var(--border-strong);border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);z-index:7}
  .sheet.on{transform:none}
  .handle{width:38px;height:4.5px;border-radius:99px;background:rgba(255,255,255,.18);margin:10px auto 4px}
  .sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 12px}
  .sh-head h3{font-size:17px;font-weight:600}
  .close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--text-2)}
  .sh-body{overflow-y:auto;padding:0 16px 22px;scrollbar-width:none}
  .search{display:flex;align-items:center;gap:8px;height:44px;border-radius:16px;background:var(--void);border:1px solid var(--border);padding:0 14px;color:var(--text-3);margin-bottom:14px}
  .search input{flex:1;font-size:13px;outline:none;color:var(--text)}
  .search input::placeholder{color:var(--text-3)}
  .sub-t{font-size:11.5px;font-weight:600;color:var(--text-3);margin:4px 4px 10px}
  .pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
  .pk{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .pk .ic{width:56px;height:56px;border-radius:19px;transition:box-shadow .2s, transform .2s var(--ease)}
  .pk.sel .ic{box-shadow:0 0 0 2.5px var(--surface-el),0 0 0 4.5px currentColor;transform:scale(1.04)}
  .pk .nm{font-size:11px;font-weight:600;color:var(--text-2);text-align:center;line-height:1.25;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk.sel .nm{color:var(--text)}
  .pk .left{font-size:9.5px;color:var(--text-3);margin-top:-3px}
  .pk .chk{position:absolute;top:-6px;left:calc(50% - 36px);z-index:2;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:none;place-items:center;border:2px solid var(--surface-el)}
  .pk.sel .chk{display:grid}
  .pk.add .ic{background:transparent;border:1.5px dashed var(--border-strong);color:var(--text-2)}
  .recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}
  .recent::-webkit-scrollbar{display:none}
  .rc{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600}
  .rc .ic{width:30px;height:30px;border-radius:50%}
  .rc.sel{background:var(--accent);color:var(--on-accent);border-color:transparent}

  /* تفاصيل الفئة */
  .det-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .det-head .ic{width:52px;height:52px;border-radius:18px}
  .det-head .n{font-size:17px;font-weight:700}
  .det-head .s{font-size:12px;color:var(--text-3)}
  .det-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .da{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--surface);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-2)}
  .da svg{color:var(--text)}
  .tx{display:flex;align-items:center;gap:10px;padding:9px 2px}
  .tx + .tx{border-top:1px solid var(--border)}
  .tx .t{flex:1;font-size:12.5px;font-weight:600}
  .tx .d{font-size:10.5px;color:var(--text-3);font-weight:500}
  .tx .a{font-size:13px;font-weight:700}

  /* شاشة إضافة مصروف */
  .amt-wrap{text-align:center;margin:6px 0 18px}
  .amt-wrap .q{font-size:12.5px;color:var(--text-2)}
  .amt-wrap .big{font-size:52px;font-weight:700;color:var(--expense);line-height:1.15}
  .amt-wrap .big small{font-size:18px;opacity:.6;font-family:var(--font-sans);font-weight:500}
  .field-l{font-size:12px;font-weight:600;color:var(--text-2);margin:0 6px 8px;display:flex;justify-content:space-between;align-items:center}
  .field-l button{font-size:11.5px;color:var(--text-2);font-weight:600;display:flex;gap:4px;align-items:center}
  .qcats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
  .qcats::-webkit-scrollbar{display:none}
  .qc{flex-shrink:0;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:20px;background:var(--surface);border:1px solid var(--border);transition:all .2s var(--ease)}
  .qc .ic{width:40px;height:40px;border-radius:14px}
  .qc .nm{font-size:10.5px;font-weight:600;color:var(--text-2);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qc.sel{background:var(--surface-hi);border-color:currentColor}
  .qc.sel .nm{color:var(--text)}
  .budget-hint{margin:12px 2px 0;padding:11px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
  .budget-hint .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .budget-hint .bar span{display:block;height:100%;border-radius:99px}
  .row-field{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
  .row-field .k{font-size:11px;color:var(--text-3)}
  .row-field .v{font-size:14px;font-weight:600}
  .save{width:100%;margin-top:18px;padding:15px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:14.5px;font-weight:700}
</style>
</head>
<body>

<div class="preview-bar">
  <button class="pill on" data-screen="cats">شاشة الفئات</button>
  <button class="pill" data-screen="add">اختيار الفئة عند إضافة مصروف</button>
</div>

<div class="phone">
  <div class="scroll" id="scroll">

    <!-- ===================== شاشة الفئات ===================== -->
    <section class="screen on" id="cats">
      <div class="top">
        <button class="round press" aria-label="رجوع"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <h1>فئات المصاريف</h1>
        <button class="round accent press" aria-label="إضافة فئة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>

      <div class="elev budget">
        <div class="b-top">
          <span class="lbl">مصروف أكتوبر</span>
          <button class="edit press"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/></svg>السقف الشهري</button>
        </div>
        <div class="b-amt"><span class="v num" id="spentTotal"></span><span class="of num" id="ofLimit"></span></div>
        <div class="meter"><span id="meterFill"></span><i id="todayMark" title="المتوقع حتى اليوم"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)"><span id="meterPct"></span><span>الخط الأبيض = المتوقع حتى اليوم</span></div>
        <div class="b-stats">
          <div class="b-stat"><div class="v num" id="remain"></div><div class="k">متبقي</div></div>
          <div class="b-stat"><div class="v num" id="perDay"></div><div class="k">مسموح يوميًا</div></div>
          <div class="b-stat"><div class="v num">23</div><div class="k">يوم متبقي</div></div>
        </div>
      </div>

      <div class="sec"><h2>أين تذهب مصاريفك</h2></div>
      <div class="card dist"><div class="stack" id="stack"></div><div class="legend" id="legend"></div></div>

      <div class="sec">
        <h2>الفئات</h2>
        <button class="act press" id="orderBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4"/></svg><span>ترتيب</span></button>
      </div>
      <div id="catsBody"></div>
    </section>

    <!-- ===================== إضافة مصروف ===================== -->
    <section class="screen" id="add">
      <div class="top">
        <button class="round press" aria-label="إغلاق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <h1 style="text-align:center">مصروف جديد</h1>
        <span style="width:40px"></span>
      </div>
      <div class="amt-wrap"><div class="q">كم صرفت؟</div><div class="big num" dir="ltr">86 <small>ر.س</small></div></div>

      <div class="field-l"><span>الفئة</span><button id="openPicker">كل الفئات <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button></div>
      <div class="qcats" id="qcats"></div>
      <div class="budget-hint" id="budgetHint"></div>

      <div class="row-field">
        <div class="ic" style="width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg></div>
        <div style="flex:1"><div class="k">من حساب</div><div class="v">الراجحي</div></div>
        <div class="num" style="font-weight:700">12,480.50</div>
      </div>
      <button class="save press">حفظ المصروف</button>
      <div style="text-align:center;font-size:11px;color:var(--text-3);margin-top:12px">(لوحة الأرقام كما هي — مخفية هنا للتركيز على اختيار الفئة)</div>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="sh-head"><h3 id="shTitle"></h3><button class="close" data-close aria-label="إغلاق"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sh-body" id="shBody"></div>
  </div>
</div>

<script>
const ICONS = {"food": "<path d=\"M6 3v7a2 2 0 0 0 4 0V3\" /> <path d=\"M8 3v18\" /> <path d=\"M8 10v0\" /> <path d=\"M17 3c-1.7 0-3 2-3 5s1.3 5 3 5v9\" />", "groceries": "<path d=\"M3 6h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 9H6.5\" /> <circle cx=\"9.5\" cy=\"21\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" /> <circle cx=\"17\" cy=\"21\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" />", "coffee": "<path d=\"M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z\" /> <path d=\"M17 9h1.5a2.5 2.5 0 0 1 0 5H17\" /> <path d=\"M7 2.5c0 1-1 1-1 2s1 1 1 2\" /> <path d=\"M11 2.5c0 1-1 1-1 2s1 1 1 2\" />", "transport": "<path d=\"M3 13.5 5 8a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5.5\" /> <path d=\"M2.5 13.5h19v4a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1h-11v1a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1v-4Z\" /> <circle cx=\"7\" cy=\"15.5\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" /> <circle cx=\"17\" cy=\"15.5\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\" />", "bills": "<path d=\"M6 2.5h12v19l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V2.5Z\" /> <path d=\"M8.5 7.5h7M8.5 11h7M8.5 14.5h4\" />", "shopping": "<path d=\"M6 8h12l-1 12.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20.5L6 8Z\" /> <path d=\"M9 8V6a3 3 0 0 1 6 0v2\" />", "clothing": "<path d=\"M9 3 3 6.5 5.5 10 8 8.5V21h8V8.5l2.5 1.5L21 6.5 15 3a3 3 0 0 1-6 0Z\" />", "health": "<path d=\"M20.5 8.5c0 5-8.5 11.5-8.5 11.5S3.5 13.5 3.5 8.5a4.5 4.5 0 0 1 8.5-2 4.5 4.5 0 0 1 8.5 2Z\" />", "gym": "<path d=\"M4 9v6M2.5 10.5v3M20 9v6M21.5 10.5v3\" /> <path d=\"M7 12h10\" /> <path d=\"M7 8v8M17 8v8\" />", "sports": "<circle cx=\"12\" cy=\"12\" r=\"9\" /> <path d=\"M12 3v18M3 12h18\" /> <path d=\"M5.5 5.5c2 2.5 2 10.5 0 13M18.5 5.5c-2 2.5-2 10.5 0 13\" />", "fun": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.5\" /> <polygon points=\"10,9 15,12 10,15\" fill=\"currentColor\" stroke=\"none\" />", "subscriptions": "<path d=\"M4 12a8 8 0 0 1 13.7-5.7L20 8\" /> <path d=\"M20 4v4h-4\" /> <path d=\"M20 12a8 8 0 0 1-13.7 5.7L4 16\" /> <path d=\"M4 20v-4h4\" />", "commitments": "<rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2.5\" /> <path d=\"M8 8h8M8 12h8M8 16h5\" />", "home": "<path d=\"M4 11 12 4l8 7\" /> <path d=\"M6 9.5V20h12V9.5\" /> <path d=\"M10 20v-6h4v6\" />", "education": "<path d=\"M2 8 12 4l10 4-10 4L2 8Z\" /> <path d=\"M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5\" /> <path d=\"M21 8v6\" />", "travel": "<path d=\"M11 3 3.5 10 2 9.3 3 12l2.7 1 6.3-2.3\" /> <path d=\"M11 3 21 9l-8 3-3.5 8-1.2-1.5 1-3.2\" /> <path d=\"M3.5 10 12 13l3.5 8\" />", "pets": "<circle cx=\"6.5\" cy=\"10\" r=\"1.7\" /> <circle cx=\"10.5\" cy=\"6.5\" r=\"1.7\" /> <circle cx=\"13.5\" cy=\"6.5\" r=\"1.7\" /> <circle cx=\"17.5\" cy=\"10\" r=\"1.7\" /> <path d=\"M12 12c-3.5 0-6 2-6 4.5S8 21 12 21s6-2 6-4.5S15.5 12 12 12Z\" />", "gifts": "<rect x=\"3.5\" y=\"9\" width=\"17\" height=\"12\" rx=\"1.5\" /> <path d=\"M3.5 13.5h17\" /> <path d=\"M12 9v12\" /> <path d=\"M12 9C9 9 8 6 9.5 4.5S13 4 12 9Z\" /> <path d=\"M12 9c3 0 4-3 2.5-4.5S11 4 12 9Z\" />", "kids": "<circle cx=\"12\" cy=\"7\" r=\"3.2\" /> <path d=\"M5 21v-2a7 7 0 0 1 14 0v2\" />", "electronics": "<rect x=\"3\" y=\"4.5\" width=\"18\" height=\"12\" rx=\"1.5\" /> <path d=\"M2 19.5h20\" /> <path d=\"M9 19.5v-3M15 19.5v-3\" />", "insurance": "<path d=\"M12 3 4.5 6v6c0 5 3.5 8 7.5 9 4-1 7.5-4 7.5-9V6L12 3Z\" /> <path d=\"M9 12l2 2 4-4\" />", "phone": "<path d=\"M5.5 4.5h3.2L10 8l-1.8 1.4a12 12 0 0 0 6.4 6.4L16 14l3.5 1.3v3.2a1.5 1.5 0 0 1-1.6 1.5A15 15 0 0 1 4 5.6a1.5 1.5 0 0 1 1.5-1.1Z\" />", "internet": "<path d=\"M3.5 9a13 13 0 0 1 17 0\" /> <path d=\"M6.5 12.5a8.5 8.5 0 0 1 11 0\" /> <path d=\"M9.7 16a4 4 0 0 1 4.6 0\" /> <circle cx=\"12\" cy=\"19\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\" />", "beauty": "<path d=\"M12 2.5 13.5 8 19 9.5l-5.5 1.5L12 16.5 10.5 11 5 9.5 10.5 8Z\" /> <path d=\"M18.5 15.5 19.3 18l2.5.8-2.5.8-.8 2.5-.8-2.5-2.5-.8 2.5-.8Z\" />", "savings": "<path d=\"M4 12.5c0-3.5 3.5-6 8-6s8 1.8 8 4.5c0 1-.5 1.8-1.3 2.4\" /> <path d=\"M4 12.5v3a2 2 0 0 0 2 2h8.5a4 4 0 0 0 3.7-2.5\" /> <path d=\"M16 6.5c1-1 2-1 3 0\" /> <circle cx=\"9.5\" cy=\"13\" r=\"1\" fill=\"currentColor\" stroke=\"none\" />"};
const svg=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||''}</svg>`;
const I={
  check:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></svg>',
  plus:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  up:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15 12 8l7 7"/></svg>',
  down:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M13.5 8 16 10.5"/></svg>',
  target:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/></svg>',
  list:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
};
const cats=[
  {id:'c1',name:'مطاعم',icon:'food',color:'#FF9A4D',spent:820,limit:900,uses:24},
  {id:'c2',name:'بقالة',icon:'groceries',color:'#2EE6C8',spent:1240,limit:1500,uses:18},
  {id:'c3',name:'قهوة',icon:'coffee',color:'#FFBF47',spent:310,limit:250,uses:31},
  {id:'c4',name:'مواصلات',icon:'transport',color:'#45C8FF',spent:450,limit:800,uses:9},
  {id:'c5',name:'فواتير',icon:'bills',color:'#A1A1AD',spent:690,limit:700,uses:4},
  {id:'c6',name:'تسوق',icon:'shopping',color:'#FF5F6D',spent:540,limit:null,uses:7},
  {id:'c7',name:'صحة',icon:'health',color:'#3ee08f',spent:120,limit:400,uses:2},
  {id:'c8',name:'ترفيه',icon:'fun',color:'#8b7bff',spent:260,limit:300,uses:6},
  {id:'c9',name:'اتصالات',icon:'phone',color:'#E4E4EA',spent:230,limit:230,uses:2},
  {id:'c10',name:'هدايا',icon:'gifts',color:'#FF9A4D',spent:0,limit:null,uses:1},
];
const LIMIT=7000, DAY=8, DAYS=31;
let filter='all', ordering=false, selected='c1', sheetMode=null;
const fmt=n=>n.toLocaleString('en-US');
const pctOf=c=>c.limit?c.spent/c.limit*100:null;
const tone=p=>p===null?'var(--text-3)':p>=100?'var(--expense)':p>=80?'var(--warn)':'var(--income)';
const icBox=(c,s=20)=>`<div class="ic" style="background:${c.color}1f;color:${c.color}">${svg(c.icon,s)}</div>`;

function renderBudget(){
  const total=cats.reduce((s,c)=>s+c.spent,0), p=total/LIMIT*100;
  document.getElementById('spentTotal').textContent=fmt(total);
  document.getElementById('ofLimit').textContent='/ '+fmt(LIMIT)+' ر.س';
  const f=document.getElementById('meterFill');f.style.width=Math.min(100,p)+'%';f.style.background=tone(p);
  document.getElementById('todayMark').style.right=(DAY/DAYS*100)+'%';
  document.getElementById('meterPct').innerHTML=`<b class="num" style="color:${tone(p)}">${Math.round(p)}%</b> من السقف`;
  document.getElementById('remain').textContent=fmt(Math.max(0,LIMIT-total));
  document.getElementById('perDay').textContent=fmt(Math.round(Math.max(0,LIMIT-total)/(DAYS-DAY)));
  const sorted=[...cats].filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent);
  document.getElementById('stack').innerHTML=sorted.map(c=>`<span style="flex-grow:${c.spent};background:${c.color}"></span>`).join('');
  const top=sorted.slice(0,5), rest=sorted.slice(5).reduce((s,c)=>s+c.spent,0);
  document.getElementById('legend').innerHTML=top.map(c=>`<div class="lg"><i style="background:${c.color}"></i><span>${c.name}</span><b class="num">${Math.round(c.spent/total*100)}%</b></div>`).join('')
    +(rest?`<div class="lg"><i style="background:var(--surface-hi)"></i><span>أخرى</span><b class="num">${Math.round(rest/total*100)}%</b></div>`:'');
}

function renderCats(){
  const counts={all:cats.length,over:cats.filter(c=>pctOf(c)>=100).length,near:cats.filter(c=>{const p=pctOf(c);return p>=80&&p<100}).length,none:cats.filter(c=>!c.limit).length};
  const F=[['all','الكل'],['over','تجاوزت'],['near','قاربت'],['none','بدون ميزانية']];
  const btn=document.getElementById('orderBtn');btn.classList.toggle('on',ordering);btn.querySelector('span').textContent=ordering?'تم':'ترتيب';
  const body=document.getElementById('catsBody');
  if(ordering){
    body.innerHTML=`<div style="font-size:11.5px;color:var(--text-3);margin:0 6px 10px">الأعلى يظهر أولًا عند اختيار الفئة في مصروف جديد</div><div class="card">${cats.map((c,i)=>`
      <div class="order-row"><span class="pos num">${i+1}</span>${icBox(c,18)}<span class="nm">${c.name}</span>
      <div class="arrows"><button data-mv="${i}:-1" ${i===0?'disabled':''} aria-label="لأعلى">${I.up}</button><button data-mv="${i}:1" ${i===cats.length-1?'disabled':''} aria-label="لأسفل">${I.down}</button></div></div>`).join('')}</div>`;
    return;
  }
  const list=cats.filter(c=>{const p=pctOf(c);return filter==='all'||(filter==='over'&&p>=100)||(filter==='near'&&p>=80&&p<100)||(filter==='none'&&!c.limit)});
  body.innerHTML=`<div class="chips">${F.map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${l}<span class="n num">${counts[k]}</span></button>`).join('')}</div>
    <div class="grid">${list.map(c=>{const p=pctOf(c);const t=tone(p);
      const badge=p===null?'':c.spent>c.limit?`<span class="badge" style="background:rgba(255,95,109,.14);color:var(--expense)">تجاوز</span>`:p>=100?`<span class="badge" style="background:rgba(255,95,109,.14);color:var(--expense)">الحد</span>`:p>=80?`<span class="badge" style="background:rgba(255,191,71,.14);color:var(--warn)">قارب</span>`:'';
      return `<button class="tile press" data-cat="${c.id}"><div class="glow" style="background:${c.color}"></div>
        <div class="t-top">${icBox(c)}${badge}</div>
        <div class="t-name">${c.name}</div>
        <div class="t-amt num">${fmt(c.spent)} <small>ر.س</small></div>
        ${p===null?`<div class="t-foot" style="margin-top:auto"><span>بدون ميزانية</span></div>`:
        `<div class="t-bar" style="margin-top:10px"><span style="width:${Math.min(100,p)}%;background:${t}"></span></div>
         <div class="t-foot"><span style="color:${p>=80?t:'var(--text-3)'}">${c.spent>c.limit?'تجاوز '+fmt(c.spent-c.limit):c.spent===c.limit?'وصلت للحد':'متبقي '+fmt(c.limit-c.spent)}</span><span class="num">${fmt(c.limit)}</span></div>`}
      </button>`;}).join('')}
      ${filter==='all'?`<button class="tile add press"><div class="ic">${I.plus()}</div>فئة جديدة</button>`:''}
    </div>`;
}

function catDetail(id){
  const c=cats.find(x=>x.id===id), p=pctOf(c);
  sheetMode='detail';
  document.getElementById('shTitle').textContent='تفاصيل الفئة';
  document.getElementById('shBody').innerHTML=`
    <div class="det-head">${icBox(c,24)}<div><div class="n">${c.name}</div><div class="s">${c.uses} حركة هذا الشهر</div></div></div>
    <div class="card" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">مصروف الشهر</span><span class="num" style="font-size:22px;font-weight:700">${fmt(c.spent)} <span style="font-size:12px;color:var(--text-3);font-family:var(--font-sans)">ر.س</span></span></div>
      ${p===null?`<div style="font-size:12px;color:var(--text-3);margin-top:8px">لا توجد ميزانية لهذه الفئة</div>`:`
      <div class="meter" style="margin:12px 0 6px"><span style="width:${Math.min(100,p)}%;background:${tone(p)}"></span></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)"><span style="color:${tone(p)}" class="num">${Math.round(p)}%</span><span class="num">الميزانية ${fmt(c.limit)}</span></div>`}
    </div>
    <div class="det-actions">
      <button class="da press">${I.target}${c.limit?'تعديل الميزانية':'تحديد ميزانية'}</button>
      <button class="da press">${I.list}كل الحركات</button>
      <button class="da press">${I.edit}تعديل الفئة</button>
    </div>
    <div class="sub-t">آخر الحركات</div>
    <div class="card" style="padding:4px 14px">
      <div class="tx"><div style="flex:1"><div class="t">${c.name} — الحمراء</div><div class="d">اليوم</div></div><div class="a num" dir="ltr">−64</div></div>
      <div class="tx"><div style="flex:1"><div class="t">${c.name}</div><div class="d">أمس</div></div><div class="a num" dir="ltr">−38</div></div>
      <div class="tx"><div style="flex:1"><div class="t">${c.name} — طلب</div><div class="d">٥ أكتوبر</div></div><div class="a num" dir="ltr">−112</div></div>
    </div>`;
  openSheet();
}

/* ===== اختيار الفئة ===== */
const byUse=()=>[...cats].sort((a,b)=>b.uses-a.uses);
function renderQuick(){
  const sel=cats.find(c=>c.id===selected);
  const quick=[sel,...byUse().filter(c=>c.id!==selected)].slice(0,6);
  document.getElementById('qcats').innerHTML=quick.map(c=>`<button class="qc press ${c.id===selected?'sel':''}" style="color:${c.color}" data-pick="${c.id}">${icBox(c)}<span class="nm">${c.name}</span></button>`).join('')
    +`<button class="qc press" id="moreCats" style="color:var(--text-2)"><div class="ic" style="background:var(--surface-hi)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></div><span class="nm">المزيد</span></button>`;
  const p=pctOf(sel), after=sel.spent+86, pa=sel.limit?after/sel.limit*100:null;
  document.getElementById('budgetHint').innerHTML = sel.limit
    ? `${icBox(sel,15).replace('class="ic"','class="ic" style="width:28px;height:28px;border-radius:9px;background:'+sel.color+'1f;color:'+sel.color+'"')}
       <div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>بعد هذا المصروف</span><span class="num" style="color:${tone(pa)};font-weight:700">${fmt(after)} / ${fmt(sel.limit)}</span></div>
       <div class="bar"><span style="width:${Math.min(100,pa)}%;background:${tone(pa)}"></span></div></div>`
    : `<span>فئة <b style="color:var(--text)">${sel.name}</b> بدون ميزانية شهرية</span>`;
}
function renderPicker(q=''){
  sheetMode='picker';
  document.getElementById('shTitle').textContent='اختر الفئة';
  const ql=q.trim();
  const list=cats.filter(c=>!ql||c.name.includes(ql));
  const tile=c=>{const p=pctOf(c);return `<button class="pk press ${c.id===selected?'sel':''}" style="color:${c.color}" data-pick="${c.id}">
      <span class="chk">${I.check}</span>${icBox(c,22)}<span class="nm">${c.name}</span>
      <span class="left num" style="color:${p!==null&&p>=80?tone(p):'var(--text-3)'}">${p===null?'—':c.spent>c.limit?'تجاوز':c.spent===c.limit?'وصلت للحد':'متبقي '+fmt(c.limit-c.spent)}</span></button>`;};
  document.getElementById('shBody').innerHTML=`
    <label class="search">${I.search}<input id="q" placeholder="ابحث عن فئة..." value="${ql}"></label>
    ${ql?'':`<div class="sub-t">الأكثر استخدامًا</div><div class="recent">${byUse().slice(0,4).map(c=>`<button class="rc press ${c.id===selected?'sel':''}" data-pick="${c.id}">${icBox(c,15)}${c.name}</button>`).join('')}</div>
    <div class="sub-t">كل الفئات · بترتيبك</div>`}
    <div class="pick-grid">${list.map(tile).join('')}
      ${ql?'':`<button class="pk add press"><div class="ic">${I.plus(22)}</div><span class="nm">فئة جديدة</span><span class="left">&nbsp;</span></button>`}
    </div>
    ${list.length===0?`<div style="text-align:center;color:var(--text-3);font-size:12.5px;padding:24px 0">لا توجد فئة بهذا الاسم</div>`:''}`;
  const inp=document.getElementById('q');
  inp.oninput=()=>{const v=inp.value;renderPicker(v);const n=document.getElementById('q');n.focus();n.setSelectionRange(v.length,v.length);};
}

function openSheet(){document.getElementById('sheet').classList.add('on');document.getElementById('scrim').classList.add('on');}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('scrim').classList.remove('on');sheetMode=null;}

document.addEventListener('click',e=>{
  const sc=e.target.closest('[data-screen]');
  if(sc){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('on',b===sc));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===sc.dataset.screen));closeSheet();document.getElementById('scroll').scrollTop=0;return;}
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;renderCats();return;}
  const mv=e.target.closest('[data-mv]');if(mv){const [i,d]=mv.dataset.mv.split(':').map(Number);[cats[i],cats[i+d]]=[cats[i+d],cats[i]];renderCats();return;}
  if(e.target.closest('#orderBtn')){ordering=!ordering;renderCats();return;}
  const ct=e.target.closest('[data-cat]');if(ct){catDetail(ct.dataset.cat);return;}
  const pk=e.target.closest('[data-pick]');if(pk){selected=pk.dataset.pick;renderQuick();if(sheetMode==='picker'){renderPicker();setTimeout(closeSheet,220);}return;}
  if(e.target.closest('#moreCats')||e.target.closest('#openPicker')){renderPicker();openSheet();return;}
  if(e.target.closest('[data-close]')||e.target.id==='scrim'){closeSheet();}
});
renderBudget();renderCats();renderQuick();
</script>
</body>
</html>
