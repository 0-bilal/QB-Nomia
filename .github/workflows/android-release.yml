name: Build Android APK

# يبني تطبيق أندرويد حقيقي (APK) من مشروع Capacitor بمجلد android/ على كل
# دفعة (push) للفرع الرئيسي، وينشره كملف قابل للتحميل مباشرة عبر GitHub
# Release ثابت الرابط (android-latest) — بدون أي نشر على Google Play.
#
# هذا يشتغل على خوادم GitHub نفسها (إنترنت كامل بدون قيود)، عكس بيئة
# التطوير السحابية اللي ما تقدر توصل لخوادم Android SDK مباشرة.

on:
  push:
    branches:
      - claude/qb-nomia-wallet-app-knw4u4
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (Capacitor mode)
        run: npm run build:capacitor

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # الافتراضي "tools platform-tools"، وحزمة "tools" القديمة لم تعد موجودة بأدوات SDK الحديثة فيفشل sdkmanager.
          packages: platform-tools

      # المفتاح يُحفظ بـ GitHub Secrets (base64) ويُفك لملف مؤقت خارج المستودع.
      # بدون الأسرار يُبنى APK تجريبي (debug) كالسابق حتى ما يتوقف النشر.
      - name: Decode signing keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 غير مضبوط — يُبنى APK تجريبي (debug) بمفتاح مؤقت، والتحديث فوق التطبيق المثبّت لن يعمل."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        env:
          QB_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          QB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../qb-nomia.apk

      - name: Build debug APK (no signing secrets)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../qb-nomia.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # الإصدارات القديمة (3.4.0 وقبل) تنزّل التحديث من app-debug.apk — نرفع نفس الملف بالاسمين حتى ما ينكسر زر التحديث فيها.
      - name: Prepare APK files
        run: cp qb-nomia.apk app-debug.apk

      - name: Publish rolling release with APK
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: android-latest
          name: "QB-Nomia (أحدث بناء أندرويد)"
          body: |
            آخر بناء تلقائي لتطبيق أندرويد (APK) من الفرع الرئيسي، للتثبيت اليدوي المباشر على الجهاز، غير منشور على Google Play.
            ${{ steps.ks.outputs.signed == 'true' && 'موقّع بمفتاح ثابت: التحديث ينزل فوق التطبيق المثبّت.' || 'بناء تجريبي (debug) بمفتاح مؤقت.' }}

            الالتزام: ${{ github.sha }}
          artifacts: qb-nomia.apk,app-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
