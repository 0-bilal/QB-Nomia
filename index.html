<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="QB-Nomia — محفظتك المالية الشخصية" />
    <title>QB-Nomia</title>
    <script>
      // يكمل تحويل 404.html: يرجّع المسار الأصلي (من ?p=) قبل ما يشتغل React Router
      ;(function () {
        var params = new URLSearchParams(location.search)
        var redirectPath = params.get('p')
        if (redirectPath) {
          params.delete('p')
          var rest = params.toString()
          var newUrl = location.pathname + redirectPath.slice(1) + (rest ? '?' + rest : '') + location.hash
          window.history.replaceState(null, '', newUrl)
        }
      })()
    </script>
    <script>
      // ارتفاع حقيقي للشاشة كمتغيّر CSS بدل الاعتماد على 100dvh وحده: بعض
      // متصفحات الجوال ما تعيد حساب dvh فورًا بعد إعادة تحميل مُطلَقة من
      // JS (زي زر "تحديث التطبيق")، فيبقى شريط المتصفح محسوب بارتفاع أكبر
      // من الحقيقي لحظيًا ويطلع شريط التنقل السفلي جزئيًا برا الشاشة.
      // قياس window.innerHeight مباشرة عند كل تغيير يصلّح هذا فورًا.
      ;(function () {
        function setAppHeight() {
          document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px')
        }
        setAppHeight()
        window.addEventListener('resize', setAppHeight)
        window.addEventListener('orientationchange', setAppHeight)
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppHeight)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
